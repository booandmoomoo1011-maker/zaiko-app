const firebaseConfig={apiKey:'AIzaSyCkkIx44FVKmQdO6kQK_uQVloJccRo2cYo',authDomain:'zaiko2017inb.firebaseapp.com',projectId:'zaiko2017inb',storageBucket:'zaiko2017inb.firebasestorage.app',messagingSenderId:'705085250436',appId:'1:705085250436:web:f369b4981119887fa25bd1'};
const db=getFirestore(initializeApp(firebaseConfig));

const params=new URLSearchParams(location.search);const role=params.get('role')==='admin'?'admin':'editor';

let state={stores:[],allItems:[],nextItemId:903,inventoryYear:null};let history=[];let actor='';let deepLinkOpened=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

function showInstallHelp(){const ua=navigator.userAgent||'',inLine=/Line\//i.test(ua),isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);$('pwaHelpText').innerHTML=(inLine?'LINEの中では追加できません。右上または右下のメニューからSafari／Chromeで開いてください。<br><br>':'')+(isIOS?'Safari下部の共有ボタン（□に↑）から「ホーム画面に追加」を選んでください。':'Chrome右上の「︙」から「アプリをインストール」または「ホーム画面に追加」を選んでください。');$('pwaHelp').classList.remove('hidden')}
function setStatus(t,bad=false){$('status').textContent=(bad?'● ':'● ')+t;$('status').style.color=bad?'#ff9999':'#b9dfca'}
async function sha256(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function editorNamesKey(){return 'zaikoPriceEditorNames_'+fixedStore}
function loadEditorNames(){
  let names=[];try{names=JSON.parse(localStorage.getItem(editorNamesKey())||'[]')}catch(_){}
  if(!Array.isArray(names))names=[];
  const old=String(localStorage.getItem('zaikoPriceEditorName_'+fixedStore)||'').trim();
  if(old&&old!=='店舗編集者'&&!names.includes(old))names.unshift(old);
  return [...new Set(names.map(name=>String(name).trim()).filter(name=>name&&name!=='店舗編集者'))];
}
function saveEditorNames(names){localStorage.setItem(editorNamesKey(),JSON.stringify([...new Set(names)]))}
function chooseEditorName(){return new Promise(resolve=>{
  let names=loadEditorNames();
  const draw=()=>{
    const last=String(localStorage.getItem('zaikoPriceEditorName_'+fixedStore)||'').trim();
    openModal(`<h2>編集者名を選択</h2><p style="line-height:1.7;color:#625e56">価格の変更履歴に残す実際のお名前を選んでください。</p><div class="row"><label>登録済みの名前</label><select class="field" id="savedEditorName"><option value="">選択してください</option>${names.map(name=>`<option value="${esc(name)}" ${name===last?'selected':''}>${esc(name)}</option>`).join('')}</select></div><div class="row"><label>新しい名前を登録</label><input class="field" id="newEditorName" autocomplete="name" placeholder="編集者名を入力してください"></div><div class="actions"><button class="btn danger" id="deleteEditorName" type="button" ${names.length?'':'disabled'}>選んだ名前を削除</button><button class="btn gold" id="useEditorName" type="button">この名前で進む</button></div>`);
    $('modalBg').onclick=()=>{};
    $('useEditorName').onclick=()=>{const entered=$('newEditorName').value.trim(),selected=$('savedEditorName').value.trim(),name=entered||selected;if(!name){alert('編集者名を入力または選択してください。');return}if(name==='店舗編集者'){alert('実際の編集者名を入力してください。');return}if(!names.includes(name)){names.push(name);saveEditorNames(names)}localStorage.setItem('zaikoPriceEditorName_'+fixedStore,name);closeModal();$('modalBg').onclick=e=>{if(e.target===$('modalBg'))closeModal()};resolve(name)};
    $('deleteEditorName').onclick=()=>{const selected=$('savedEditorName').value.trim();if(!selected){alert('削除する名前を選択してください。');return}if(!confirm(`「${selected}」をこの端末の候補から削除しますか？\n過去の価格改定履歴は削除されません。`))return;names=names.filter(name=>name!==selected);saveEditorNames(names);if(localStorage.getItem('zaikoPriceEditorName_'+fixedStore)===selected)localStorage.removeItem('zaikoPriceEditorName_'+fixedStore);draw()};
  };
  draw();
})}
async function authenticate(){
  if(role==='admin'){
    const saved=localStorage.getItem('zaikoApp_rolePw');if(!saved)throw new Error('先に棚卸管理者画面で管理者パスワードを設定してください');
    if(localStorage.getItem(ADMIN_TRUST_KEY)!=='1'){
      const pw=prompt('棚卸管理者パスワードを入力してください。');if(pw===null)throw new Error('管理者確認を中止しました');
      if(await sha256(pw)!==saved)throw new Error('管理者パスワードが違います');
      if(confirm('この携帯・パソコンでは、次回から管理者パスコードを省略しますか？\n\n共有端末では「キャンセル」を選んでください。'))localStorage.setItem(ADMIN_TRUST_KEY,'1');
    }
    actor=localStorage.getItem('zaikoPriceAdminName')||'管理者1';
    if(!localStorage.getItem('zaikoPriceAdminName')){const selected=prompt('変更履歴に記録する管理者名を入力してください。',actor);if(!selected?.trim())throw new Error('管理者名を確認できません');actor=selected.trim();localStorage.setItem('zaikoPriceAdminName',actor)}
  }else{
    if(!fixedStore)throw new Error('店舗編集者URLを確認してください');actor=await chooseEditorName();
  }
  $('roleLabel').textContent=role==='admin'?'管理者：'+actor:'編集者：'+actor;
  $('forgetAdminBtn').classList.toggle('hidden',role!=='admin');
  document.querySelectorAll('.admin-only').forEach(e=>e.classList.toggle('hidden',role!=='admin'));
}
function storeName(id){return state.stores.find(s=>Number(s.id)===Number(id))?.name||'店舗'+id}
function effectiveStores(){return role==='admin'?state.stores:state.stores.filter(s=>Number(s.id)===Number(fixedStore))}
function canAccessItem(item){return !!item&&(role==='admin'||Number(item.storeId)===Number(fixedStore))}
function setupStores(){const current=$('store').value;$('store').innerHTML=(role==='admin'?'<option value="all">全店舗</option>':'')+effectiveStores().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');$('store').value=current&&[...$('store').options].some(o=>o.value===current)?current:(role==='admin'?'all':String(fixedStore))}
function render(){
  setupStores();const store=$('store').value;const q=$('search').value.trim().toLowerCase();

function openModal(html){$('modal').innerHTML=html;$('modalBg').classList.remove('hidden')}

function openPrice(id){const i=state.allItems.find(x=>Number(x.id)===id);if(!canAccessItem(i)){alert('この商品の変更権限がありません。');return}openModal(`<h2>価格を変更</h2><div class="row"><label>商品</label><div>${esc(storeName(i.storeId))} ／ <strong>${esc(i.name)}</strong></div></div><div class="grid"><div class="row"><label>変更前価格</label><input class="field" value="${Number(i.price)||0}" disabled></div><div class="row"><label class="price-change-label">変更後価格</label><input class="field price-change-input" id="newPrice" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="row"><label>価格変更日</label><input class="field" id="effectiveDate" type="date" value="${new Date().toLocaleDateString('sv-SE')}"></div><div class="row"><label>仕入先</label><input class="field" id="supplier" value="${esc(i.supplier||i.cat||'')}"></div></div><div class="row"><label>変更者</label><input class="field" value="${esc(actor)}" disabled></div><div class="row"><label>備考（任意）</label><input class="field" id="note"></div><div class="actions"><button class="btn" id="cancel">戻る</button><button class="btn gold" id="save">内容を確認</button></div>`);$('cancel').onclick=closeModal;$('save').onclick=()=>confirmPrice(i)}
function confirmPrice(i){const newPrice=Number($('newPrice').value);const date=$('effectiveDate').value;const supplier=$('supplier').value.trim();const note=$('note').value.trim();if(!Number.isFinite(newPrice)||newPrice<0||newPrice===Number(i.price)){alert('現在と異なる正しい新価格を入力してください。');return}if(!date){alert('価格変更日を入力してください。');return}openModal(`<h2>変更内容の最終確認</h2><div class="notice">${esc(i.name)}<br><strong>${yen(i.price)} → ${yen(newPrice)}</strong><br>${esc(date)} ／ ${esc(supplier||'仕入先未設定')} ／ ${esc(actor)}</div><p>確定すると価格改定履歴へ追加し、棚卸の現在価格へ反映します。過年度記録は変更しません。</p><div class="actions"><button class="btn" id="back">戻る</button><button class="btn gold" id="commit">確定して反映</button></div>`);$('back').onclick=()=>openPrice(i.id);$('commit').onclick=()=>commitPrice(i.id,newPrice,date,supplier,note)}
async function commitPrice(id,newPrice,effectiveDate,supplier,note){$('commit').disabled=true;setStatus('価格を保存中');try{const rec=doc(historyCol);await runTransaction(db,async tx=>{const snap=await tx.get(inventoryRef);if(!snap.exists())throw new Error('棚卸データがありません');const data=snap.data();const items=[...(data.allItems||[])];const index=items.findIndex(x=>Number(x.id)===Number(id));if(index<0)throw new Error('商品が見つかりません');if(!canAccessItem(items[index]))throw new Error('この商品の変更権限がありません');const old=Number(items[index].price)||0;const oldSupplier=items[index].supplier||'';const baseline=Number.isFinite(Number(items[index].previousYearPrice))?Number(items[index].previousYearPrice):old;const changedAt=nowIso();items[index]={...items[index],price:newPrice,supplier,previousYearPrice:baseline,priceChangedSinceLastYear:newPrice!==baseline,priceChangedAt:changedAt,priceChangedBy:actor,latestPriceHistoryId:rec.id,updatedAt:new Date().toLocaleString('ja-JP')};tx.update(inventoryRef,{allItems:items,updatedAt:changedAt});tx.set(rec,{type:'price_change',itemId:id,storeId:Number(items[index].storeId),productName:items[index].name||'',unit:items[index].unit||'',supplier,oldSupplier,oldPrice:old,newPrice,effectiveDate,changedBy:actor,note,createdAt:changedAt,inventoryYear:Number(data.inventoryYear)||null});});closeModal();setStatus('クラウド保存済み')}catch(e){console.error(e);setStatus('保存失敗',true);alert(e.message||'保存できませんでした。通信状態と権限を確認してください。')}}

async function loadPriceHistory(){const snap=await getDocs(query(historyCol,orderBy('createdAt','desc'),limit(500)));history=snap.docs.map(d=>({id:d.id,...d.data()}));return history}
async function undoLatestPrice(itemId){
  const button=document.querySelector(`[data-undo="${itemId}"]`);if(button)button.disabled=true;setStatus('戻せる登録を確認中');
  try{
    await loadPriceHistory();
    const target=history.find(h=>h.type==='price_change'&&Number(h.itemId)===Number(itemId));
    if(!target)throw new Error('戻せる価格変更履歴が見つかりません');
    const item=state.allItems.find(i=>Number(i.id)===Number(itemId));
    if(!canAccessItem(item))throw new Error('この商品の変更権限がありません');
    if(Number(item.price)!==Number(target.newPrice))throw new Error('その後に別の価格変更があるため、この登録は戻せません。画面を更新してください');
    openModal(`<h2>誤登録を取り消す</h2><div class="undo-note">${esc(storeName(item.storeId))} ／ <strong>${esc(item.name)}</strong><br>${yen(target.newPrice)} → <strong>${yen(target.oldPrice)}</strong> に戻します。<br>この間違った価格改定履歴も削除されます。</div><p>2025年度の記録と他の商品は変更しません。本当にこの最新登録を取り消しますか？</p><div class="actions"><button class="btn" id="undoCancel">戻る</button><button class="btn danger" id="undoCommit">取り消して元に戻す</button></div>`);
    $('undoCancel').onclick=closeModal;$('undoCommit').onclick=()=>commitPriceUndo(target);
  }catch(e){console.error(e);setStatus('確認失敗',true);alert(e.message||'戻せる登録を確認できませんでした');if(button)button.disabled=false}
}
async function commitPriceUndo(target){
  $('undoCommit').disabled=true;setStatus('誤登録を取り消し中');
  try{
    const targetRef=doc(historyCol,target.id);
    const previous=history.find(h=>h.type==='price_change'&&Number(h.itemId)===Number(target.itemId)&&h.id!==target.id);
    await runTransaction(db,async tx=>{
      const [inventorySnap,historySnap]=await Promise.all([tx.get(inventoryRef),tx.get(targetRef)]);
      if(!inventorySnap.exists()||!historySnap.exists())throw new Error('対象データが更新されたため中止しました');
      const data=inventorySnap.data(),items=[...(data.allItems||[])];const index=items.findIndex(i=>Number(i.id)===Number(target.itemId));
      if(index<0||!canAccessItem(items[index]))throw new Error('この商品の変更権限がありません');
      if(Number(items[index].price)!==Number(target.newPrice))throw new Error('その後に別の価格変更があるため中止しました');
      if(items[index].latestPriceHistoryId&&items[index].latestPriceHistoryId!==target.id)throw new Error('この登録は最新ではないため戻せません');
      const oldPrice=Number(target.oldPrice)||0;const baseline=Number(items[index].previousYearPrice);
      items[index]={...items[index],price:oldPrice,supplier:target.oldSupplier!==undefined?target.oldSupplier:items[index].supplier,priceChangedSinceLastYear:Number.isFinite(baseline)?oldPrice!==baseline:false,priceChangedAt:previous?.createdAt||null,priceChangedBy:previous?.changedBy||'',latestPriceHistoryId:previous?.id||null,updatedAt:new Date().toLocaleString('ja-JP')};
      tx.update(inventoryRef,{allItems:items,updatedAt:nowIso()});tx.delete(targetRef);
    });
    closeModal();setStatus('誤登録を取り消しました');
  }catch(e){console.error(e);setStatus('取消失敗',true);alert(e.message||'登録を戻せませんでした')}
}
function openNew(){const stores=effectiveStores();openModal(`<h2>新商品を追加</h2><div class="grid"><div class="row"><label>店舗</label><select class="field" id="nStore">${stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="row"><label>商品名</label><input class="field" id="nName"></div><div class="row"><label>仕入先</label><input class="field" id="nSupplier"></div><div class="row"><label>カテゴリー</label><input class="field" id="nCat"></div><div class="row"><label>単位</label><input class="field" id="nUnit" placeholder="個・kg・本など"></div><div class="row"><label>初回価格</label><input class="field" id="nPrice" type="number" min="0" step="0.01"></div><div class="row"><label>登録日</label><input class="field" id="nDate" type="date" value="${new Date().toLocaleDateString('sv-SE')}"></div><div class="row"><label>税率</label><select class="field" id="nTax"><option value="">未設定</option><option value="8">8%</option><option value="10">10%</option></select></div></div><div class="actions"><button class="btn" id="cancel">戻る</button><button class="btn gold" id="add">棚卸へ追加</button></div>`);$('cancel').onclick=closeModal;$('add').onclick=addNew}
async function addNew(){const storeId=Number($('nStore').value),name=$('nName').value.trim(),supplier=$('nSupplier').value.trim(),cat=$('nCat').value.trim()||supplier||'その他',unit=$('nUnit').value.trim(),price=Number($('nPrice').value),effectiveDate=$('nDate').value,taxRate=Number($('nTax').value)||null;if(!name||!unit||!Number.isFinite(price)||price<0||!effectiveDate){alert('商品名・単位・初回価格・登録日を確認してください。');return}if(state.allItems.some(i=>Number(i.storeId)===storeId&&String(i.name).normalize('NFKC').replace(/\s/g,'').toLowerCase()===name.normalize('NFKC').replace(/\s/g,'').toLowerCase())){alert('同じ店舗に同名の商品があります。重複追加を中止しました。');return}if(!confirm(`${storeName(storeId)}へ「${name}」を ${yen(price)} で追加しますか？`))return;setStatus('新商品を保存中');try{const rec=doc(historyCol);await runTransaction(db,async tx=>{const snap=await tx.get(inventoryRef);if(!snap.exists())throw new Error('棚卸データがありません');const data=snap.data(),items=[...(data.allItems||[])];if(items.some(i=>Number(i.storeId)===storeId&&String(i.name).normalize('NFKC').replace(/\s/g,'').toLowerCase()===name.normalize('NFKC').replace(/\s/g,'').toLowerCase()))throw new Error('同名商品が登録されています');const maxExisting=items.reduce((max,item)=>Math.max(max,Number(item.id)||0),0);const id=Math.max(Number(data.nextItemId)||903,maxExisting+1,903);const item={id,storeId,name,cat,supplier,qty:0,unit,price,taxRate,previousYearPrice:price,priceChangedSinceLastYear:false,newProduct:true,active:true,done:false,createdAt:new Date().toLocaleString('ja-JP'),updatedAt:new Date().toLocaleString('ja-JP'),image:''};items.push(item);tx.update(inventoryRef,{allItems:items,nextItemId:id+1,updatedAt:nowIso()});tx.set(rec,{type:'new_product',itemId:id,storeId,productName:name,unit,supplier,oldPrice:null,newPrice:price,effectiveDate,changedBy:actor,taxRate,createdAt:nowIso(),inventoryYear:Number(data.inventoryYear)||null});});closeModal();setStatus('クラウド保存済み')}catch(e){console.error(e);setStatus('保存失敗',true);alert(e.message||'保存できませんでした')}}
async function openHistory(){openModal('<h2>価格改定履歴</h2><div id="hist" class="history"><div class="empty">読み込んでいます…</div></div><div class="actions"><button class="btn" id="close">閉じる</button></div>');$('close').onclick=closeModal;try{await loadPriceHistory();const allowed=role==='admin'?history:history.filter(h=>Number(h.storeId)===Number(fixedStore));$('hist').innerHTML=allowed.length?allowed.map(h=>`<div class="history-item"><strong>${esc(h.productName)}</strong>　${h.type==='new_product'?'新商品':yen(h.oldPrice)+' → '+yen(h.newPrice)}<small>${esc(storeName(h.storeId))} ／ ${esc(h.effectiveDate||'')} ／ ${esc(h.changedBy||'')} ／ ${esc(h.supplier||'')}</small></div>`).join(''):'<div class="empty">履歴はまだありません</div>'}catch(e){$('hist').innerHTML='<div class="empty">履歴を読み込めませんでした</div>'}}
$('search').oninput=render;$('store').onchange=render;$('newBtn').onclick=openNew;$('historyBtn').onclick=openHistory;
$('pwaInstallBtn').onclick=async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(_){}deferredInstallPrompt=null}else showInstallHelp()};
$('pwaHelpClose').onclick=()=>$('pwaHelp').classList.add('hidden');
$('forgetAdminBtn').onclick=()=>{if(confirm('この端末に記憶した管理者確認と管理者名を解除しますか？')){localStorage.removeItem(ADMIN_TRUST_KEY);localStorage.removeItem('zaikoPriceAdminName');location.reload()}};
try{await authenticate();onSnapshot(inventoryRef,s=>{if(!s.exists()){setStatus('棚卸データなし',true);return}state=s.data();setupStores();render();setStatus('クラウド同期済み');const requested=Number(params.get('item'));if(requested&&!deepLinkOpened){deepLinkOpened=true;openPrice(requested)}},e=>{console.error(e);setStatus('読込失敗',true)})}catch(e){setStatus(e.message,true);$('rows').innerHTML=`<tr><td colspan="7" class="empty">${esc(e.message)}</td></tr>`}
</script>

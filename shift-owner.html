<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト作成（オーナー）</title>
<style>
  :root{ --pink:#e8607f; --pink-d:#c74a68; --bg:#fafafa; --line:#e2e2e2; --ink:#3a3a3a;
    --sun:#f26d6d; --sat:#4a90e2; --today:#eef4fb; --wish:#9aa0a8; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;}
  /* スタッフは携帯利用：細い画面向け調整 */
  @media (max-width:480px){
    header h1{font-size:15px;}
    .day .d{width:66px; font-size:15px;}
    .seg2 .tg{width:34px; font-size:11px;}
    .day input.tinp{font-size:13px; padding:6px 4px;}
    .day .qbtn{padding:6px 12px;}
    .slist{padding:0 8px;}
    .noteinp{font-size:13px;}
  }
  /* オーナー画面：携帯向け調整（PCの見た目は変えない） */
  @media (max-width:600px){
    header h1{font-size:13px;}
    .demoTag{font-size:10px; padding:2px 6px;}
    header .btn.share{padding:5px 8px; font-size:11px;}
    /* 上のバー：ボタンをコンパクトに、折り返してもスッキリ */
    .bar.barrow{gap:5px 6px; padding:7px 8px;}
    .barrow strong#oMonthLabel{font-size:12px;}
    .barrow .ymsel{padding:5px 4px; font-size:13px;}
    .barrow .btn{padding:7px 9px !important; font-size:12px !important;}
    .barrow .stoggle button{padding:6px 12px; font-size:13px;}
    .statusInline{font-size:11px;}
    /* 月の表：日列を少し詰めて多く見えるように＋文字を読みやすく */
    #tbl thead th{min-width:54px; font-size:11px;}
    #tbl td.name, #tbl th.name{min-width:66px; max-width:66px; font-size:12px;}
    .gridwrap{max-height:calc(100vh - 132px); -webkit-overflow-scrolling:touch;}
    /* 日別タイムライン：指でも押しやすく */
    .daymodal{width:99vw; max-width:99vw; height:96vh;}
    .dayhead h3{font-size:13px;}
    .dayhead button{padding:7px 10px; font-size:13px;}
    .dbar .dresize{width:16px;}
    .dbar .btime{padding:2px 3px;}
    .storeoff-btn{padding:2px 8px; font-size:11px;}
    /* ポップアップ入力：指で押しやすいサイズ */
    .cmtbox{padding:16px 14px;}
    .cmtbox input.tinp{font-size:16px; padding:9px;}
    .dpday{min-width:48px; padding:8px 4px; font-size:13px;}
  }
  header{background:#2b2b2b; color:#fff; padding:5px 12px; position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  header h1{margin:0; font-size:14px; flex:1;}
  .toggle button{padding:5px 12px !important; font-size:12px !important;}
  .demoTag{background:#fff; color:#333; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
  .toggle{display:flex; background:rgba(255,255,255,.2); border-radius:20px; padding:3px;}
  .toggle button{border:none; background:transparent; color:#fff; font-weight:700; font-size:13px;
    padding:6px 14px; border-radius:18px; cursor:pointer;}
  .toggle button.on{background:#fff; color:#222;}
  .bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px 14px; background:#fff; border-bottom:1px solid var(--line);}
  select,.txt{padding:8px 12px; font-size:15px; border:1.5px solid var(--line); border-radius:9px; background:#fff;}
  .spacer{flex:1;}
  .btn{padding:8px 14px; font-size:14px; font-weight:700; border:none; border-radius:9px; cursor:pointer;}
  .btn.gray{background:#eee; color:#555;} .btn.pink{background:var(--pink); color:#fff;}
  .btn.decide{background:#2fa04a; color:#fff;} .btn.share{background:#06c755; color:#fff;}
  .btn.req{background:#5a6b7a; color:#fff;}
  .status{padding:7px 14px; font-size:12px; color:#888; background:#fff;}
  .barrow{padding:4px 10px; gap:6px;}
  .barrow strong{font-size:14px;}
  .barrow .btn{padding:5px 9px !important; font-size:12px !important;}
  .barrow input{padding:4px !important;}
  .statusInline{font-size:11px; color:#888; white-space:nowrap;}
  .stoggle{display:flex; background:#ededed; border-radius:20px; padding:3px; margin-left:8px; flex:0 0 auto;}
  .stoggle button{border:none; background:transparent; color:#555; font-weight:700; font-size:13px; padding:6px 14px; border-radius:18px; cursor:pointer; white-space:nowrap;}
  .stoggle button.on{background:#c99a00; color:#fff;}
  .sbar{flex-wrap:nowrap; gap:4px 5px; align-items:center; overflow-x:auto;}
  .sbar select{padding:5px 4px; font-size:13px; flex:0 0 auto;}
  #who{padding:6px 8px; font-size:14px; border:1.5px solid var(--line); border-radius:9px; width:78px; min-width:56px; flex:1 1 60px; max-width:130px; appearance:none; -webkit-appearance:none;}
  #who::-webkit-calendar-picker-indicator{display:none !important; opacity:0;}
  #whoOk{padding:6px 10px; font-size:13px; font-weight:700; color:#fff; background:#222; border:none; border-radius:9px; cursor:pointer; white-space:nowrap; flex:0 0 auto;}
  #whoOk:hover{background:#000;}
  header .btn.share{padding:6px 12px; font-size:13px;}
  .sbar span{white-space:nowrap; font-size:12px; flex:0 0 auto;}
  .sbar .btn.share{padding:7px 11px; white-space:nowrap;}
  .barrow .btn{padding:7px 11px; font-size:13px;}
  .pub{color:#2fa04a; font-weight:700;} .unpub{color:#c98a00; font-weight:700;}
  .note{padding:8px 14px; font-size:12px; color:#a06; background:#fff0f5;}

  /* grid */
  .gridwrap{overflow:auto; max-height:calc(100vh - 96px);}
  table{border-collapse:separate; border-spacing:0; font-size:12px; background:#fff;}
  th,td{border-right:1px solid var(--line); border-bottom:1px solid var(--line);}
  thead th{position:sticky; top:0; background:#fff; color:#222; z-index:5; padding:3px 3px; min-width:80px; font-size:11px;}
  th.corner{left:0; z-index:7; min-width:74px;}
  thead th.sun{color:var(--sun); background:#fbe6ec;} thead th.sat{color:var(--sat); background:#fbe6ec;} thead th.today{background:var(--today);}
  td.name, th.name{position:sticky; left:0; background:#fff; z-index:4; min-width:74px; max-width:74px;
    padding:2px 4px 2px 6px; font-weight:700; font-size:12px; text-align:left; word-break:break-all;}
  td.name .nmtxt{display:inline;}
  .delstaff{float:right; border:none; background:transparent; color:#cfcfcf; font-weight:700; font-size:12px; line-height:1; cursor:pointer; padding:0 1px;}
  .delstaff:hover{color:#c0392b;}
  tbody td{height:26px; vertical-align:top; cursor:pointer; padding:0; position:relative;}
  #tbody tr.blankrow td.blankname{background:#fcfcfc; color:#ccc;}
  #tbody td.blankcell{background:#fff; cursor:default;}
  #tbody td.stoff{background:#eaf6fd !important;}
  .storeoff-btn{margin-left:6px; border:1px solid #9cc9e6; background:#eaf6fd; color:#2b7fa3; font-size:10px; font-weight:800; border-radius:6px; padding:1px 7px; cursor:pointer; white-space:nowrap;}
  .storeoff-btn.on{background:#57b7e3; color:#fff; border-color:#3a9bd0;}
  tr.secrow td.secname{background:#f3d9e1; color:var(--pink-d); font-weight:800; font-size:11px; white-space:nowrap; padding:1px 6px;}
  tr.secrow td.sechead{background:#f9e7ee; height:13px;}
  td.hasnote .wish{padding-top:2px;}
  #tbody .cbubble{top:1px; right:1px;}
  #tbody td.todayc{background:var(--today);}
  #tbody td.ooff{background:#bfe3f5;}
  #tbody .cbubble{transform:scale(.34); transform-origin:top right;}
  .cbubble{position:absolute; top:2px; right:3px; width:16px; height:13px; background:#1e5aa8; border-radius:3px; cursor:pointer; z-index:3; box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .cbubble::after{content:""; position:absolute; left:3px; bottom:-3px; border-width:4px 4px 0 0; border-style:solid; border-color:#1e5aa8 transparent transparent transparent;}
  .cbubble::before{content:"…"; position:absolute; top:-3px; left:0; right:0; text-align:center; color:#fff; font-size:11px; font-weight:700; line-height:13px;}
  /* 本文セルの色はなし（色は日付ヘッダーだけ） */
  .wish{padding:1px 2px 0; text-align:center;}
  .wrow{margin-bottom:1px;}
  .wchip{display:inline-block; padding:0 4px; border-radius:5px; font-size:9px; line-height:1.4; font-weight:700;}
  .wchip.time{border:1px dashed #b0b0b0; color:#555;}
  .wchip.time.wd{background:#fff; color:#222; border-color:#8a8a8a;}
  .wchip.allday{border:1px dashed #d9c76a; background:#fef7cf; color:#7a5b00;}
  .wchip.off{background:#dcf0fa; color:#2b7fa3;}
  .wchip.maru{background:#fef7cf; color:#8a6d00;}
  .wchip.wam{background:#e4f5e7; border:1px solid #a9dcb3; color:#2f7a3f;}
  .wchip.wpm{background:#fdecf3; border:1px solid #f3b6cf; color:#b03a63;}
  .wchip.wall{background:linear-gradient(90deg,#e4f5e7 0 50%,#fdecf3 50%); border:1px solid #ddc9c0; color:#5a4a2a;}
  .chip{margin:1px 3px; padding:1px 4px; border-radius:5px; color:#fff; font-size:9.5px; text-align:center; font-weight:700; line-height:1.25; white-space:nowrap;}
  .lbl{font-size:8px; opacity:.9; display:inline; font-weight:400; margin-right:2px;}
  .chip.cam{background:#bfe6c4; color:#1c6b2e;}
  .chip.cpm{background:#f6c6da; color:#9c3160;}
  .chip.call{background:linear-gradient(90deg,#bfe6c4 0 50%,#f6c6da 50%); color:#5a4630;}

  /* staff input list */
  .slist{max-width:560px; margin:8px auto 60px; padding:0 12px;}
  .day{display:flex; align-items:flex-start; gap:8px; background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:8px 10px; margin-bottom:7px;}
  .day .d{width:78px; font-weight:700; font-size:16px; padding-top:4px;}
  .day .d small{color:#777; font-weight:700; font-size:14px; margin-left:2px;}
  .day.sunr .d{color:var(--sun);} .day.satr .d{color:var(--sat);}
  .seg2{flex:1; display:flex; flex-direction:column; gap:5px;}
  .seg2 .line{display:flex; align-items:center; gap:6px;}
  .seg2 .tg{width:38px; font-size:12px; font-weight:700; text-align:center; color:#fff; border-radius:6px; padding:4px 0;}
  .seg2 .tg.am{background:#cdeecd; color:#2f7a3f;}
  .seg2 .tg.pm{background:#fbd6e4; color:#b03a63;}
  .seg2 .tg.all{background:#fef7cf; color:#8a6d00;}
  .seg2 .tg.note{background:#9aa0a8;}
  .seg2 .line.lam{background:#eefaf0; border-radius:8px; padding:2px 3px;}
  .seg2 .line.lpm{background:#fdeef4; border-radius:8px; padding:2px 3px;}
  .seg2 .line.lall{background:#fdf6da; border-radius:8px; padding:2px 3px;}
  .seg2 .noteline{margin-top:2px;}
  .noteinp{flex:1; width:100%; padding:7px 9px; border:1.5px solid var(--line); border-radius:7px; font-size:13px;}
  .day input.tinp{padding:6px; border:1.5px solid var(--line); border-radius:7px; font-size:14px; flex:1 1 0; min-width:0; max-width:118px;}
  .qrow{display:flex; gap:6px; margin-top:2px;}
  .qnote{display:flex; align-items:center; gap:6px; margin-top:2px;}
  .qnote .noteinp{flex:1; min-width:0;}
  .allrow{display:flex; gap:8px; margin-bottom:10px; position:sticky; top:0; background:var(--bg); padding:6px 0; z-index:2;}
  .allbtn{border:1.5px solid #e6b800; border-radius:9px; padding:10px 16px; font-weight:800; cursor:pointer; background:linear-gradient(180deg,#fff2a8 0%,#ffe36b 55%,#f4cc2e 100%); color:#7a5b00; font-size:14px; box-shadow:0 2px 5px rgba(200,165,40,.35), inset 0 1px 0 rgba(255,255,255,.7);}
  .allbtn.clr{background:#eee; color:#666; border-color:#ddd;}
  .day .qbtn{border:1.5px solid var(--line); border-radius:7px; padding:6px 12px; font-weight:700; cursor:pointer; font-size:14px;}
  .day .qbtn[data-q="maru"]{background:#fef7cf; color:#8a6d00; border-color:#f0e6a8;}
  .day .qbtn[data-q="batu"]{background:#dcf0fa; color:#2b7fa3; border-color:#b8def0;}
  .day .qbtn.on-maru{background:#ffd24d; color:#7a5b00; border-color:#e0a800;}
  .day .qbtn.on-batu{background:#7ec8f0; color:#fff; border-color:#4aa8dd;}
  .cmtbox .qbtn{border:1.5px solid var(--line); border-radius:7px; padding:5px 12px; font-weight:800; cursor:pointer; font-size:14px; background:#fff;}
  .cmtbox .qbtn[data-q="maru"]{background:#fef7cf; color:#8a6d00; border-color:#f0e6a8;}
  .cmtbox .qbtn[data-q="batu"]{background:#dcf0fa; color:#2b7fa3; border-color:#b8def0;}
  .cmtbox .qbtn.on-maru{background:#fef7cf; color:#7a5b00; border:2.5px solid #d4a017;}
  .cmtbox .qbtn.on-batu{background:#dcf0fa; color:#1f6f95; border:2.5px solid #2b7fa3;}
  .cmtbox .qsubmit{margin-left:auto; background:#c99a00; color:#fff; border:none; border-radius:8px; padding:6px 14px; font-weight:800; cursor:pointer; font-size:13px;}
  .cmtbox .line.noteln{margin-top:4px;}
  .cmtbox .qbtn:disabled,.cmtbox input:disabled,.cmtbox .noteinp:disabled{opacity:.55;}

  /* staff decided view */
  .mine{max-width:560px; margin:10px auto 60px; padding:0 12px;}
  .mine .card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:7px;
    display:flex; align-items:center; gap:10px;}
  .mine .dot{width:12px; height:12px; border-radius:50%;}
  .mine .dt{width:80px; font-weight:700; font-size:13px;}
  .mine .tm{font-size:16px; font-weight:700;}
  .mine .off{color:#999;}

  /* 確定後カレンダー（スタッフ） */
  .mcal{max-width:620px; margin:8px auto 60px; padding:0 8px;}
  .mcalgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
  .mch{text-align:center; font-weight:700; font-size:12px; color:#666; padding:3px 0;}
  .mch.sun{color:var(--sun);} .mch.sat{color:var(--sat);}
  .mcell{position:relative; min-height:52px; border:1px solid var(--line); border-radius:7px; background:#fff; padding:2px; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .mcell.empty{border:none; background:transparent;}
  .mcell.sun{background:#fdf0f3;} .mcell.sat{background:#eef4fd;}
  .mnum{font-size:11px; font-weight:700; color:#555; align-self:flex-start; padding-left:2px;}
  .mtime{font-size:9.5px; font-weight:700; color:#fff; border-radius:5px; padding:1px 3px; text-align:center; line-height:1.3; white-space:nowrap;}
  .mstore{font-size:8.5px; font-weight:800; color:#fff; border-radius:5px; padding:0 5px; line-height:1.5; white-space:nowrap; align-self:flex-start; margin-left:2px;}
  .mcell.cclick{cursor:pointer;}
  .mcell.cclick:hover{background:#fbf7fa;}
  .cmark{font-size:9px; align-self:flex-end; line-height:1;}
  .mbubble{position:relative; display:inline-block; width:7px; height:5px; border-radius:2px; background:currentColor; box-shadow:0 1px 1px rgba(0,0,0,.2); margin-left:2px; vertical-align:middle;}
  .mbubble::after{content:""; position:absolute; left:1px; bottom:-2px; border-width:2px 2px 0 0; border-style:solid; border-color:currentColor transparent transparent transparent;}
  .mbubble::before{content:"";}
  .mtime.mam.dash{background:#eefaf0; border:1.5px dashed #2f7a3f; color:#2f7a3f;}
  .mtime.mpm.dash{background:#fdeef4; border:1.5px dashed #b03a63; color:#b03a63;}
  .mtime.mall.dash{background:linear-gradient(90deg,#eefaf0 0 50%,#fdeef4 50%); border:1.5px dashed #b07a90; color:#6a4a58;}
  .mtime.doff{background:#dcf0fa; border:1.5px dashed #2b7fa3; color:#2b7fa3;}
  .mtime.dmaru{background:#fef7cf; border:1.5px dashed #b59a00; color:#8a6d00;}
  .caltools{display:flex; gap:8px; max-width:620px; margin:8px auto 0; padding:0 8px;}
  .caltools .allbtn{flex:0 0 auto; padding:6px 12px; font-size:12px;}
  .caltools .allbtn.locked{background:#eee; color:#bbb; border-color:#ddd; cursor:not-allowed; box-shadow:none;}
  .caltools .updatedlbl{align-self:center; font-size:11px; color:#2f7a3f; font-weight:800; margin-left:8px; white-space:nowrap;}
  .mcell .mtop{display:flex; align-items:baseline; gap:3px; align-self:stretch; width:100%; padding-left:2px;}
  .mcell .wsmall{font-size:8px; color:#c2c2c2; font-weight:700; white-space:nowrap; line-height:1.35;}
  .ymsel{padding:5px 3px; font-size:12px; border:1.5px solid var(--line); border-radius:8px; flex:0 0 auto;}
  .dibox{max-width:430px;}
  .moff{font-size:13px; font-weight:700; color:#9aa0a8;}
  .mtime{display:block; margin-top:1px;}
  .mtime.mam{background:#bfe6c4; color:#1c6b2e;}
  .mtime.mpm{background:#f6c6da; color:#9c3160;}
  .mtime.mall{background:linear-gradient(90deg,#bfe6c4 0 50%,#f6c6da 50%); color:#5a4630;}
  .mtime.mtetsu{background:#2f9ad0; color:#fff;}

  /* modal */
  .mask{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:90; padding:14px;}
  .modal{background:#fff; border-radius:14px; width:340px; max-width:100%; max-height:88vh; overflow:auto; padding:16px;}
  .modal h3{margin:0 0 8px; font-size:16px;}
  .wishline{font-size:12px; color:#888; margin-bottom:10px;}
  .wishline.ylw{color:#7a5b00; background:#fef7cf; border:1px dashed #d9c76a; border-radius:6px; padding:5px 9px; display:inline-block;}
  .notemsg{font-size:13px; color:#7a5563; background:#fff0f5; border:1px solid #f0d3db; border-radius:8px; padding:8px 10px; margin-bottom:10px; line-height:1.5;}
  .cmtmask{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:70; padding:20px;}
  .cmtbox{background:#fff; border-radius:14px; max-width:340px; width:100%; padding:16px;}
  .cmtbox .ttl{font-weight:700; color:var(--pink-d); margin-bottom:8px; font-size:14px;}
  .cmtbox .txt{font-size:14px; line-height:1.6; white-space:pre-wrap; background:#fff8fb; border:1px solid var(--line); border-radius:8px; padding:11px;}
  .cmtbox button{margin-top:12px; width:100%; background:var(--pink); color:#fff; border:none; border-radius:8px; padding:10px; font-weight:700; cursor:pointer;}
  .segTitle{font-size:13px; font-weight:700; margin:6px 0 4px;}
  .segTitle.am{color:#2fa04a;} .segTitle.pm{color:var(--pink-d);}
  .row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .row input{flex:1; padding:9px 10px; font-size:15px; border:1.5px solid var(--line); border-radius:8px;}
  .row .tag{width:66px; text-align:center; color:#888; font-size:13px;}
  .palette{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:8px 0;}
  .sw{height:32px; border-radius:8px; cursor:pointer; border:2px solid transparent;}
  .sw.sel{border-color:#333;}
  .quick{display:flex; gap:8px; margin:10px 0;}
  .quick button{flex:1; padding:9px; border-radius:8px; border:1.5px solid var(--line); background:#fff; font-weight:700; cursor:pointer;}
  .quick .maru{color:#2fa04a;} .quick .batu{color:#c0392b;}
  .mfoot{display:flex; justify-content:space-between; margin-top:10px;}
  .mfoot .del{background:#fff; border:1.5px solid #e0b4b4; color:#c0392b; border-radius:8px; padding:8px 12px; cursor:pointer;}
  .mfoot .mreq{background:#5a6b7a; color:#fff; border:none; border-radius:8px; padding:9px 14px; font-weight:700; cursor:pointer;}
  .mfoot .save{background:var(--pink); color:#fff; border:none; border-radius:8px; padding:9px 18px; font-weight:700; cursor:pointer;}

  /* day timeline */
  thead th.daycol{cursor:pointer;}
  thead th.daycol:hover{background:#f7d0dc;}
  .daymask{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:60; padding:12px;}
  .daymodal{background:#fff; border-radius:14px; width:96vw; max-width:96vw; height:94vh; display:flex; flex-direction:column; overflow:hidden; position:relative;}
  .dmz{position:absolute; z-index:12; touch-action:none;}
  .dmz-r{top:0; right:-2px; width:9px; height:100%; cursor:ew-resize;}
  .dmz-b{left:0; bottom:-2px; height:9px; width:100%; cursor:ns-resize;}
  .dmz-c{right:-2px; bottom:-2px; width:20px; height:20px; cursor:nwse-resize; background:linear-gradient(135deg,transparent 45%,#c9c9c9 45%,#c9c9c9 55%,transparent 55%,transparent 70%,#c9c9c9 70%,#c9c9c9 80%,transparent 80%); border-bottom-right-radius:14px;}
  .dayhead{display:flex; justify-content:space-between; align-items:center; padding:9px 14px; border-bottom:1px solid var(--line); flex:0 0 auto;}
  .dayhead h3{margin:0; font-size:14px; color:var(--pink-d); white-space:nowrap; flex:0 0 auto;}

  <script type="module">
  import { initializeApp } from 'firebase/app';
  import { getDatabase, ref, set, remove, onValue } from 'firebase/database';
  try{
    const app = initializeApp({
      apiKey:           'AIzaSyCkkIx44FVKmQdO6kQK_uQVloJccRo2cYo',
      authDomain:       'zaiko2017inb.firebaseapp.com',
      databaseURL:      'https://zaiko2017inb-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId:        'zaiko2017inb',

      messagingSenderId:'705085250436',
      appId:            '1:705085250436:web:5bda2efcc70e4ffca25bd1'
    }, 'shift');
    const db = getDatabase(app);
    const BASE='zaiko/shift';
    const fbKey=(s)=>String(s).replace(/[.#$\[\]\/]/g,'_');
    let _suppressUntil=0;
    window.fbTouch=function(){ _suppressUntil=Date.now()+1500; };

    const badge=document.createElement('div');
    badge.id='fb-badge';
    badge.style.cssText='position:fixed;left:6px;bottom:6px;z-index:99999;font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-family:sans-serif;pointer-events:none;';

    onValue(ref(db,'.info/connected'), s=>{ badge.textContent = s.val()? '🟢 共有オン' : '🔴 未接続'; });

    window.fbPush=function(payload){
      if(!payload) return;
      _suppressUntil=Date.now()+1500;
      try{
        if(payload.mode==='staff'){
          if(!payload.key) return;
          set(ref(db,BASE+'/staff/'+fbKey(payload.key)), payload.node)
            .then(()=>{ badge.textContent='✅ 送信 '+new Date().toLocaleTimeString('ja-JP'); })
            .catch(e=>{ _suppressUntil=0; badge.textContent='❌ 送信失敗'; console.warn(e); });
        } else if(payload.mode==='owner'){
          set(ref(db,BASE+'/meta'), payload.meta).catch(e=>{ _suppressUntil=0; console.warn(e); });
          const st=payload.staff||{};
          Object.keys(st).forEach(nm=> set(ref(db,BASE+'/staff/'+fbKey(nm)), st[nm]).catch(e=>console.warn(e)) );
          badge.textContent='✅ 送信 '+new Date().toLocaleTimeString('ja-JP');
        }
      }catch(e){ console.warn(e); }
    };
    window.fbRemoveStaff=function(nm){ _suppressUntil=Date.now()+1500; try{ remove(ref(db,BASE+'/staff/'+fbKey(nm))).catch(e=>console.warn(e)); }catch(e){ console.warn(e); } };

    onValue(ref(db,BASE), (snap)=>{
      if(Date.now()<_suppressUntil) return;
      if(typeof window.shiftApplyRemote==='function'){
        window.shiftApplyRemote(snap.exists()? snap.val() : null);
        badge.textContent='📥 受信 '+new Date().toLocaleTimeString('ja-JP');
      }
    });

<script>
window.APP_VERSION="v1.52"; window.APP_UPDATED="2026-07-29";
const DOW=["日","月","火","水","木","金","土"];
const COLORS=["#7ec8f0","#2fd18f","#39c07d","#f28ec0","#a97ff0","#e8607f","#127a99","#c9c23a","#b0b6bd","#5a6068","#e8563a","#f0a020","#1f9e8f","#a021c0","#a07a2a"];
const $=s=>document.querySelector(s);
const isLightColor=hex=>{const h=String(hex).replace("#","");const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return (0.299*r+0.587*g+0.114*b)>175;};
const pad=n=>String(n).padStart(2,"0");
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let Y=2026, M=7, DAYS=31;
const key=d=>`${Y}-${pad(M)}-${pad(d)}`;
const STORE_KEY="shiftDemoState_v10";
const STORES=["大須","那古野","鉄板"];
const BLANK_SLOTS={ "大須":15, "那古野":6, "鉄板":4 };  /* 各店舗の空白行の目安（提出者はこの上に入る）*/
const SPARE_ROWS=3;  /* 提出で埋まっても常に残す空き行の数（自動追加）*/
const STORE_COLOR={
  "大須":  { bg:"#f9dbe4", head:"#fbeef2", ink:"#c74a68", hd:"#ee7d97" },
  "那古野":{ bg:"#fbf1c8", head:"#fdf8e4", ink:"#8a6d00", hd:"#f7c600" },
  "鉄板":  { bg:"#d5ecf8", head:"#eaf6fc", ink:"#1e6f95", hd:"#57b7e3" }
};
const DEC_COLOR={ "大須":"#f2a9c0", "那古野":"#ecd06a", "鉄板":"#9dd3ef" };
const STOFF_COLOR="#eaf6fd";  /* 店舗の休みの日：薄い水色 */

/* ---- 祝日 自動判定（毎年）---- */
function fmtd(dt){ return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; }
function calcJpHolidays(year){
  const set={};
  const add=(m,d,name)=>{ set[`${year}-${pad(m)}-${pad(d)}`]=name; };
  const nthMon=(m,n)=>{ const first=new Date(year,m-1,1).getDay(); return 1+((1-first+7)%7)+(n-1)*7; };
  add(1,1,"元日"); add(1,nthMon(1,2),"成人の日");
  add(2,11,"建国記念の日"); add(2,23,"天皇誕生日");
  const ve=Math.floor(20.8431+0.242194*(year-1980)-Math.floor((year-1980)/4)); add(3,ve,"春分の日");
  add(4,29,"昭和の日"); add(5,3,"憲法記念日"); add(5,4,"みどりの日"); add(5,5,"こどもの日");
  add(7,nthMon(7,3),"海の日"); add(8,11,"山の日"); add(9,nthMon(9,3),"敬老の日");
  const ae=Math.floor(23.2488+0.242194*(year-1980)-Math.floor((year-1980)/4)); add(9,ae,"秋分の日");
  add(10,nthMon(10,2),"スポーツの日"); add(11,3,"文化の日"); add(11,23,"勤労感謝の日");
  const keiro=nthMon(9,3); if(ae-keiro===2) set[`${year}-09-${pad(keiro+1)}`]="国民の休日";
  Object.keys(set).slice().forEach(k=>{ const dt=new Date(k+"T00:00:00");
    if(dt.getDay()===0){ let nx=new Date(dt); do{ nx.setDate(nx.getDate()+1); }while(set[fmtd(nx)]); set[fmtd(nx)]="振替休日"; }});
  return set;
}
let HOL=calcJpHolidays(Y);
const isHol=d=>!!HOL[key(d)];

/* ---- 初期データ（空・本番） ---- */
function seed(){
  return { published:false, staff:{} };
}
let S;
try{ S=JSON.parse(localStorage.getItem(STORE_KEY)) || seed(); }catch(e){ S=seed(); }
function saveLocal(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
let _fbPushT=null;
function save(){ saveLocal(); if(window.fbTouch) window.fbTouch(); try{ clearTimeout(_fbPushT); _fbPushT=setTimeout(function(){ if(window.fbPush) window.fbPush(buildFbPayload()); }, 350); }catch(e){} }
function buildFbPayload(){ /* オーナー: 全員分＋公開状態をクラウドへ */
  var staffOut={}; Object.keys(S.staff||{}).forEach(function(nm){ var nd=Object.assign({},S.staff[nm]); nd.nm=nm; staffOut[nm]=nd; });
  return { mode:'owner', meta:{ published:!!S.published, updatedAt:S.updatedAt||'', decidedMonths:S.decidedMonths||{}, decidedDays:S.decidedDays||{}, storeMemo:S.storeMemo||{}, storeOff:S.storeOff||{} }, staff:staffOut };
}
function shiftApplyRemote(val){ try{
  if(!val || (!val.meta && !val.staff)) return; /* クラウドが空ならローカル維持 */
  var meta=val.meta||{}, raw=val.staff||{}, staff={};
  Object.keys(raw).forEach(function(k){ var nd=raw[k]||{}; var nm=nd.nm||k; nd.store=nd.store||"大須"; nd.wish=nd.wish||{}; nd.decided=nd.decided||{}; nd.notes=nd.notes||{}; staff[nm]=nd; });
  S.published=!!meta.published; S.updatedAt=meta.updatedAt||S.updatedAt||""; S.decidedMonths=meta.decidedMonths||{}; S.decidedDays=meta.decidedDays||{}; S.storeMemo=meta.storeMemo||{}; S.storeOff=meta.storeOff||{}; S.staff=staff;
  saveLocal();
  var ov=document.querySelector('#ownerView'), sv=document.querySelector('#staffView');
  if(typeof renderOwner==='function' && ov && ov.style.display!=='none') renderOwner();
  if(typeof renderStaff==='function' && sv && sv.style.display!=='none') renderStaff();
}catch(e){ console.warn('applyRemote',e); } }
window.shiftApplyRemote=shiftApplyRemote;
function touchUpdated(){ const t=new Date(); S.updatedAt=`${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()}`; if(!S.decidedMonths) S.decidedMonths={}; S.decidedMonths[Y+'-'+M]=true; }
function names(){ return Object.keys(S.staff); }
function storeStaff(st){ return names().filter(n=>(S.staff[n].store||"大須")===st); }

/* ---- 希望テキスト ---- */
function wishText(w){
  if(!w) return "";
  if(w.off) return "✕";
  if(w.allday) return "9:00-23:00";
  let p=[];
  if(w.all) p.push(`${w.all.start||''}-${w.all.end||''}`);
  if(w.am) p.push(`AM${w.am.start||''}-${w.am.end||''}`);
  if(w.pm) p.push(`PM${w.pm.start||''}-${w.pm.end||''}`);
  if(!p.length && (w.start||w.end)) p.push(`${w.start||''}-${w.end||''}`);
  return p.join(" / ");
}
function wishChip(w,isWeekend){
  if(w.off) return `<span class="wchip off">✕</span>`;
  if(w.allday) return `<span class="wchip time">9:00-23:00</span>`;
  if(w.all) return `<span class="wchip time">${w.all.start||''}-${w.all.end||''}</span>`;
  const wd=isWeekend?'':'wd'; let h="";
  if(w.am) h+=`<div class="wrow"><span class="wchip time ${wd}"><span class="amp">AM</span>${w.am.start||''}-${w.am.end||''}</span></div>`;
  if(w.pm) h+=`<div class="wrow"><span class="wchip time ${wd}"><span class="amp">PM</span>${w.pm.start||''}-${w.pm.end||''}</span></div>`;
  if(!h && (w.start||w.end)) h=`<div class="wrow"><span class="wchip time ${wd}">${w.start||''}-${w.end||''}</span></div>`;
  return h;
}

/* ================= オーナー画面 ================= */
let editing=null, pickColor=COLORS[5];
let ownerMode='wish';  /* 月表の表示：wish=希望 / decided=決定だけ */
function decChips(dv){
  if(!dv) return "";
  if(dv.off) return `<div class="chip" style="background:#b0b6bd">休み</div>`;
  let h="";
  if(dv.all) h+=`<div class="chip call">${dv.all.start||""}〜${dv.all.end||""}</div>`;
  if(dv.am) h+=`<div class="chip cam"><span class="lbl">AM</span>${dv.am.start||""}〜${dv.am.end||""}</div>`;
  if(dv.pm) h+=`<div class="chip cpm"><span class="lbl">PM</span>${dv.pm.start||""}〜${dv.pm.end||""}</div>`;
  if(!dv.all&&!dv.am&&!dv.pm&&(dv.start||dv.end)) h+=`<div class="chip call">${dv.start||""}〜${dv.end||""}</div>`;
  return h;
}
function buildPalette(){
  const p=$("#mPalette"); p.innerHTML="";
  COLORS.forEach(c=>{ const d=document.createElement("div");
    d.className="sw"+(c===pickColor?" sel":""); d.style.background=c;
    d.onclick=()=>{ pickColor=c; buildPalette(); }; p.appendChild(d); });
}
function renderOwner(){
  $("#oStatus").innerHTML=(ownerMode==='decided'?`<span style="color:#c99a00;font-weight:800;">決定シフト表示中　</span>`:'')+`提出 ${names().length}名　`+
    (S.published?`<span class="pub">✅ 公開中</span>`:`<span class="unpub">■ 未公開（作成中）</span>`);
  $("#decideBtn").textContent=S.published?"公開を取り消す":"この月をスタッフに公開";
  const today=new Date(), todayStr=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  let th=`<tr><th class="corner name">スタッフ</th>`;
  for(let d=1;d<=DAYS;d++){ const dow=new Date(Y,M-1,d).getDay(); const hol=isHol(d);
    const cls=((dow===0||hol)?"sun ":dow===6?"sat ":"")+(key(d)===todayStr?"today":"");
    th+=`<th class="daycol ${cls}" data-day="${d}" title="${HOL[key(d)]||''}">${DOW[dow]}<br>${M}/${d}</th>`; }
  $("#thead").innerHTML=th+"</tr>";
  document.querySelectorAll('#thead th.daycol').forEach(el=>el.onclick=()=>openDayView(+el.dataset.day));
  let rows="";
  STORES.forEach(st=>{
    const list=storeStaff(st);
    const col=STORE_COLOR[st]||STORE_COLOR["大須"];
    const isOff=d=>!!(S.storeOff&&S.storeOff[key(d)]&&S.storeOff[key(d)][st]);  /* この店舗のこの日が休みか */
    rows+=`<tr class="secrow"><td class="name secname" style="background:${col.bg};color:${col.ink}">${st}（${list.length}）</td>`;
    for(let d=1;d<=DAYS;d++){ const _dc=isOff(d)?STOFF_COLOR:((S.decidedDays&&S.decidedDays[key(d)])?DEC_COLOR[st]:col.head); rows+=`<td class="sechead" style="background:${_dc}"></td>`; }
    rows+=`</tr>`;
    list.forEach(nm=>{
      rows+=`<tr><td class="name"><span class="nmtxt">${esc(nm)}</span><button class="delstaff" data-n="${esc(nm)}" title="削除">×</button></td>`;
      const wish=S.staff[nm].wish||{}, dec=S.staff[nm].decided||{};
      for(let d=1;d<=DAYS;d++){
        const dow=new Date(Y,M-1,d).getDay(); const hol=isHol(d);
        const cc=(key(d)===todayStr?" todayc":"");
        const w=wish[key(d)];
        let wt;
        if(ownerMode==='decided'){ const dv=dec[key(d)]; wt=dv?`<div class="wish">${decChips(dv)}</div>`:""; }
        else { wt=w?`<div class="wish">${wishChip(w,(dow===0||dow===6||hol))}</div>`:""; }
        const hasNote=!!((S.staff[nm].notes||{})[key(d)]);
        const bubble=hasNote?`<span class="cbubble" data-n="${esc(nm)}" data-d="${d}"></span>`:"";
        const oo=(S.staff[nm].ooff||{})[key(d)];
        const so=isOff(d)?' stoff':'';
        rows+=`<td class="${cc}${hasNote?' hasnote':''}${oo?' ooff':''}${so}" data-n="${esc(nm)}" data-d="${d}">${bubble}${wt}</td>`;
      }
      rows+="</tr>";
    });
    const blanks=Math.max((BLANK_SLOTS[st]||0)-list.length, SPARE_ROWS);  /* 目安の数。提出で埋まっても常にSPARE_ROWS行の空きを自動追加 */
    for(let bi=0; bi<blanks; bi++){
      rows+=`<tr class="blankrow"><td class="name blankname">&nbsp;</td>`;
      for(let d=1;d<=DAYS;d++){ rows+=`<td class="blankcell${isOff(d)?' stoff':''}"></td>`; }
      rows+=`</tr>`;
    }
  });
  $("#tbody").innerHTML=rows;
  document.querySelectorAll("#tbody td[data-d]").forEach(td=>{
    td.ondblclick=(e)=>{ if(e.target.closest && e.target.closest('.cbubble')) return;
      const nm=td.dataset.n, k=key(+td.dataset.d);
      if(!S.staff[nm].ooff) S.staff[nm].ooff={};
      if(S.staff[nm].ooff[k]){ delete S.staff[nm].ooff[k]; td.classList.remove('ooff'); }
      else { S.staff[nm].ooff[k]=true; td.classList.add('ooff'); }
      save(); };
  });
  document.querySelectorAll("#tbody .cbubble").forEach(el=>el.onclick=(e)=>{ e.stopPropagation();
    showComment(el.dataset.n, +el.dataset.d, (S.staff[el.dataset.n].notes||{})[key(+el.dataset.d)]); });
  document.querySelectorAll("#tbody .delstaff").forEach(b=>b.onclick=(e)=>{ e.stopPropagation();
    const nm=b.dataset.n; if(confirm(`${nm} さんを削除しますか？（希望・シフトも消えます）`)){ if(window.fbRemoveStaff) window.fbRemoveStaff(nm); delete S.staff[nm]; save(); renderOwner(); } });
}
function showComment(nm,d,note){

/* ---- 日別タイムライン ---- */
const AX0=8, AX1=23, HW=40;
let dayViewDay=null, holdMode=false;
function _fw2hw(s){ return String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[：]/g,':'); }
function pHM(s){ if(!s) return null; s=_fw2hw(s); const a=s.split(':'); const h=parseInt(a[0],10); if(isNaN(h)) return null; return h+((parseInt(a[1],10)||0)/60); }
function normTime(v){ if(!v) return ''; v=_fw2hw(v).trim(); if(!v) return ''; const a=v.split(':'); let h=parseInt(a[0],10); if(isNaN(h)) return ''; let m=a.length>1?parseInt(a[1],10):0; if(isNaN(m)) m=0; if(h>23)h=23; if(h<0)h=0; if(m>59)m=59; if(m<0)m=0; return pad(h)+':'+pad(m); }
function dbar(color,s,e,label){ if(s==null||e==null) return ""; const l=(s-AX0)*HW, w=Math.max((e-s)*HW,34); return `<div class="dbar" style="left:${l}px;width:${w}px;background:${color}">${label}</div>`; }
function dbarC(cls,s,e,label){ if(s==null||e==null) return ""; const l=(s-AX0)*HW, w=Math.max((e-s)*HW,34); return `<div class="dbar ${cls}" style="left:${l}px;width:${w}px">${label}</div>`; }
function hourToStr(h){ h=Math.max(0,Math.min(24,h)); const hh=Math.floor(h+1e-6); let mm=Math.round((h-hh)*60); return pad(hh)+":"+pad(mm===60?0:mm); }
function dEditBar(nm,d,seg,cls,ss,ee){
  const s=pHM(ss), e=pHM(ee); if(s==null||e==null) return "";
  const l=(s-AX0)*HW, w=Math.max((e-s)*HW,40);
  let _bg=""; if(cls==='ball' && e>s){ const _p=Math.max(0,Math.min(100,(14-s)/(e-s)*100)); _bg=`background:linear-gradient(90deg,#bfe6c4 0 ${_p}%,#f6c6da ${_p}%);`; }
  return `<div class="dbar ${cls}" data-n="${nm}" data-d="${d}" data-seg="${seg}" style="left:${l}px;width:${w}px;${_bg}"><span class="dresize dresize-l" data-n="${nm}" data-d="${d}" data-seg="${seg}" data-edge="start"></span><span class="btime bstart" data-f="start">${ss||''}</span><span class="btime bend" data-f="end">${ee||''}</span><span class="dresize dresize-r" data-n="${nm}" data-d="${d}" data-seg="${seg}" data-edge="end"></span></div>`;
}
function _segsOf(o,out){ if(!o||o.off) return; ['all','am','pm'].forEach(k=>{ if(o[k]){ const s=pHM(o[k].start),e=pHM(o[k].end); if(s!=null&&e!=null&&e>s) out.push([s,e]); } }); if(!o.all&&!o.am&&!o.pm&&(o.start||o.end)){ const s=pHM(o.start),e=pHM(o.end); if(s!=null&&e!=null&&e>s) out.push([s,e]); } }
function staffDayConflict(nm,d){ const segs=[]; _segsOf((S.staff[nm].decided||{})[key(d)],segs); _segsOf((S.staff[nm].tetsu||{})[key(d)],segs);
  for(let i=0;i<segs.length;i++) for(let j=i+1;j<segs.length;j++){ if(segs[i][0]<segs[j][1] && segs[j][0]<segs[i][1]) return true; } return false; }
function reqBars(nm,d){
  const r=(S.staff[nm].req||{})[key(d)]; if(!r||(!r.start&&!r.end)) return "";
  const s=pHM(r.start), e=pHM(r.end); if(s==null||e==null) return "";
  const l=(s-AX0)*HW, w=Math.max((e-s)*HW,40);
  if(r.rejected) return `<div class="dbar reqrej" style="left:${l}px;width:${w}px">拒否</div>`;
  const ok=r.approved?'<span class="okmark">OK</span>':'';
  return `<div class="dbar ${r.approved?'reqok':'reqpend'}" style="left:${l}px;width:${w}px">${r.start||''}〜${r.end||''}${ok}</div>`;
}

(function(){
  const modal=document.querySelector('.daymodal'); if(!modal) return;
  let mz=null,sx=0,sy=0,sw=0,sh=0;
  function down(e){ mz=e.currentTarget.dataset.mz; const r=modal.getBoundingClientRect(); sx=e.clientX; sy=e.clientY; sw=r.width; sh=r.height; modal.style.position='fixed'; modal.style.left=r.left+'px'; modal.style.top=r.top+'px'; modal.style.margin='0'; e.currentTarget.setPointerCapture(e.pointerId); e.preventDefault(); e.stopPropagation(); }
  function move(e){ if(!mz) return; const maxW=Math.round(innerWidth*0.98), maxH=Math.round(innerHeight*0.98); if(mz==='r'||mz==='c'){ let w=Math.max(480,Math.min(maxW,sw+(e.clientX-sx))); modal.style.width=w+'px'; modal.style.maxWidth='none'; } if(mz==='b'||mz==='c'){ let h=Math.max(340,Math.min(maxH,sh+(e.clientY-sy))); modal.style.height=h+'px'; } if(typeof fitDayGrid==='function') fitDayGrid(); }
  function up(){ mz=null; }
  modal.querySelectorAll('.dmz').forEach(h=>{ h.addEventListener('pointerdown',down); h.addEventListener('pointermove',move); h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up); });

function fitDayGrid(){ const g=$("#dayGrid"); const sc=document.querySelector('.dayscroll'); if(!g||!sc) return; g.style.transform="none"; const gw=g.scrollWidth, gh=g.scrollHeight; const availW=sc.clientWidth, availH=sc.clientHeight; const scale=Math.min(availW/gw, availH/gh, 2); g.style.transformOrigin="top left"; g.style.transform="scale("+scale+")"; }
(function(){ const sc=document.querySelector('.dayscroll'); if(sc && window.ResizeObserver){ new ResizeObserver(()=>{ const m=$("#dayMask"); if(m && m.style.display==="flex") fitDayGrid(); }).observe(sc); } })();

function dvTetsuSection(d,W){

/* ---- 日別タイムライン：棒＝時間編集／空き＝薄水色の仮ブロック ---- */
function holdbars(nm,d){
  const hs=(S.staff[nm].hold||{})[key(d)]||[];
  return hs.map(h=>`<div class="dbar holdbar" data-h="${h}" style="left:${(h-AX0)*HW}px;width:${HW/2}px" title="タップで消す"></div>`).join("");
}
function toggleHold(nm,d,h){
  if(!S.staff[nm].hold) S.staff[nm].hold={};
  const k=key(d); let arr=(S.staff[nm].hold[k]||[]).slice();
  if(arr.includes(h)) arr=arr.filter(x=>x!==h); else { arr.push(h); arr.sort((a,b)=>a-b); }
  if(arr.length) S.staff[nm].hold[k]=arr; else delete S.staff[nm].hold[k];
  save(); if(dayViewDay!=null && $("#dayMask").style.display==="flex") openDayView(dayViewDay);
}
function _xToHour(e, dt, snapFloor){
  const rect=dt.getBoundingClientRect();
  const uw=dt.offsetWidth||((AX1-AX0)*HW);
  const ux=(e.clientX-rect.left)*(uw/(rect.width||uw));
  let hr=AX0+(snapFloor?Math.floor(ux/(HW/2)):Math.round(ux/(HW/2)))*0.5;
  return Math.max(AX0, Math.min(AX1, hr));
}
function dayRowClick(e,row,mode){
  const nm=row.dataset.n, d=+row.dataset.d, t=e.target;
  if(t.closest && t.closest('.dresize')) return; // 端の伸縮はドラッグで処理
  if(t.classList && (t.classList.contains('holddel')||t.classList.contains('holdbar'))){ toggleHold(nm,d,+t.dataset.h); return; }
  if(mode==='tetsu'){ openTetsu(nm,d); return; }
  if(holdMode){
    const dt=t.closest('.dtime'); if(!dt) return;
    let hour=Math.min(_xToHour(e,dt,true), AX1-0.5);
    toggleHold(nm,d,hour); return;
  }
  // 棒・名前をタップ → 編集
  if(t.closest('.dbar') || t.closest('.dname')){ return; } // 直接操作（時間の数字タップ・端ドラッグ）で編集
  // 空きをタップ → その時間で直接作成（すでにシフトがある人は編集を開く）
  if((S.staff[nm].decided||{})[key(d)]){ return; }
  const dt=t.closest('.dtime'); if(!dt) return;
  let hour=Math.min(_xToHour(e,dt,false), AX1-1);
  if(!S.staff[nm].decided) S.staff[nm].decided={};
  S.staff[nm].decided[key(d)]={all:{start:hourToStr(hour),end:hourToStr(Math.min(hour+1,AX1))}, color:'#8bc98f'};
  touchUpdated(); save(); if(dayViewDay!=null) openDayView(dayViewDay);
}
/* 端ドラッグで終了時間を伸縮 */
let rz=null;
function onResizeDown(e){
  const h=e.target.closest && e.target.closest('.dresize'); if(!h) return;
  if(e.preventDefault) e.preventDefault(); if(e.stopPropagation) e.stopPropagation();
  const dt=h.closest('.dtime'); if(!dt) return;
  const dec=(S.staff[h.dataset.n].decided||{})[key(+h.dataset.d)];
  const seg=h.dataset.seg, o=dec&&dec[seg]; if(!o) return;
  const startH=pHM(o.start), endH=pHM(o.end); if(startH==null||endH==null) return;
  rz={nm:h.dataset.n, d:+h.dataset.d, seg, edge:(h.dataset.edge||'end'), bar:h.closest('.dbar'), rect:dt.getBoundingClientRect(), uw:dt.offsetWidth||((AX1-AX0)*HW), startH, endH};
  window.addEventListener('pointermove', onResizeMove);
  window.addEventListener('pointerup', onResizeUp);
}
function _rawHour(cx){ const ux=(cx-rz.rect.left)*(rz.uw/(rz.rect.width||rz.uw)); return AX0+Math.round(ux/(HW/2))*0.5; }
function onResizeMove(e){
  if(!rz||!rz.bar) return; let hr=_rawHour(e.clientX);
  if(rz.edge==='start'){
    hr=Math.max(AX0, Math.min(rz.endH-0.5, hr));
    rz.bar.style.left=((hr-AX0)*HW)+"px";
    rz.bar.style.width=Math.max((rz.endH-hr)*HW,40)+"px";
    const bs=rz.bar.querySelector('.bstart'); if(bs) bs.textContent=hourToStr(hr);
  }else{
    hr=Math.max(rz.startH+0.5, Math.min(AX1, hr));
    rz.bar.style.width=Math.max((hr-rz.startH)*HW,40)+"px";
    const be=rz.bar.querySelector('.bend'); if(be) be.textContent=hourToStr(hr);
  }
}
function onResizeUp(e){
  if(!rz) return; let hr=_rawHour(e.clientX);
  const dec=S.staff[rz.nm].decided[key(rz.d)];
  if(dec&&dec[rz.seg]){
    if(rz.edge==='start'){ hr=Math.max(AX0, Math.min(rz.endH-0.5, hr)); dec[rz.seg].start=hourToStr(hr); }
    else{ hr=Math.max(rz.startH+0.5, Math.min(AX1, hr)); dec[rz.seg].end=hourToStr(hr); }
    touchUpdated(); save();
  }
  window.removeEventListener('pointermove',onResizeMove); window.removeEventListener('pointerup',onResizeUp);
  const dd=dayViewDay; rz=null; if(dd!=null) openDayView(dd);
}

/* ---- A4印刷（横3日 × 縦 大須/那古野/鉄板）---- */
const PX0=9, PX1=24; // 9時〜23時（各列=1時間）
function shiftSegs(v){
  if(!v||v.off) return [];
  let segs=[];
  if(v.all) segs.push([pHM(v.all.start),pHM(v.all.end)]);
  if(v.am)  segs.push([pHM(v.am.start),pHM(v.am.end)]);
  if(v.pm)  segs.push([pHM(v.pm.start),pHM(v.pm.end)]);
  if(!segs.length && (v.start||v.end)) segs.push([pHM(v.start),pHM(v.end)]);
  return segs.filter(x=>x[0]!=null&&x[1]!=null);
}
/* 店舗ごとの固定マス数（印刷）。実人数がこれより多い時は全員ぶん出す */
const PRINT_ROWS={ "大須":18, "那古野":10, "鉄板":6 };
function printStoreRows(st){ return Math.max(PRINT_ROWS[st]||0, storeStaff(st).length); }
function pDayTable(d, blank){
  const dow=DOW[new Date(Y,M-1,d).getDay()];
  let h=`<div class="pdtitle">${M}/${d}（${dow}）</div><table class="pgrid"><thead><tr><th class="pn"></th>`;
  for(let hr=PX0;hr<PX1;hr++) h+=`<th>${hr}</th>`;
  h+=`</tr></thead><tbody>`;
  let EMPTY=""; for(let hr=PX0;hr<PX1;hr++) EMPTY+="<td></td>";
  STORES.forEach(st=>{
    const list=storeStaff(st);
    const col=STORE_COLOR[st]||STORE_COLOR["大須"];
    h+=`<tr class="pst"><td class="pn" style="color:${col.ink}">${st}</td>`;
    for(let hr=PX0;hr<PX1;hr++) h+=`<td class="phr">${hr}</td>`;
    h+=`</tr>`;
    const rowN=printStoreRows(st);
    for(let i=0;i<rowN;i++){
      const nm=list[i]||"";
      h+=`<tr><td class="pn">${nm?esc(nm):""}</td>`;
      if(blank || !nm){
        h+=EMPTY;
      }else{
        const dv=(S.staff[nm].decided||{})[key(d)]; const w=(S.staff[nm].wish||{})[key(d)];
        const use=(dv&&Object.keys(dv).length)?dv:w;
        const off=use&&use.off;
        const segs=shiftSegs(use);
        for(let hr=PX0;hr<PX1;hr++){
          const on=!off && segs.some(([s,e])=> hr<e && (hr+1)>s);
          h+=`<td${on?' style="background:#c9c9c9"':''}></td>`;
        }
      }
      h+=`</tr>`;
    }
  });
  return h+`</tbody></table>`;
}
function printRowCount(){
  let r=1; // 時間の見出し行
  STORES.forEach(st=>{ r+=1+printStoreRows(st); }); // 店舗見出し + 固定マス
  return r;
}
function applyPrintSize(){
  const rows=printRowCount();
  const availMM=185;            // A4横で使える縦の高さの目安
  let rowMM=availMM/rows;
  if(rowMM>13) rowMM=13;        // 大きくなりすぎ防止
  if(rowMM<3.2) rowMM=3.2;      // 小さすぎ防止（人数が多すぎる時）
  const px=rowMM*3.78;          // mm→px
  const set=(el)=>{ if(!el) return; const st=el.style;
    st.setProperty('--rowH', px.toFixed(1)+'px');
    st.setProperty('--fs',   Math.max(5, px*0.50).toFixed(1)+'px');
    st.setProperty('--fsN',  Math.max(6, px*0.52).toFixed(1)+'px');
    st.setProperty('--fsS',  Math.max(8, px*0.62).toFixed(1)+'px');
    st.setProperty('--fsT',  Math.max(10, px*0.85).toFixed(1)+'px');
    st.setProperty('--nameW',Math.round(Math.min(120, Math.max(48, px*3.4)))+'px');
  };
  set($("#printArea")); set($("#ppBody"));
}
function buildPrintDays(days, blank, titleExtra){
  let html='';
  for(let i=0;i<days.length;i+=3){
    html+='<div class="psheet">';
    for(let k=0;k<3;k++){
      const d=days[i+k];
      html+= d ? `<div class="pday">${pDayTable(d, blank)}</div>` : '<div class="pday"></div>';
    }
    html+='</div>';
  }
  $("#printArea").innerHTML=html;   // 実際の印刷用（1枚=3日）
  $("#ppBody").innerHTML=html;      // 画面プレビュー用
  applyPrintSize();
  $("#ppTitle").textContent=`印刷プレビュー（A4 横${titleExtra||''}）${blank?"　白紙":""}`;
  $("#ppMask").style.display="flex";
}
function buildPrint(blank){
  const days=[]; for(let d=1;d<=DAYS;d++) days.push(d);
  buildPrintDays(days, blank, `・${M}月ぜんぶ / 1枚に3日`);
}
/* ---- 希望シフト：A4横1枚（月まるごと・時間表示）---- */
function wishPrintText(w){
  if(!w) return "";
  if(w.off) return "✕";
  const sh=t=>String(t||"").replace(/:00\b/,"").replace(/^0/,"");
  if(w.allday) return "9-23";
  let p=[];
  if(w.all) p.push(`${sh(w.all.start)}-${sh(w.all.end)}`);
  if(w.am) p.push(`AM${sh(w.am.start)}-${sh(w.am.end)}`);
  if(w.pm) p.push(`PM${sh(w.pm.start)}-${sh(w.pm.end)}`);
  if(!p.length && (w.start||w.end)) p.push(`${sh(w.start)}-${sh(w.end)}`);
  return p.join(" ");
}
function pOverviewSheet(mode){  /* mode: 'wish'=希望 / 'decided'=決定 */
  const _off=(st,d)=>!!(S.storeOff&&S.storeOff[key(d)]&&S.storeOff[key(d)][st]);
  let h=`<table class="wovgrid"><tbody>`;
  STORES.forEach(st=>{
    const list=storeStaff(st); const col=STORE_COLOR[st]||STORE_COLOR["大須"];
    /* 店舗ごとに「店舗名＋日にち曜日」の見出し行をくり返す */
    h+=`<tr class="wsthead"><td class="wpn" style="color:${col.ink};background:${col.bg};">${st}（${list.length}）</td>`;
    for(let d=1;d<=DAYS;d++){ const dow=DOW[new Date(Y,M-1,d).getDay()]; const hol=isHol(d);
      const wk=(dow==="日"||hol)?' wsun':(dow==="土")?' wsat':'';
      h+=`<td class="wdh${wk}" style="background:${col.head}">${M}/${d}<br>${dow}</td>`; }
    h+=`</tr>`;
    list.forEach(nm=>{
      const src=(mode==='decided')?(S.staff[nm].decided||{}):(S.staff[nm].wish||{});
      h+=`<tr><td class="wpn">${esc(nm)}</td>`;
      for(let d=1;d<=DAYS;d++){ const v=src[key(d)]; h+=`<td${_off(st,d)?' class="woff"':''}>${v?esc(wishPrintText(v)):""}</td>`; }
      h+=`</tr>`;
    });
    const blanks=Math.max((BLANK_SLOTS[st]||0)-list.length, SPARE_ROWS);  /* 画面と同じ数の空欄行 */
    for(let bi=0;bi<blanks;bi++){ h+=`<tr><td class="wpn">&nbsp;</td>`; for(let d=1;d<=DAYS;d++){ h+=`<td${_off(st,d)?' class="woff"':''}></td>`; } h+=`</tr>`; }
  });
  return h+`</tbody></table>`;
}
function buildOverviewPrint(mode){
  const html=`<div class="wovsheet">${pOverviewSheet(mode)}</div>`;
  $("#printArea").innerHTML=html; $("#ppBody").innerHTML=html;
  /* 一覧は独自レイアウトなのでpgrid用の変数リセット */
  ['--rowH','--fs','--fsN','--fsS','--fsT','--nameW'].forEach(v=>{ const a=$("#printArea"),b=$("#ppBody"); if(a)a.style.removeProperty(v); if(b)b.style.removeProperty(v); });
  /* 下までフィット：総行数からA4横の縦幅を割って行の高さを決める */
  let rowsTotal=0;
  STORES.forEach(st=>{ const n=storeStaff(st).length; const blanks=Math.max((BLANK_SLOTS[st]||0)-n, SPARE_ROWS); rowsTotal += 1.8/*見出し行ぶん*/ + n + blanks; });
  const availMM=183;
  let rowMM=availMM/rowsTotal; if(rowMM>11) rowMM=11; if(rowMM<3.6) rowMM=3.6;
  const cfs =Math.max(5.5, rowMM*0.92);   // マスの時間文字
  const nfs =Math.max(7,   rowMM*1.02);   // 名前
  const dhfs=Math.max(9,   rowMM*1.45);   // 日にち・曜日（大きめ）
  const shfs=Math.max(9,   rowMM*1.45);   // 店舗名
  [$("#printArea"),$("#ppBody")].forEach(el=>{ if(!el) return; const s=el.style;
    s.setProperty('--wrh',  rowMM.toFixed(2)+'mm');
    s.setProperty('--wcfs', cfs.toFixed(1)+'px');
    s.setProperty('--wnfs', nfs.toFixed(1)+'px');
    s.setProperty('--wdhfs',dhfs.toFixed(1)+'px');
    s.setProperty('--wshfs',shfs.toFixed(1)+'px');
  });
  $("#ppTitle").textContent=`印刷プレビュー（${mode==='decided'?'決定シフト':'希望シフト'}・A4横1枚・${M}月）`;
  $("#ppMask").style.display="flex";
}

  const ms=$("#monthSel"); ms.innerHTML=""; for(let m=1;m<=12;m++){ const o=document.createElement("option"); o.value=m; o.textContent=m+"月"; if(m===M)o.selected=true; ms.appendChild(o); }
  const oy=$("#oYearSel"); if(oy){ oy.innerHTML=""; for(let y=2026;y<=2030;y++){ const o=document.createElement("option"); o.value=y; o.textContent=y+"年"; if(y===Y)o.selected=true; oy.appendChild(o); } }
  const om=$("#oMonthSel"); if(om){ om.innerHTML=""; for(let m=1;m<=12;m++){ const o=document.createElement("option"); o.value=m; o.textContent=m+"月"; if(m===M)o.selected=true; om.appendChild(o); } }
}
function setYM(){ Y=+$("#yearSel").value; M=+$("#monthSel").value; DAYS=new Date(Y,M,0).getDate(); HOL=calcJpHolidays(Y); fillYM(); renderStaff(); }
function setYMOwner(){ Y=+$("#oYearSel").value; M=+$("#oMonthSel").value; DAYS=new Date(Y,M,0).getDate(); HOL=calcJpHolidays(Y); fillYM(); renderOwner(); }
function fillNames(){
  const dl=$("#nameList"); if(dl) dl.innerHTML=""; /* 候補（記録）は残さない */
}
function ensureStaff(nm){
  if(!nm) return;
  if(!S.staff[nm]){ S.staff[nm]={store:$("#whoStore").value, wish:{}, decided:{}, notes:{}}; save(); }
}
function applyStaffHeader(){
  const c=STORE_COLOR[$("#whoStore").value];
  const head=document.querySelector("header");
  head.style.background = c ? c.hd : "";
  head.style.color = (c && isLightColor(c.hd)) ? "#333" : "#fff";
}
$("#whoStore").onchange=()=>{ fillNames(); const nm=($("#who").value||"").trim(); if(nm && S.staff[nm]){ S.staff[nm].store=$("#whoStore").value; save(); } applyStaffHeader(); renderStaff(); };
function renderStaff(){
  const me=($("#who").value||"").trim();
  $("#shareBtn").style.display="";
  if(!me){
    $("#sStatus").innerHTML="店舗を選んで、名前を記入してください。";
    $("#staffMine").innerHTML=""; return;
  }
  ensureStaff(me);
  $("#sStatus").innerHTML = "";
  renderMine(me);
}
function wishMini(w){
  if(!w) return "";
  if(w.off) return "✕";
  if(w.allday) return "9:00-23:00";
  let p=[];
  if(w.all) p.push(`${w.all.start||''}-${w.all.end||''}`);
  if(w.am) p.push(`<span class="amp">AM</span>${w.am.start||''}-${w.am.end||''}`);
  if(w.pm) p.push(`<span class="amp">PM</span>${w.pm.start||''}-${w.pm.end||''}`);
  return p.join('<br>');
}
function renderMine(me){
  const dec=S.staff[me].decided||{}, wsh=S.staff[me].wish||{}, tet=S.staff[me].tetsu||{};
  const home=S.staff[me].store||"大須";
  const hc=(STORE_COLOR[home]||STORE_COLOR["大須"]).hd;
  const first=new Date(Y,M-1,1).getDay();
  const _locked=!!(S.decidedMonths&&S.decidedMonths[Y+"-"+M]);
  let html=`<div class="caltools"><button type="button" class="allbtn${_locked?' locked':''}" id="allMaru" ${_locked?'disabled':''}>全部 ◎ 一日OK</button><span class="updatedlbl" id="updatedLbl"></span></div>`;
  html+='<div class="mcal"><div class="mcalgrid">';
  DOW.forEach((dw,i)=>html+=`<div class="mch ${i===0?'sun':i===6?'sat':''}">${dw}</div>`);
  for(let i=0;i<first;i++) html+='<div class="mcell empty"></div>';
  for(let d=1;d<=DAYS;d++){
    const dow=new Date(Y,M-1,d).getDay(), hol=isHol(d);
    const wt=wishMini(wsh[key(d)]);
    const wsmall=wt?`<span class="wsmall">${wt}</span>`:"";
    let body="";
    const v=(S.published&&S.decidedDays&&S.decidedDays[key(d)])?dec[key(d)]:null;
    if(v){
      if(v.off) body='<span class="moff">休</span>';
      else{
        body+=`<span class="mstore" style="background:${hc};color:${isLightColor(hc)?'#333':'#fff'}">${home}</span>`;
        if(v.all) body+=`<span class="mtime mall">${v.all.start||''}-${v.all.end||''}</span>`;
        if(v.am) body+=`<span class="mtime mam"><span class="amp">AM</span>${v.am.start||''}-${v.am.end||''}</span>`;
        if(v.pm) body+=`<span class="mtime mpm"><span class="amp">PM</span>${v.pm.start||''}-${v.pm.end||''}</span>`;
        if(!v.all&&!v.am&&!v.pm&&(v.start||v.end)) body+=`<span class="mtime mall">${v.start||''}-${v.end||''}</span>`;
      }
    }
    const tv=(S.published&&S.decidedDays&&S.decidedDays[key(d)])?tet[key(d)]:null;
    if(tv&&(tv.all||tv.am||tv.pm)){
      body+=`<span class="mstore" style="background:${(STORE_COLOR["鉄板"]).hd}">鉄板</span>`;
      if(tv.all) body+=`<span class="mtime mall">${tv.all.start||''}-${tv.all.end||''}</span>`;
      if(tv.am) body+=`<span class="mtime mam"><span class="amp">AM</span>${tv.am.start||''}-${tv.am.end||''}</span>`;
      if(tv.pm) body+=`<span class="mtime mpm"><span class="amp">PM</span>${tv.pm.start||''}-${tv.pm.end||''}</span>`;
    }
    const note=(S.staff[me].notes||{})[key(d)];
    const nb=note?`<span class="mbubble" style="color:${hc}"></span>`:'';
    const rq=(S.staff[me].req||{})[key(d)];
    let reqInner="";
    if(rq&&(rq.start||rq.end)){
      if(rq.rejected) reqInner='<span class="reqrejl">拒否</span>';
      else if(rq.approved) reqInner=`<span class="reqokl">OK ${rq.start||''}-${rq.end||''}</span>`;
      else reqInner=`<span class="reqlink" data-req="${d}">要請</span>`;
    }
    html+=`<div class="mcell cclick ${(dow===0||hol)?'sun':dow===6?'sat':''}" data-d="${d}"><div class="mtop"><span class="mnum">${d}</span>${nb}${wsmall}</div>${body}${reqInner}</div>`;
  }
  html+='</div></div>';
  $("#staffMine").innerHTML=html;
  const _u=$("#updatedLbl"); if(_u) _u.textContent = S.updatedAt ? `更新日 ${S.updatedAt}` : "";
  $("#allMaru").onclick=()=>{ if(_locked) return; for(let d=1;d<=DAYS;d++) S.staff[me].wish[key(d)]={allday:true}; save(); renderMine(me); };
  document.querySelectorAll('#staffMine .mcell.cclick').forEach(c=>c.onclick=()=>openDayInput(me, +c.dataset.d));
  document.querySelectorAll('#staffMine .reqlink').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openReqApprove(me, +el.dataset.req); });
}
let diMe=null, diDay=null; let diEditing=false;
function openDayInput(me,d){ diMe=me; diDay=d; const _w0=S.staff[me].wish[key(d)]; diEditing=!(_w0&&Object.keys(_w0).length);
  const dow=new Date(Y,M-1,d).getDay();
  $("#diTitle").textContent=`${M}/${d}（${DOW[dow]}）の希望を入れる`;
  drawDayInput(); $("#diMask").style.display="flex";
}
function _diLock(lock){
  const b=$("#diBody"); if(!b) return;
  b.querySelectorAll('input.tinp,.noteinp,.qbtn').forEach(el=>{ el.disabled=lock; });
  const sb=$("#diSubmit"), eb=$("#diEdit");
  if(sb) sb.style.display=lock?'none':'';
  if(eb) eb.style.display=lock?'':'none';
}
function drawDayInput(){
  const me=diMe, d=diDay;
  const w=S.staff[me].wish[key(d)]||{};
  const am=w.am||{}, pm=w.pm||{}, al=w.all||{};
  const dv=(seg,f)=>{ const o={all:al,am,pm}[seg]; return (o&&o[f])?o[f]:''; };
  const note=((S.staff[me].notes||{})[key(d)]||'').replace(/"/g,'&quot;');
  $("#diBody").innerHTML=`<div class="seg2">
    <div class="line lall"><span class="tg all">一日</span><input type="text" class="tinp" placeholder="：" value="${dv('all','start')}" data-seg="all" data-f="start"><span>〜</span><input type="text" class="tinp" placeholder="：" value="${dv('all','end')}" data-seg="all" data-f="end"></div>
    <div class="line lam"><span class="tg am">AM</span><input type="text" class="tinp" placeholder="：" value="${dv('am','start')}" data-seg="am" data-f="start"><span>〜</span><input type="text" class="tinp" placeholder="：" value="${dv('am','end')}" data-seg="am" data-f="end"></div>
    <div class="line lpm"><span class="tg pm">PM</span><input type="text" class="tinp" placeholder="：" value="${dv('pm','start')}" data-seg="pm" data-f="start"><span>〜</span><input type="text" class="tinp" placeholder="：" value="${dv('pm','end')}" data-seg="pm" data-f="end"></div>
    <div class="line qnote"><button class="qbtn ${w.allday?'on-maru':''}" data-q="maru">◎</button><button class="qbtn ${w.off?'on-batu':''}" data-q="batu">✕</button><button type="button" class="qsubmit" id="diSubmit">決定</button><button type="button" class="qsubmit" id="diEdit" style="display:none;background:#5a6b7a;">変更</button></div>
    <div class="line noteln"><span class="tg note">備考</span><input type="text" class="noteinp" value="${note}" placeholder=""></div>
  </div>`;
  $("#diBody").querySelectorAll('input.tinp').forEach(inp=>inp.onchange=()=>{
    const seg=inp.dataset.seg, f=inp.dataset.f;
    let w=S.staff[me].wish[key(d)]||{};
    delete w.off; delete w.allday; delete w.start; delete w.end;
    if(seg==="all"){ delete w.am; delete w.pm; $("#diBody").querySelectorAll('input.tinp[data-seg="am"],input.tinp[data-seg="pm"]').forEach(x=>x.value=''); }
    else { delete w.all; $("#diBody").querySelectorAll('input.tinp[data-seg="all"]').forEach(x=>x.value=''); }
    w[seg]=w[seg]||{}; w[seg][f]=normTime(inp.value);
    if(!w[seg].start && !w[seg].end) delete w[seg];
    S.staff[me].wish[key(d)]=w; save();
    inp.value=normTime(inp.value);
    const _mb=$("#diBody").querySelector('.qbtn[data-q="maru"]'); if(_mb) _mb.classList.remove('on-maru');
    const _xb=$("#diBody").querySelector('.qbtn[data-q="batu"]'); if(_xb) _xb.classList.remove('on-batu');
  });
  $("#diBody").querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>{
    const cur=S.staff[me].wish[key(d)]||{};
    if(b.dataset.q==="batu"){ S.staff[me].wish[key(d)]=cur.off?{}:{off:true}; }
    else{ S.staff[me].wish[key(d)]=cur.allday?{}:{allday:true}; }
    save(); drawDayInput();
  });
  $("#diBody").querySelector('.noteinp').onchange=function(){
    if(!S.staff[me].notes) S.staff[me].notes={};
    const t=this.value.trim(); if(t) S.staff[me].notes[key(d)]=t; else delete S.staff[me].notes[key(d)];
    save();
  };
  $("#diSubmit").onclick=()=>{ $("#diMask").style.display="none"; renderStaff(); };
  $("#diEdit").onclick=()=>{ diEditing=true; _diLock(false); };
  _diLock(!diEditing);
}
$("#diMask").onclick=e=>{ if(e.target.id==="diMask"){ $("#diMask").style.display="none"; renderStaff(); } };
let raMe=null, raDay=null;
function openReqApprove(me,d){
  raMe=me; raDay=d;
  const r=(S.staff[me].req||{})[key(d)]||{};
  const dow=new Date(Y,M-1,d).getDay();
  $("#raTitle").textContent=`${M}/${d}（${DOW[dow]}）オーナーからの要請`;
  $("#raBody").innerHTML=`<div class="seg2">
    <div class="line lall"><span class="tg all">一日</span><input type="text" class="tinp" placeholder="9:00" id="raAllS" value="${r.start||''}"><span>〜</span><input type="text" class="tinp" placeholder="9:00" id="raAllE" value="${r.end||''}"></div>
    <div class="line lam"><span class="tg am">AM</span><input type="text" class="tinp" placeholder="9:00" id="raAmS"><span>〜</span><input type="text" class="tinp" placeholder="9:00" id="raAmE"></div>
    <div class="line lpm"><span class="tg pm">PM</span><input type="text" class="tinp" placeholder="9:00" id="raPmS"><span>〜</span><input type="text" class="tinp" placeholder="9:00" id="raPmE"></div>
  </div>`;
  $("#raMask").style.display="flex";
}
$("#raApprove").onclick=()=>{
  if(raMe==null) return;
  const s=normTime($("#raAllS").value||$("#raAmS").value||$("#raPmS").value);
  const e=normTime($("#raAllE").value||$("#raAmE").value||$("#raPmE").value);
  if(!s&&!e){ alert("承認する時間を入れてください"); return; }
  if(!S.staff[raMe].req) S.staff[raMe].req={};
  S.staff[raMe].req[key(raDay)]={start:s,end:e,approved:true,rejected:false};
  save(); $("#raMask").style.display="none"; renderStaff();
};
$("#raReject").onclick=()=>{
  if(raMe==null) return;
  if(S.staff[raMe].req&&S.staff[raMe].req[key(raDay)]){ const o=S.staff[raMe].req[key(raDay)]; o.approved=false; o.rejected=true; }
  save(); $("#raMask").style.display="none"; renderStaff();
};
$("#raMask").onclick=e=>{ if(e.target.id==="raMask") $("#raMask").style.display="none"; };
$("#who").onchange=()=>renderStaff();
$("#whoOk").onclick=()=>{ const nm=($("#who").value||"").trim(); if(!nm){ $("#who").focus(); return; } ensureStaff(nm); S.staff[nm].store=$("#whoStore").value; save(); applyStaffHeader(); renderStaff(); };
$("#who").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#whoOk").click(); } });
$("#yearSel").onchange=setYM; $("#monthSel").onchange=setYM;
$("#oYearSel").onchange=setYMOwner; $("#oMonthSel").onchange=setYMOwner;
$("#shareBtn").onclick=async ()=>{
  const url = "https://zaiko-app-two.vercel.app/shift-staff.html";   // スタッフに配る公開URL（固定）
  try{ await navigator.clipboard.writeText(url); alert("スタッフ用URLをコピーしました。LINEに貼り付けて送ってください：\n\n"+url); }
  catch(e){ alert("このスタッフ用URLをLINEに貼り付けて送ってください：\n\n"+url); }
};
$("#shareOwnerBtn").onclick=async ()=>{
  const url = "https://zaiko-app-two.vercel.app/shift-owner.html";   // オーナー用の公開URL（固定）
  try{ await navigator.clipboard.writeText(url); alert("オーナー用URLをコピーしました。自分のスマホなどで開いてください：\n\n"+url); }
  catch(e){ alert("このオーナー用URLをブラウザで開いてください：\n\n"+url); }
};

/* ================= 画面切替 ================= */
function showStaff(){ $("#staffView").style.display=""; $("#ownerView").style.display="none";
  $("#shareOwnerBtn").style.display="none";
  $("#tbStaff").classList.add("on"); $("#tbOwner").classList.remove("on"); applyStaffHeader(); renderStaff(); }
function showOwner(){ $("#staffView").style.display="none"; $("#ownerView").style.display="";
  document.querySelector("header").style.background="#2b2b2b"; $("#shareBtn").style.display=""; $("#shareOwnerBtn").style.display="";
  $("#tbOwner").classList.add("on"); $("#tbStaff").classList.remove("on"); fillYM(); renderOwner(); }
$("#tbStaff").onclick=showStaff; $("#tbOwner").onclick=showOwner;

initWho(); buildPalette(); showOwner();
</script>
</body>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#5f5c55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="私の管理">
<link rel="manifest" href="/my-management.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/my-management-icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/my-management-icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/my-management-icon-180.png">
<title>私の管理｜Zaikon</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#24231f;--sub:#747168;--line:#dedbd2;--green:#2c5f2e;--blue:#185fa5;--pink:#c74a68}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--green);color:#fff;padding:22px 18px}
header div{max-width:880px;margin:auto}
h1{margin:0;font-size:26px}
header p{margin:5px 0 0;font-size:13px;opacity:.85}
main{max-width:880px;margin:0 auto;padding:22px 14px 50px}
.notice{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:22px;color:var(--sub);font-size:12px}
section{margin-bottom:26px}
h2{font-size:14px;color:var(--sub);margin:0 0 9px;padding-left:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card:hover{box-shadow:0 5px 16px rgba(0,0,0,.09);transform:translateY(-1px)}
.card:active{transform:translateY(1px)}
.icon{font-size:25px;margin-bottom:8px}
.name{font-size:17px;font-weight:800}
.desc{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5}
.inventory{border-left:5px solid var(--green)}
.sales{border-left:5px solid var(--blue)}
.shift{border-left:5px solid var(--pink)}
footer{text-align:center;color:#999;font-size:11px;padding-top:8px}
@media(max-width:560px){.grid{grid-template-columns:1fr}header{padding:18px 16px}h1{font-size:22px}.card{padding:15px}}
</style>
</head>
<body>
<header><div><h1>私の管理</h1><p>Zaikon アプリ一覧</p></div></header>
<main>
<div class="notice">このページをブックマークしてお使いください。各アプリは新しいタブで開きます。</div>
<section>
<h2>在庫管理</h2>
<div class="grid">
<a class="card inventory" href="/" target="_blank" rel="noopener"><div class="icon">📦</div><div class="name">毎日在庫</div><div class="desc">日々の在庫・販売・入荷を管理</div></a>
<a class="card inventory" href="/inventory.html" target="_blank" rel="noopener"><div class="icon">🗂️</div><div class="name">在庫管理</div><div class="desc">店舗・品目・棚卸しを管理</div></a>
</div>
</section>
<section>
<h2>売上管理</h2>
<div class="grid">
<a class="card sales" href="/sales-input.html" target="_blank" rel="noopener"><div class="icon">🧾</div><div class="name">売上入力</div><div class="desc">店舗ごとの売上を入力</div></a>
<a class="card sales" href="/sales-owner.html" target="_blank" rel="noopener"><div class="icon">👑</div><div class="name">売上オーナー</div><div class="desc">店舗別の売上状況を確認</div></a>
</div>
</section>
<section>
<h2>シフト管理</h2>
<div class="grid">
<a class="card shift" href="/shift-staff.html" target="_blank" rel="noopener"><div class="icon">📅</div><div class="name">シフト・スタッフ</div><div class="desc">希望シフトの入力画面</div></a>
<a class="card shift" href="/shift-owner.html" target="_blank" rel="noopener"><div class="icon">🗓️</div><div class="name">シフト・オーナー</div><div class="desc">シフトの作成・公開画面</div></a>
</div>
</section>
<footer>My Management v1.2</footer>
</main>
<script>
document.querySelectorAll('a.card').forEach(function(link){
  const appPath=link.getAttribute('href');
  link.addEventListener('click',function(){
    const latest=new URL(appPath,window.location.origin);
    latest.searchParams.set('_latest',Date.now().toString());
    link.href=latest.href;
  });
});
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/my-management-sw.js');
  });
}
</script>
</body>
</html>

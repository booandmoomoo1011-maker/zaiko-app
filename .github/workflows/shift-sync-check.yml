name: Zaikon app safety check

on:
  push:
    paths:
      - "my-management.html"
      - "index.html"
      - "inventory.html"
      - "price-management.html"
      - "inventory-spreadsheet-sync.gs"
      - "INVENTORY-SPREADSHEET-SYNC.md"
      - "sales-input.html"
      - "sales-owner.html"
      - "shift/index.html"
      - "shift-staff.html"
      - "shift/owner.html"
      - "shift-owner.html"
      - "database.rules.json"
      - "firebase.json"
      - "sw.js"
      - "*.webmanifest"
      - "icons/**"
      - "my-management-icon-*.png"
      - "OFFICIAL-STRUCTURE.md"
      - "CLAUDE.md"
      - "ZAIKON-HANDOFF.md"
      - ".github/workflows/shift-sync-check.yml"
  pull_request:
    paths:
      - "my-management.html"
      - "index.html"
      - "inventory.html"
      - "price-management.html"
      - "inventory-spreadsheet-sync.gs"
      - "INVENTORY-SPREADSHEET-SYNC.md"
      - "sales-input.html"
      - "sales-owner.html"
      - "shift/index.html"
      - "shift-staff.html"
      - "shift/owner.html"
      - "shift-owner.html"
      - "database.rules.json"
      - "firebase.json"
      - "sw.js"
      - "*.webmanifest"
      - "icons/**"
      - "my-management-icon-*.png"
      - "OFFICIAL-STRUCTURE.md"
      - "CLAUDE.md"
      - "ZAIKON-HANDOFF.md"
      - ".github/workflows/shift-sync-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm formal app files and metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            my-management.html
            index.html
            inventory.html
            price-management.html
            sales-input.html
            sales-owner.html
            shift/index.html
            shift-staff.html
            shift/owner.html
            shift-owner.html
          )
          for file in "${files[@]}"; do
            test -s "$file" || {
              echo "::error file=$file::Formal app file is missing or empty."
              exit 1
            }
            grep -Fq 'property="og:title"' "$file" || {
              echo "::error file=$file::og:title is missing."
              exit 1
            }
            grep -Fq 'property="og:url"' "$file" || {
              echo "::error file=$file::og:url is missing."
              exit 1
            }
            grep -Fq 'property="og:image"' "$file" || {
              echo "::error file=$file::og:image is missing."
              exit 1
            }
            grep -Eq 'rel=["'\'' ]*manifest' "$file" || {
              echo "::error file=$file::PWA manifest link is missing."
              exit 1
            }
          done

      - name: Confirm manifests and formal icons
        shell: python
        run: |
          import json
          from pathlib import Path

          manifests = [
              "my-management.webmanifest",
              "daily-inventory.webmanifest",
              "inventory.webmanifest",
              "price-management.webmanifest",
              "sales-input.webmanifest",
              "sales-owner.webmanifest",
              "shift-staff.webmanifest",
              "shift-owner.webmanifest",
          ]
          icon_bases = [
              "icons/daily-inventory",
              "icons/inventory",
              "icons/price-management",
              "icons/sales-input",
              "icons/sales-owner",
              "icons/shift-staff",
              "icons/shift-owner",
          ]
          for manifest in manifests:
              data = json.loads(Path(manifest).read_text(encoding="utf-8"))
              if not data.get("start_url") or not data.get("icons"):
                  raise SystemExit(f"{manifest}: start_url or icons is missing")
              for icon in data["icons"]:
                  icon_path = Path(str(icon["src"]).split("?", 1)[0].lstrip("/"))
                  if not icon_path.is_file() or icon_path.stat().st_size == 0:
                      raise SystemExit(f"{manifest}: referenced icon is missing: {icon_path}")
          for size in (16, 32, 180, 192, 512):
              path = Path(f"my-management-icon-{size}.png")
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing My Management icon: {path}")
          for base in icon_bases:
              for size in (16, 32, 180, 192, 512):
                  path = Path(f"{base}-{size}.png")
                  if not path.is_file() or path.stat().st_size == 0:
                      raise SystemExit(f"Missing formal app icon: {path}")

      - name: Confirm app previews are not shared accidentally
        shell: python
        run: |
          import re
          from pathlib import Path

          files = [
              "my-management.html",
              "index.html",
              "inventory.html",
              "price-management.html",
              "sales-input.html",
              "sales-owner.html",
              "shift/index.html",
              "shift/owner.html",
          ]
          seen_urls = {}
          seen_images = {}
          for file in files:
              text = Path(file).read_text(encoding="utf-8")
              for prop, seen in (("og:url", seen_urls), ("og:image", seen_images)):
                  match = re.search(
                      rf'<meta\s+property=["\x27]{re.escape(prop)}["\x27]\s+content=["\x27]([^"\x27]+)',
                      text,
                      re.I,
                  )
                  if not match:
                      raise SystemExit(f"{file}: {prop} is missing")
                  value = match.group(1)
                  if value in seen:
                      raise SystemExit(
                          f"{file}: {prop} duplicates {seen[value]} ({value})"
                      )
                  seen[value] = file

      - name: Confirm paired shift files are identical
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent shift/index.html shift-staff.html || {
            echo "::error::Staff shift files differ. Update both with identical content."
            exit 1
          }
          cmp --silent shift/owner.html shift-owner.html || {
            echo "::error::Owner shift files differ. Update both with identical content."
            exit 1
          }

      - name: Protect important app behavior
        shell: bash
        run: |
          set -euo pipefail

          grep -Eq "cache[[:space:]]*:[[:space:]]*['\x22]no-store['\x22]" sw.js || {
            echo "::error file=sw.js::Network-first no-store navigation is missing."
            exit 1
          }

          grep -Fq '<select id="who"' shift/index.html || {
            echo "::error file=shift/index.html::The staff name selector is missing."
            exit 1
          }
          grep -Fq 'SHIFT_ACCESS_TOKEN' shift/index.html || {
            echo "::error file=shift/index.html::Dedicated staff URL validation is missing."
            exit 1
          }
          grep -Fq 'signInAnonymously' shift/index.html || {
            echo "::error file=shift/index.html::Anonymous staff authentication is missing."
            exit 1
          }
          grep -Fq '<!-- PULL_TO_REFRESH_V1 -->' shift/index.html || {
            echo "::error file=shift/index.html::Pull-to-refresh is missing."
            exit 1
          }
          if grep -Fq '<input id="who"' shift/index.html; then
            echo "::error file=shift/index.html::Obsolete free-text staff input detected."
            exit 1
          fi

          grep -Fq 'GoogleAuthProvider' shift/owner.html || {
            echo "::error file=shift/owner.html::Google owner authentication is missing."
            exit 1
          }
          grep -Fq 'else if(user.isAnonymous) signOut(auth)' shift/owner.html || {
            echo "::error file=shift/owner.html::Anonymous editor sessions must be cleared before owner authentication."
            exit 1
          }
          grep -Fq 'window.shiftOwnerAuthError' shift/owner.html || {
            echo "::error file=shift/owner.html::Recoverable owner authentication errors are missing."
            exit 1
          }
          grep -Fq "b.textContent='もう一度確認'" shift/owner.html || {
            echo "::error file=shift/owner.html::Owner authentication retry control is missing."
            exit 1
          }
          grep -Fq 'fbIssueStaffUrl' shift/owner.html || {
            echo "::error file=shift/owner.html::Dedicated staff URL issuing is missing."
            exit 1
          }
          grep -Fq "changes['access/tokens/'+token+'/active']=false" shift/owner.html || {
            echo "::error file=shift/owner.html::Token revocation on staff deletion is missing."
            exit 1
          }
          grep -Fq 'fbIssueEditorUrl' shift/owner.html || {
            echo "::error file=shift/owner.html::Shift-editor URL issuing is missing."
            exit 1
          }
          grep -Fq 'signInAnonymously' shift/owner.html || {
            echo "::error file=shift/owner.html::Anonymous shift-editor authentication is missing."
            exit 1
          }
          grep -Fq 'canManageStaff()' shift/owner.html || {
            echo "::error file=shift/owner.html::Shift-editor staff-management UI guard is missing."
            exit 1
          }
          grep -Fq '"editorTokens"' database.rules.json || {
            echo "::error file=database.rules.json::Shift-editor token rules are missing."
            exit 1
          }
          grep -Fq '"editorSessions"' database.rules.json || {
            echo "::error file=database.rules.json::Shift-editor session rules are missing."
            exit 1
          }
          grep -Fq 'data.exists() && newData.exists()' database.rules.json || {
            echo "::error file=database.rules.json::Shift-editor staff create/delete protection is missing."
            exit 1
          }

          python - <<'PY'
          import json
          from pathlib import Path

          rules = json.loads(Path("database.rules.json").read_text(encoding="utf-8"))["rules"]["zaiko"]["shift"]
          meta = rules["meta"]
          if "editorTokens" in meta[".write"]:
              raise SystemExit("Shift editors must not have parent-level meta write access")
          for key in ("published", "updatedAt", "decidedMonths", "decidedDays", "storeMemo", "storeOff"):
              if "editorTokens" not in meta.get(key, {}).get(".write", ""):
                  raise SystemExit(f"Shift editor write rule is missing for meta/{key}")
          if "editorTokens" in meta.get("roster", {}).get(".write", ""):
              raise SystemExit("Shift editors must not be able to change the roster")
          PY

          python -m json.tool database.rules.json >/dev/null
          python -m json.tool firebase.json >/dev/null
          grep -Fq '".read": false' database.rules.json || {
            echo "::error file=database.rules.json::Database root must be closed by default."
            exit 1
          }

          grep -Fq 'last_store' sales-input.html || {
            echo "::error file=sales-input.html::Remembered store selection is missing."
            exit 1
          }
          grep -Fq 'signInAnonymously' sales-input.html || {
            echo "::error file=sales-input.html::Dedicated sales URL authentication is missing."
            exit 1
          }
          grep -Fq 'zaiko/app_access/sessions/' sales-input.html || {
            echo "::error file=sales-input.html::Dedicated sales URL session is missing."
            exit 1
          }
          grep -Fq 'signInAnonymously' index.html || {
            echo "::error file=index.html::Dedicated daily-inventory URL authentication is missing."
            exit 1
          }
          grep -Fq 'zaiko/app_access/sessions/' index.html || {
            echo "::error file=index.html::Dedicated daily-inventory URL session is missing."
            exit 1
          }
          grep -Fq 'GoogleAuthProvider' sales-owner.html || {
            echo "::error file=sales-owner.html::Sales-owner Google authentication is missing."
            exit 1
          }
          grep -Fq "zaiko/shift/access/admins/" sales-owner.html || {
            echo "::error file=sales-owner.html::Shared owner administrator check is missing."
            exit 1
          }
          grep -Fq 'signInAnonymously' sales-owner.html || {
            echo "::error file=sales-owner.html::Dedicated sales-owner share authentication is missing."
            exit 1
          }
          grep -Fq 'salesOwnerSessions' sales-owner.html || {
            echo "::error file=sales-owner.html::Dedicated sales-owner share session is missing."
            exit 1
          }
          grep -Fq '"salesOwnerTokens"' database.rules.json || {
            echo "::error file=database.rules.json::Sales-owner share token rules are missing."
            exit 1
          }
          grep -Fq '"salesOwnerSessions"' database.rules.json || {
            echo "::error file=database.rules.json::Sales-owner share session rules are missing."
            exit 1
          }
          grep -Fq "new URL('/sales-owner.html', location.origin)" owner.html || {
            echo "::error file=owner.html::Legacy sales-owner redirect is missing."
            exit 1
          }
          grep -Fq '"app_access"' database.rules.json || {
            echo "::error file=database.rules.json::App-access rules are missing."
            exit 1
          }

      - name: Reject an app version rollback
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            old_ref="$BASE_SHA"
          else
            old_ref="$BEFORE_SHA"
          fi
          if [ -z "$old_ref" ] || [[ "$old_ref" =~ ^0+$ ]]; then
            exit 0
          fi

          files=(
            my-management.html
            index.html
            inventory.html
            price-management.html
            sales-input.html
            sales-owner.html
            shift/index.html
            shift-staff.html
            shift/owner.html
            shift-owner.html
          )
          for file in "${files[@]}"; do
            git cat-file -e "$old_ref:$file" 2>/dev/null || continue
            old_version="$(git show "$old_ref:$file" | grep -Eo 'v[0-9]+\.[0-9]+' | sort -V | tail -1 || true)"
            new_version="$(grep -Eo 'v[0-9]+\.[0-9]+' "$file" | sort -V | tail -1 || true)"
            [ -n "$old_version" ] && [ -n "$new_version" ] || continue
            lowest="$(printf '%s\n%s\n' "$old_version" "$new_version" | sort -V | head -1)"
            if [ "$lowest" != "$old_version" ]; then
              echo "::error file=$file::Version rollback detected: $old_version -> $new_version"
              exit 1
            fi
          done

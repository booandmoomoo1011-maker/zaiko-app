<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Zaikon</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#24231f;--sub:#747168;--line:#dedbd2;--green:#2c5f2e;--blue:#185fa5;--pink:#c74a68;--gold:#8a6d00}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--green);color:#fff;padding:22px 18px}
header div{max-width:880px;margin:auto}
h1{margin:0;font-size:27px;letter-spacing:.03em}
header p{margin:5px 0 0;font-size:13px;opacity:.85}
main{max-width:880px;margin:0 auto;padding:22px 14px 50px}
section{margin-bottom:26px}
h2{font-size:14px;color:var(--sub);margin:0 0 9px;padding-left:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card:active{transform:translateY(1px)}
.icon{font-size:25px;margin-bottom:8px}
.name{font-size:17px;font-weight:800}
.desc{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5}
.inventory{border-left:5px solid var(--green)}
.sales{border-left:5px solid var(--blue)}
.shift{border-left:5px solid var(--pink)}
footer{text-align:center;color:#999;font-size:11px;padding-top:8px}
@media(max-width:560px){.grid{grid-template-columns:1fr}header{padding:18px 16px}h1{font-size:23px}.card{padding:15px}}
</style>
</head>
<body>
<header><div><h1>Zaikon</h1><p>在庫・売上・シフト管理</p></div></header>
<main>
<section>
<h2>在庫管理</h2>
<div class="grid">
<a class="card inventory" href="daily-inventory.html"><div class="icon">📦</div><div class="name">毎日在庫</div><div class="desc">日々の在庫、販売、無料、入荷を記録します。</div></a>
<a class="card inventory" href="inventory.html"><div class="icon">🗂️</div><div class="name">在庫管理</div><div class="desc">店舗・品目・棚卸しデータを管理します。</div></a>
</div>
</section>
<section>
<h2>売上管理</h2>
<div class="grid">
<a class="card sales" href="sales-input.html"><div class="icon">🧾</div><div class="name">売上入力</div><div class="desc">各店舗の売上を入力します。</div></a>
<a class="card sales" href="sales-owner.html"><div class="icon">👑</div><div class="name">売上オーナー管理</div><div class="desc">店舗別の売上状況を確認します。</div></a>
</div>
</section>
<section>
<h2>シフト管理</h2>
<div class="grid">
<a class="card shift" href="shift-staff.html"><div class="icon">📅</div><div class="name">シフト希望</div><div class="desc">スタッフ用の希望シフト入力画面です。</div></a>
<a class="card shift" href="shift-owner.html"><div class="icon">🗓️</div><div class="name">シフト作成</div><div class="desc">オーナー用のシフト作成・公開画面です。</div></a>
</div>
</section>
<footer>Zaikon Hub v1.0</footer>
</main>
</body>
</html>

<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#24231f;--sub:#747168;--line:#dedbd2;--green:#2c5f2e;--blue:#185fa5;--pink:#c74a68}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#000;color:#fff;padding:22px 18px}
header div{max-width:880px;margin:auto}
h1{margin:0;font-size:26px}
header p{margin:5px 0 0;font-size:13px;opacity:.85}
main{max-width:880px;margin:0 auto;padding:22px 14px 50px}
.notice{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:22px;color:var(--sub);font-size:12px}
section{margin-bottom:26px}
h2{font-size:14px;color:var(--sub);margin:0 0 9px;padding-left:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card:hover{box-shadow:0 5px 16px rgba(0,0,0,.09);transform:translateY(-1px)}
.card:active{transform:translateY(1px)}
.icon{width:82px;height:82px;margin-bottom:12px;border-radius:20px;display:block;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.name{font-size:17px;font-weight:800}
.desc{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.5}
.inventory{border-left:5px solid var(--green)}
.sales{border-left:5px solid var(--blue)}
.shift{border-left:5px solid var(--pink)}
footer{text-align:center;color:#999;font-size:11px;padding-top:8px}
@media(max-width:560px){.grid{grid-template-columns:1fr}header{padding:18px 16px}h1{font-size:22px}.card{padding:15px}.icon{width:74px;height:74px}}
</style>
</head>
<body>
<!-- PWA_INSTALL_KIT_START (ホーム画面追加：SW登録＋インストールボタン＋LINE案内) -->
<div id="pwaBar" style="display:none;position:fixed;left:0;right:0;top:0;z-index:2147483000;background:#111;color:#fff;padding:12px 14px;font-size:14px;line-height:1.7;box-shadow:0 2px 10px rgba(0,0,0,.35);font-family:sans-serif;">
  <div style="font-weight:700;margin-bottom:4px;">📱 ホーム画面に追加する方法</div>
  <div id="pwaBarMsg" style="color:#ffe;"></div>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
    <button id="pwaBarCopy" style="background:#06c755;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;">🔗 URLをコピー</button>
    <button id="pwaBarClose" style="background:#555;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;">閉じる</button>
  </div>
</div>
<button id="pwaInstallBtn" style="display:none;position:fixed;right:14px;bottom:14px;z-index:2147483000;background:#06c755;color:#fff;border:0;border-radius:24px;padding:12px 18px;font-size:15px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.35);font-family:sans-serif;">📲 ホーム画面に追加</button>
<script>
(function(){
  try{
    var ua=navigator.userAgent||'';
    var inLine=/Line\//i.test(ua);
    var isIOS=/iPhone|iPad|iPod/i.test(ua);
    var isMobile=/Android|iPhone|iPad|iPod/i.test(ua);
    var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
    var bar=document.getElementById('pwaBar');
    var msg=document.getElementById('pwaBarMsg');
    var btn=document.getElementById('pwaInstallBtn');
    var deferred=null;
    function stepText(){
      if(inLine) return isIOS? "右下メニュー→「Safariで開く」→ 下の共有ボタン（□に↑）→「ホーム画面に追加」" : "右上の「…」→「Chromeで開く」→ 右上の「⋮」→「ホーム画面に追加」";
      return isIOS? "下の共有ボタン（□に↑）→「ホーム画面に追加」" : "右上の「⋮」→「ホーム画面に追加」／「アプリをインストール」";
    }
    function showBar(){ if(!bar||!msg) return; msg.innerHTML=(inLine?"いまLINEの中で開いています。このままだと追加できません。<br>":"")+stepText(); bar.style.display='block'; }
    window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; if(btn&&!standalone) btn.style.display='block'; });
    window.addEventListener('appinstalled',function(){ if(btn) btn.style.display='none'; if(bar) bar.style.display='none'; });
    if(btn) btn.onclick=async function(){ if(deferred){ deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; btn.style.display='none'; } else { showBar(); } };
    var cbtn=document.getElementById('pwaBarClose'); if(cbtn) cbtn.onclick=function(){ if(bar) bar.style.display='none'; };
    var copyb=document.getElementById('pwaBarCopy'); if(copyb) copyb.onclick=async function(){ var u=location.href.split('#')[0]; try{ await navigator.clipboard.writeText(u); alert("URLをコピーしました。SafariまたはChromeのアドレス欄に貼り付けて開いてください：\n\n"+u); }catch(e){ alert("このURLをSafari/Chromeで開いてください：\n\n"+u); } };
    if(standalone) return;
    if(inLine){ showBar(); }
    else if(isIOS){ showBar(); }
    else if(isMobile && btn){ setTimeout(function(){ if(!standalone && !deferred && btn.style.display==='none'){ btn.style.display='block'; } }, 1500); }
  }catch(e){}
})();
</script>
<!-- PWA_INSTALL_KIT_END -->

<header><div><h1>私の管理</h1><p>Zaikon アプリ一覧</p></div></header>

<footer>My Management v2.0</footer>
</main>
<script>
document.querySelectorAll('a.card').forEach(function(link){
  const appPath=link.getAttribute('href');
  link.addEventListener('click',function(){
    const latest=new URL(appPath,window.location.origin);
    latest.searchParams.set('_latest',Date.now().toString());
    link.href=latest.href;
  });
});
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/my-management-sw.js');
  });
}
</script>

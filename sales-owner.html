<!-- PWA_INSTALL_KIT_START (ホーム画面追加：SW登録＋インストールボタン＋LINE案内) -->
<div id="pwaBar" style="display:none;position:fixed;left:0;right:0;top:0;z-index:2147483000;background:#111;color:#fff;padding:12px 14px;font-size:14px;line-height:1.7;box-shadow:0 2px 10px rgba(0,0,0,.35);font-family:sans-serif;">
  <div style="font-weight:700;margin-bottom:4px;">📱 ホーム画面に追加する方法</div>
  <div id="pwaBarMsg" style="color:#ffe;"></div>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
    <button id="pwaBarCopy" style="background:#06c755;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;">🔗 URLをコピー</button>
    <button id="pwaBarClose" style="background:#555;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;">閉じる</button>
  </div>
</div>
<button id="pwaInstallBtn" style="display:none;position:fixed;right:14px;bottom:14px;z-index:2147483000;background:#06c755;color:#fff;border:0;border-radius:24px;padding:12px 18px;font-size:15px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.35);font-family:sans-serif;">📲 ホーム画面に追加</button>
<script>
(function(){
  try{
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }
    var ua=navigator.userAgent||'';
    var inLine=/Line\//i.test(ua);
    var isIOS=/iPhone|iPad|iPod/i.test(ua);
    var isMobile=/Android|iPhone|iPad|iPod/i.test(ua);
    var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
    var bar=document.getElementById('pwaBar');
    var msg=document.getElementById('pwaBarMsg');
    var btn=document.getElementById('pwaInstallBtn');
    var deferred=null;
    function stepText(){
      if(inLine) return isIOS? "右下メニュー→「Safariで開く」→ 下の共有ボタン（□に↑）→「ホーム画面に追加」" : "右上の「…」→「Chromeで開く」→ 右上の「⋮」→「ホーム画面に追加」";
      return isIOS? "下の共有ボタン（□に↑）→「ホーム画面に追加」" : "右上の「⋮」→「ホーム画面に追加」／「アプリをインストール」";
    }
    function showBar(){ if(!bar||!msg) return; msg.innerHTML=(inLine?"いまLINEの中で開いています。このままだと追加できません。<br>":"")+stepText(); bar.style.display='block'; }
    window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; if(btn&&!standalone) btn.style.display='block'; });
    window.addEventListener('appinstalled',function(){ if(btn) btn.style.display='none'; if(bar) bar.style.display='none'; });
    if(btn) btn.onclick=async function(){ if(deferred){ deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; btn.style.display='none'; } else { showBar(); } };
    var cbtn=document.getElementById('pwaBarClose'); if(cbtn) cbtn.onclick=function(){ if(bar) bar.style.display='none'; };
    var copyb=document.getElementById('pwaBarCopy'); if(copyb) copyb.onclick=async function(){ var u=location.href.split('#')[0]; try{ await navigator.clipboard.writeText(u); alert("URLをコピーしました。SafariまたはChromeのアドレス欄に貼り付けて開いてください：\n\n"+u); }catch(e){ alert("このURLをSafari/Chromeで開いてください：\n\n"+u); } };
    if(standalone) return;
    if(inLine){ showBar(); }
    else if(isIOS){ showBar(); }
    else if(isMobile && btn){ setTimeout(function(){ if(!standalone && !deferred && btn.style.display==='none'){ btn.style.display='block'; } }, 1500); }
  }catch(e){}
})();
</script>
<!-- PWA_INSTALL_KIT_END -->

<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, onValue, get, update } from 'firebase/database';
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInAnonymously, signInWithPopup, signInWithRedirect } from 'firebase/auth';

const STORE_KEY  = {'那古野':'nagoya','大須':'osu','鉄板':'teppan','鎌倉':'kamakura'};
const STORE_COLOR = {
  '那古野': '#fff9c4',
  '大須':   '#fce4ec',
  '鉄板':   '#e1f5fe',
  '鎌倉':   '#f3e5f5'
};
// バッジ・ボタンの文字色（店舗ボタンと同じ濃い色で読みやすく）
const STORE_TEXT = {
  '那古野': '#5a3e00',
  '大須':   '#880e4f',
  '鉄板':   '#01579b',
  '鎌倉':   '#4a148c'
};
const APP_URL = 'https://zaiko-app-two.vercel.app/sales-input.html';
const STORES_ORDER = ['那古野','大須','鉄板','鎌倉'];

// URLコピーボタン生成
document.getElementById('url-copy-btns').innerHTML = STORES_ORDER.map(s => {
  const color = STORE_COLOR[s];
  const textColor = STORE_TEXT[s] || '#ffffff';
  return `<div class="url-row">
    <span class="url-store-name">${s}店</span>
    <button class="url-copy-btn" style="background:${color};color:${textColor};" onclick="copyUrl('${s}')">📋 専用URL</button>
    <button class="url-copy-btn" style="background:#c0596b;padding-left:12px;padding-right:12px;" onclick="regenerateUrl('${s}')">再発行</button>
  </div>`;
}).join('');

let db = null;
let auth = null;
let ownerAuthorized = false;
let ownerAccessMode = 'none';
let ownerDataStarted = false;
const SALES_OWNER_SHARE_PARAM = 'ownerAccess';
const SALES_OWNER_SHARE_STORAGE = 'zaiko_sales_owner_access_token';
const SALES_OWNER_SHARE_SLOT = 'shared1';

function randomToken() {
  const bytes = new Uint8Array(48);
  crypto.getRandomValues(bytes);
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

function storeKeyForName(store) { return STORE_KEY[store] || store; }

async function ensureStoreToken(appName, store, forceNew) {
  if (!ownerAuthorized || !db) throw new Error('管理者ログインが必要です');
  const storeKey = storeKeyForName(store);
  const mapPath = `zaiko/app_access/byAppStore/${appName}/${storeKey}`;
  const mapSnap = await get(ref(db, mapPath));
  let token = mapSnap.val();
  if (token && !forceNew) {
    const oldSnap = await get(ref(db, `zaiko/app_access/tokens/${token}`));
    const old = oldSnap.val();
    if (!old || old.active !== true || old.app !== appName || old.storeKey !== storeKey) token = null;
  }
  if (ownerAccessMode !== 'admin') {
    if (forceNew) throw new Error('共有者は専用URLを再発行できません');
    if (!token) throw new Error('この店舗の専用URLは、オーナーが先に発行してください');
    return token;
  }
  const changes = {};
  if (token && forceNew) changes[`tokens/${token}/active`] = false;
  if (!token || forceNew) {
    token = randomToken();
    changes[`tokens/${token}`] = { active:true, app:appName, storeKey, storeName:store, issuedAt:Date.now() };
    changes[`byAppStore/${appName}/${storeKey}`] = token;
    await update(ref(db,'zaiko/app_access'), changes);
  }
  return token;
}

async function copyText(text, message) {
  await navigator.clipboard.writeText(text);
  alert(message);
}

window.copyOwnerUrl = function() {
  const url = 'https://zaiko-app-two.vercel.app/sales-owner.html';
  navigator.clipboard.writeText(url).then(() => {
    alert('オーナー用URLをコピーしました。\nLINEに貼り付けて送ってください。');
  });
};

async function ensureSalesOwnerShareToken(forceNew) {
  if (ownerAccessMode !== 'admin' || !db) throw new Error('管理者ログインが必要です');
  const slotPath = `zaiko/app_access/salesOwnerSlots/${SALES_OWNER_SHARE_SLOT}`;
  const slotSnap = await get(ref(db, slotPath));
  let token = slotSnap.val();
  if (token && !forceNew) {
    const oldSnap = await get(ref(db, `zaiko/app_access/salesOwnerTokens/${token}`));
    const old = oldSnap.val();
    if (!old || old.active !== true || old.slot !== SALES_OWNER_SHARE_SLOT) token = null;
  }
  const changes = {};
  if (token && forceNew) changes[`salesOwnerTokens/${token}/active`] = false;
  if (!token || forceNew) {
    token = randomToken();
    changes[`salesOwnerTokens/${token}`] = {
      active: true,
      slot: SALES_OWNER_SHARE_SLOT,
      issuedAt: Date.now()
    };
    changes[`salesOwnerSlots/${SALES_OWNER_SHARE_SLOT}`] = token;
    await update(ref(db, 'zaiko/app_access'), changes);
  }
  return token;
}

function salesOwnerShareUrl(token) {
  const url = new URL('/sales-owner.html', location.origin);
  url.searchParams.set(SALES_OWNER_SHARE_PARAM, token);
  return url.toString();
}

window.copySalesOwnerShareUrl = async function() {
  try {
    for (const store of STORES_ORDER) await ensureStoreToken('sales-input', store, false);
    const token = await ensureSalesOwnerShareToken(false);
    await copyText(salesOwnerShareUrl(token), '共有者1の専用URLをコピーしました。\nLINEに貼り付けて本人へ送ってください。');
  } catch(e) { alert('共有URLを作成できませんでした：' + e.message); }
};

window.regenerateSalesOwnerShareUrl = async function() {
  if (!confirm('共有者1の古いURLを停止して、新しいURLを発行しますか？')) return;
  try {
    for (const store of STORES_ORDER) await ensureStoreToken('sales-input', store, false);
    const token = await ensureSalesOwnerShareToken(true);
    await copyText(salesOwnerShareUrl(token), '共有者1の新しい専用URLをコピーしました。');
  } catch(e) { alert('共有URLを再発行できませんでした：' + e.message); }
};

window.copyUrl = async function(store) {
  try {
    const token = await ensureStoreToken('sales-input', store, false);
    const url = APP_URL + '?store=' + encodeURIComponent(store) + '&access=' + encodeURIComponent(token);
    await copyText(url, store + '店の専用URLをコピーしました。\nLINEに貼り付けて送ってください。');
  } catch(e) { alert('専用URLを作成できませんでした：' + e.message); }
};

window.regenerateUrl = async function(store) {
  if (!confirm(store + '店の古い専用URLを無効にして、新しいURLを発行しますか？')) return;
  try {
    const token = await ensureStoreToken('sales-input', store, true);
    const url = APP_URL + '?store=' + encodeURIComponent(store) + '&access=' + encodeURIComponent(token);
    await copyText(url, store + '店の新しい専用URLをコピーしました。');
  } catch(e) { alert('再発行できませんでした：' + e.message); }
};

window.copyDailyInventoryUrl = async function() {
  try {
    const token = await ensureStoreToken('daily-inventory', '鎌倉', false);
    await copyText('https://zaiko-app-two.vercel.app/?access=' + encodeURIComponent(token), '毎日在庫の専用URLをコピーしました。');
  } catch(e) { alert('専用URLを作成できませんでした：' + e.message); }
};

window.regenerateDailyInventoryUrl = async function() {

// allData をスコープ外に移動
const allData = {};

function startOwnerData() {
  if (ownerDataStarted) return;
  ownerDataStarted = true;
  Object.keys(STORE_KEY).forEach(storeName => {
    const key = STORE_KEY[storeName];
    onValue(ref(db, 'zaiko/sales/' + key + '/history'), snap => {
      if (snap.exists()) {
        const raw = snap.val();
        allData[storeName] = Object.values(raw).map(h => ({...h, storeName}));
      } else {
        allData[storeName] = [];
      }
      renderHistory();
    });
  });
}

let currentFilter = 'all';
let viewYear  = new Date().getFullYear();
let viewMonth = new Date().getMonth() + 1;

window.setFilter = function(store, btn) {
  currentFilter = store;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderHistory();
};
window.changeMonth = function(diff) {
  viewMonth += diff;
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  if (viewMonth < 1)  { viewMonth = 12; viewYear--; }
  renderHistory();
};
window.openStore = async function(store) {
  try {
    const token = await ensureStoreToken('sales-input', store, false);
    window.location.href = 'sales-input.html?store=' + encodeURIComponent(store) + '&access=' + encodeURIComponent(token);
  } catch(e) { alert('店舗を開けませんでした：' + e.message); }
};

function renderHistory() {
  const label = document.getElementById('month-label');
  if (label) label.textContent = viewYear + '年' + viewMonth + '月';

  const monthStr = viewYear + '-' + String(viewMonth).padStart(2,'0');

  let rows = [];
  const stores = currentFilter === 'all' ? Object.keys(STORE_KEY) : [currentFilter];
  stores.forEach(s => {
    (allData[s] || []).forEach(h => {
      if (h.date && h.date.startsWith(monthStr)) rows.push(h);
    });
  });

  rows.sort((a, b) => b.date.localeCompare(a.date));

  const list = document.getElementById('history-list');
  const loading = document.getElementById('loading');
  loading.style.display = 'none';

  if (rows.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:30px;color:#aaa;font-size:13px;">データがありません</div>';
    return;
  }

  list.innerHTML = rows.map(h => {
    const color = STORE_COLOR[h.storeName] || '#1a237e';
    const textColor = STORE_TEXT[h.storeName] || '#ffffff';
    const sales = h.netSales ? '¥' + Number(h.netSales).toLocaleString() : '-';
    const day = h.date ? h.date.slice(5).replace('-','/') : '';
    const sub = [h.weather, h.staff].filter(Boolean).join('　');
    return `
    <div class="history-card">
      <div class="history-badge" style="background:${color};color:${textColor};">${h.storeName.slice(0,2)}</div>
      <div class="history-info">
        <div class="history-date">${day}（${h.storeName}）</div>
        ${sub ? `<div class="history-sub">${sub}</div>` : ''}
      </div>
      <div class="history-sales">${sales}</div>
    </div>`;
  }).join('');
}

document.getElementById('month-label').textContent =
  new Date().getFullYear() + '年' + (new Date().getMonth()+1) + '月';
</script>

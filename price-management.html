<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仕入価格管理 | Zaikon</title>
<meta name="description" content="仕入価格の改定履歴と新商品を安全に管理します。">
<meta property="og:title" content="仕入価格管理 | Zaikon">
<meta property="og:description" content="仕入価格の改定履歴と新商品を安全に管理します。">
<meta property="og:url" content="https://zaiko-app-two.vercel.app/price-management.html">
<meta property="og:image" content="https://zaiko-app-two.vercel.app/icons/inventory-512.png">
<link rel="manifest" href="/price-management.webmanifest?v=1.0.0">
<link rel="icon" href="/icons/inventory-32.png">
<style>
:root{--bg:#090909;--panel:#151515;--panel2:#202020;--line:#353535;--text:#f6f6f6;--muted:#aaa;--gold:#e3ba52;--yellow:#fff2b8;--danger:#df5b5b;--green:#59b889}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#050505,#171717);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;background:rgba(8,8,8,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#f3d27a,#9e7421);color:#111;display:grid;place-items:center;font-weight:900}.title{flex:1}.title h1{font-size:20px;margin:0}.title p{font-size:11px;color:var(--muted);margin:3px 0 0}.role{border:1px solid #6b5626;background:#28200e;color:#f2ce72;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}
main{max-width:1200px;margin:auto;padding:20px 16px 60px}.notice{padding:12px 14px;border:1px solid #604f23;background:#221d10;border-radius:12px;color:#f4d87e;font-size:13px;margin-bottom:16px}.toolbar{display:grid;grid-template-columns:1.2fr 1fr auto auto;gap:10px;margin-bottom:16px}.field{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);min-height:46px;width:100%}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 15px;background:var(--panel2);color:var(--text);font-weight:800}.btn.gold{background:linear-gradient(145deg,#f1d273,#b7892b);border-color:#e1bc57;color:#161108}.btn.green{background:#173b2b;border-color:#327d58;color:#a9e4c8}.btn.danger{background:#3a1818;border-color:#743838;color:#ffb4b4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px}.admin-only{}
.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px 10px;border-bottom:1px solid #2c2c2c;text-align:left;font-size:13px}th{position:sticky;top:0;background:#232323;color:#ddd}.num{text-align:right}.price-box{display:inline-block;min-width:92px;padding:7px 9px;border:1px solid #444;border-radius:8px;background:#0d0d0d;text-align:right}.changed .price-box{background:var(--yellow);border-color:#e0bd3f;color:#111}.changed-note{font-size:10px;color:#f0cb62;margin-top:3px}.empty{padding:40px;text-align:center;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:50}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#181818;border:1px solid #484848;border-radius:18px;padding:20px;box-shadow:0 30px 90px #000}.modal h2{margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{margin-bottom:12px}.row label{display:block;color:#bbb;font-size:12px;font-weight:700;margin-bottom:5px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.history{display:grid;gap:8px}.history-item{padding:12px;border:1px solid var(--line);background:#111;border-radius:12px}.history-item strong{color:#f0cc6d}.history-item small{display:block;color:var(--muted);margin-top:5px}.status{position:fixed;bottom:13px;left:13px;background:#222;border:1px solid #444;border-radius:999px;padding:8px 13px;font-size:11px;color:#ccc;z-index:30}
@media(max-width:720px){.head{padding:10px 12px}.title h1{font-size:17px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.stats .admin-only{grid-column:1/-1}.grid{grid-template-columns:1fr}main{padding:14px 10px 50px}}
</style>
</head>
<body>
<header><div class="head"><div class="mark">¥</div><div class="title"><h1>仕入価格管理</h1><p>価格改定・新商品・履歴</p></div><span class="role" id="roleLabel">確認中</span></div></header>
<main>
  <div class="notice">価格は保存前に変更前・変更後を確認します。過年度の棚卸記録は変更しません。</div>
  <div class="toolbar">
    <input id="search" class="field wide" placeholder="商品名・仕入先を検索">
    <select id="store" class="field"></select>
    <button class="btn gold" id="newBtn">＋ 新商品</button>
    <button class="btn" id="historyBtn">改定履歴</button>
  </div>
  <div class="stats">
    <div class="stat"><small>表示商品</small><strong id="itemCount">0</strong></div>
    <div class="stat"><small>価格変更あり</small><strong id="changedCount">0</strong></div>
    <div class="stat admin-only"><small>全店舗 在庫金額</small><strong id="grandTotal">¥0</strong></div>
  </div>
  <div class="table-wrap"><table><thead><tr><th>店舗</th><th>商品</th><th>仕入先</th><th>単位</th><th class="num">現在価格</th><th>状態</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">読み込んでいます…</td></tr></tbody></table></div>
</main>
<div class="status" id="status">● 読み込み中</div>
<div class="modal-bg hidden" id="modalBg"><div class="modal" id="modal"></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getFirestore,doc,onSnapshot,runTransaction,collection,query,orderBy,limit,getDocs} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const APP_VERSION='1.0.0';
const firebaseConfig={apiKey:'AIzaSyCkkIx44FVKmQdO6kQK_uQVloJccRo2cYo',authDomain:'zaiko2017inb.firebaseapp.com',projectId:'zaiko2017inb',storageBucket:'zaiko2017inb.firebasestorage.app',messagingSenderId:'705085250436',appId:'1:705085250436:web:f369b4981119887fa25bd1'};
const db=getFirestore(initializeApp(firebaseConfig));
const inventoryRef=doc(db,'inventory','main');
const historyCol=collection(db,'inventoryPriceHistory');
const params=new URLSearchParams(location.search);const role=params.get('role')==='admin'?'admin':'editor';
const aliases={osu:1,nagono:2,teppan:3,kamakura:4,'大須':1,'那古野':2,'鉄板':3,'鎌倉':4};
const rawStore=(params.get('store')||'').trim();const fixedStore=Number(rawStore)||aliases[rawStore.toLowerCase()]||aliases[rawStore]||null;
let state={stores:[],allItems:[],nextItemId:903,inventoryYear:null};let history=[];let actor='';let deepLinkOpened=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');const nowIso=()=>new Date().toISOString();
function setStatus(t,bad=false){$('status').textContent=(bad?'● ':'● ')+t;$('status').style.color=bad?'#ff9999':'#b9dfca'}
async function sha256(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function authenticate(){
  if(role==='admin'){
    const pw=prompt('棚卸管理者パスワードを入力してください。');if(pw===null)throw new Error('管理者確認を中止しました');
    const saved=localStorage.getItem('zaikoApp_rolePw');if(!saved)throw new Error('先に棚卸管理者画面で管理者パスワードを設定してください');if(await sha256(pw)!==saved)throw new Error('管理者パスワードが違います');
    actor=localStorage.getItem('zaikoPriceAdminName')||'管理者1';
    const selected=prompt('変更履歴に記録する管理者名を入力してください。',actor);if(!selected?.trim())throw new Error('管理者名を確認できません');actor=selected.trim();localStorage.setItem('zaikoPriceAdminName',actor);
  }else{
    if(!fixedStore)throw new Error('店舗編集者URLを確認してください');actor=localStorage.getItem('zaikoPriceEditorName_'+fixedStore)||'店舗編集者';
    const selected=prompt('変更履歴に記録する編集者名を入力してください。',actor);if(!selected?.trim())throw new Error('編集者名を確認できません');actor=selected.trim();localStorage.setItem('zaikoPriceEditorName_'+fixedStore,actor);
  }
  $('roleLabel').textContent=role==='admin'?'管理者：'+actor:'編集者';
  document.querySelectorAll('.admin-only').forEach(e=>e.classList.toggle('hidden',role!=='admin'));
}
function storeName(id){return state.stores.find(s=>Number(s.id)===Number(id))?.name||'店舗'+id}
function effectiveStores(){return role==='admin'?state.stores:state.stores.filter(s=>Number(s.id)===Number(fixedStore))}
function canAccessItem(item){return !!item&&(role==='admin'||Number(item.storeId)===Number(fixedStore))}
function setupStores(){const current=$('store').value;$('store').innerHTML=(role==='admin'?'<option value="all">全店舗</option>':'')+effectiveStores().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');$('store').value=current&&[...$('store').options].some(o=>o.value===current)?current:(role==='admin'?'all':String(fixedStore))}
function render(){
  setupStores();const store=$('store').value;const q=$('search').value.trim().toLowerCase();
  const items=state.allItems.filter(i=>i.active!==false&&(store==='all'||Number(i.storeId)===Number(store))&&(!q||(i.name+' '+(i.supplier||i.cat||'')).toLowerCase().includes(q)));
  $('itemCount').textContent=items.length;$('changedCount').textContent=items.filter(i=>i.priceChangedSinceLastYear).length;
  $('grandTotal').textContent=yen(state.allItems.filter(i=>i.active!==false).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.price)||0),0));
  $('rows').innerHTML=items.length?items.map(i=>{
    const changed=!!i.priceChangedSinceLastYear;const base=Number(i.previousYearPrice);
    return `<tr class="${changed?'changed':''}"><td>${esc(storeName(i.storeId))}</td><td><strong>${esc(i.name)}</strong><div style="font-size:10px;color:#888">ID ${i.id}</div></td><td>${esc(i.supplier||i.cat||'未設定')}</td><td>${esc(i.unit||'')}</td><td class="num"><span class="price-box">${yen(i.price)}</span>${changed&&Number.isFinite(base)?`<div class="changed-note">前回 ${yen(base)} → 現在 ${yen(i.price)}</div>`:''}</td><td>${i.newProduct?'<span style="color:#9ed8b9">新商品</span>':changed?'<span style="color:#f0cb62">価格変更あり</span>':'変更なし'}</td><td><button class="btn gold" data-change="${i.id}">価格変更</button></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">該当する商品はありません</td></tr>';
  document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>openPrice(Number(b.dataset.change)));
}
function openModal(html){$('modal').innerHTML=html;$('modalBg').classList.remove('hidden')}
function closeModal(){$('modalBg').classList.add('hidden');$('modal').innerHTML=''};$('modalBg').onclick=e=>{if(e.target===$('modalBg'))closeModal()};
function openPrice(id){const i=state.allItems.find(x=>Number(x.id)===id);if(!canAccessItem(i)){alert('この商品の変更権限がありません。');return}openModal(`<h2>価格を変更</h2><div class="row"><label>商品</label><div>${esc(storeName(i.storeId))} ／ <strong>${esc(i.name)}</strong></div></div><div class="grid"><div class="row"><label>変更前価格</label><input class="field" value="${Number(i.price)||0}" disabled></div><div class="row"><label>変更後価格</label><input class="field" id="newPrice" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="row"><label>価格変更日</label><input class="field" id="effectiveDate" type="date" value="${new Date().toLocaleDateString('sv-SE')}"></div><div class="row"><label>仕入先</label><input class="field" id="supplier" value="${esc(i.supplier||i.cat||'')}"></div></div><div class="row"><label>変更者</label><input class="field" value="${esc(actor)}" disabled></div><div class="row"><label>備考（任意）</label><input class="field" id="note"></div><div class="actions"><button class="btn" id="cancel">戻る</button><button class="btn gold" id="save">内容を確認</button></div>`);$('cancel').onclick=closeModal;$('save').onclick=()=>confirmPrice(i)}
function confirmPrice(i){const newPrice=Number($('newPrice').value);const date=$('effectiveDate').value;const supplier=$('supplier').value.trim();const note=$('note').value.trim();if(!Number.isFinite(newPrice)||newPrice<0||newPrice===Number(i.price)){alert('現在と異なる正しい新価格を入力してください。');return}if(!date){alert('価格変更日を入力してください。');return}openModal(`<h2>変更内容の最終確認</h2><div class="notice">${esc(i.name)}<br><strong>${yen(i.price)} → ${yen(newPrice)}</strong><br>${esc(date)} ／ ${esc(supplier||'仕入先未設定')} ／ ${esc(actor)}</div><p>確定すると価格改定履歴へ追加し、棚卸の現在価格へ反映します。過年度記録は変更しません。</p><div class="actions"><button class="btn" id="back">戻る</button><button class="btn gold" id="commit">確定して反映</button></div>`);$('back').onclick=()=>openPrice(i.id);$('commit').onclick=()=>commitPrice(i.id,newPrice,date,supplier,note)}
async function commitPrice(id,newPrice,effectiveDate,supplier,note){$('commit').disabled=true;setStatus('価格を保存中');try{const rec=doc(historyCol);await runTransaction(db,async tx=>{const snap=await tx.get(inventoryRef);if(!snap.exists())throw new Error('棚卸データがありません');const data=snap.data();const items=[...(data.allItems||[])];const index=items.findIndex(x=>Number(x.id)===Number(id));if(index<0)throw new Error('商品が見つかりません');if(!canAccessItem(items[index]))throw new Error('この商品の変更権限がありません');const old=Number(items[index].price)||0;const baseline=Number.isFinite(Number(items[index].previousYearPrice))?Number(items[index].previousYearPrice):old;items[index]={...items[index],price:newPrice,supplier,previousYearPrice:baseline,priceChangedSinceLastYear:newPrice!==baseline,priceChangedAt:nowIso(),priceChangedBy:actor,updatedAt:new Date().toLocaleString('ja-JP')};tx.update(inventoryRef,{allItems:items,updatedAt:nowIso()});tx.set(rec,{type:'price_change',itemId:id,storeId:Number(items[index].storeId),productName:items[index].name||'',unit:items[index].unit||'',supplier,oldPrice:old,newPrice,effectiveDate,changedBy:actor,note,createdAt:nowIso(),inventoryYear:Number(data.inventoryYear)||null});});closeModal();setStatus('クラウド保存済み')}catch(e){console.error(e);setStatus('保存失敗',true);alert(e.message||'保存できませんでした。通信状態と権限を確認してください。')}}
function openNew(){const stores=effectiveStores();openModal(`<h2>新商品を追加</h2><div class="grid"><div class="row"><label>店舗</label><select class="field" id="nStore">${stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="row"><label>商品名</label><input class="field" id="nName"></div><div class="row"><label>仕入先</label><input class="field" id="nSupplier"></div><div class="row"><label>カテゴリー</label><input class="field" id="nCat"></div><div class="row"><label>単位</label><input class="field" id="nUnit" placeholder="個・kg・本など"></div><div class="row"><label>初回価格</label><input class="field" id="nPrice" type="number" min="0" step="0.01"></div><div class="row"><label>登録日</label><input class="field" id="nDate" type="date" value="${new Date().toLocaleDateString('sv-SE')}"></div><div class="row"><label>税率</label><select class="field" id="nTax"><option value="">未設定</option><option value="8">8%</option><option value="10">10%</option></select></div></div><div class="actions"><button class="btn" id="cancel">戻る</button><button class="btn gold" id="add">棚卸へ追加</button></div>`);$('cancel').onclick=closeModal;$('add').onclick=addNew}
async function addNew(){const storeId=Number($('nStore').value),name=$('nName').value.trim(),supplier=$('nSupplier').value.trim(),cat=$('nCat').value.trim()||supplier||'その他',unit=$('nUnit').value.trim(),price=Number($('nPrice').value),effectiveDate=$('nDate').value,taxRate=Number($('nTax').value)||null;if(!name||!unit||!Number.isFinite(price)||price<0||!effectiveDate){alert('商品名・単位・初回価格・登録日を確認してください。');return}if(state.allItems.some(i=>Number(i.storeId)===storeId&&String(i.name).normalize('NFKC').replace(/\s/g,'').toLowerCase()===name.normalize('NFKC').replace(/\s/g,'').toLowerCase())){alert('同じ店舗に同名の商品があります。重複追加を中止しました。');return}if(!confirm(`${storeName(storeId)}へ「${name}」を ${yen(price)} で追加しますか？`))return;setStatus('新商品を保存中');try{const rec=doc(historyCol);await runTransaction(db,async tx=>{const snap=await tx.get(inventoryRef);if(!snap.exists())throw new Error('棚卸データがありません');const data=snap.data(),items=[...(data.allItems||[])];if(items.some(i=>Number(i.storeId)===storeId&&String(i.name).normalize('NFKC').replace(/\s/g,'').toLowerCase()===name.normalize('NFKC').replace(/\s/g,'').toLowerCase()))throw new Error('同名商品が登録されています');const max=Math.max(Number(data.nextItemId)||0,...items.map(i=>Number(i.id)||0));const id=max+1;const item={id,storeId,name,cat,supplier,qty:0,unit,price,taxRate,previousYearPrice:price,priceChangedSinceLastYear:false,newProduct:true,active:true,done:false,createdAt:new Date().toLocaleString('ja-JP'),updatedAt:new Date().toLocaleString('ja-JP'),image:''};items.push(item);tx.update(inventoryRef,{allItems:items,nextItemId:id+1,updatedAt:nowIso()});tx.set(rec,{type:'new_product',itemId:id,storeId,productName:name,unit,supplier,oldPrice:null,newPrice:price,effectiveDate,changedBy:actor,taxRate,createdAt:nowIso(),inventoryYear:Number(data.inventoryYear)||null});});closeModal();setStatus('クラウド保存済み')}catch(e){console.error(e);setStatus('保存失敗',true);alert(e.message||'保存できませんでした')}}
async function openHistory(){openModal('<h2>価格改定履歴</h2><div id="hist" class="history"><div class="empty">読み込んでいます…</div></div><div class="actions"><button class="btn" id="close">閉じる</button></div>');$('close').onclick=closeModal;try{const snap=await getDocs(query(historyCol,orderBy('createdAt','desc'),limit(500)));history=snap.docs.map(d=>({id:d.id,...d.data()}));const allowed=role==='admin'?history:history.filter(h=>Number(h.storeId)===Number(fixedStore));$('hist').innerHTML=allowed.length?allowed.map(h=>`<div class="history-item"><strong>${esc(h.productName)}</strong>　${h.type==='new_product'?'新商品':yen(h.oldPrice)+' → '+yen(h.newPrice)}<small>${esc(storeName(h.storeId))} ／ ${esc(h.effectiveDate||'')} ／ ${esc(h.changedBy||'')} ／ ${esc(h.supplier||'')}</small></div>`).join(''):'<div class="empty">履歴はまだありません</div>'}catch(e){$('hist').innerHTML='<div class="empty">履歴を読み込めませんでした</div>'}}
$('search').oninput=render;$('store').onchange=render;$('newBtn').onclick=openNew;$('historyBtn').onclick=openHistory;
try{await authenticate();onSnapshot(inventoryRef,s=>{if(!s.exists()){setStatus('棚卸データなし',true);return}state=s.data();setupStores();render();setStatus('クラウド同期済み');const requested=Number(params.get('item'));if(requested&&!deepLinkOpened){deepLinkOpened=true;openPrice(requested)}},e=>{console.error(e);setStatus('読込失敗',true)})}catch(e){setStatus(e.message,true);$('rows').innerHTML=`<tr><td colspan="7" class="empty">${esc(e.message)}</td></tr>`}
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>売上オーナーへ移動</title>
<script>
// 配布済みの旧URLを保ち、認証を備えた正式画面へ引き継ぐ。
(function(){
  var next = new URL('/sales-owner.html', location.origin);
  next.search = location.search;
  next.hash = location.hash;
  location.replace(next.toString());
})();
</script>
</head>
<body>
<p><a id="formal-owner-link" href="/sales-owner.html">売上オーナー画面へ移動</a></p>
<script>
document.getElementById('formal-owner-link').href = '/sales-owner.html' + location.search + location.hash;
</script>
</body>
</html>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Firebase設定
const firebaseConfig = {
  apiKey: "AIzaSyCkkIx44FVKmQdO6kQK_uQVloJccRo2cYo",
  authDomain: "zaiko2017inb.firebaseapp.com",
  projectId: "zaiko2017inb",
  storageBucket: "zaiko2017inb.firebasestorage.app",
  messagingSenderId: "705085250436",
  appId: "1:705085250436:web:f369b4981119887fa25bd1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ============================================================
// Firestore同期
// ============================================================
let _isSyncing = false;  // 二重保存防止フラグ
let _syncTimer = null;   // デバウンス用タイマー
let _lastSyncData = '';  // 前回保存データ（差分チェック用）
let _saveQueued = false; // 保存中に追加変更が来た場合の再保存フラグ
let _lastCloudData = null; // 最後に確認したクラウド状態（差分統合の基準）

function firestoreComparable(data) {
  return JSON.stringify({
    stores: data.stores,
    allItems: data.allItems,
    nextStoreId: data.nextStoreId,
    nextItemId: data.nextItemId,
    categories: data.categories,
    inventoryYear: data.inventoryYear
  });
}

function normalizeSyncYear(value) {
  const year = Number(value);
  return Number.isInteger(year) && year >= 2000 && year <= 2100 ? year : null;
}

function syncState(data) {
  return {
    stores: JSON.parse(JSON.stringify(data.stores || [])),
    allItems: JSON.parse(JSON.stringify(data.allItems || [])).map(i=>({...i,active:i.active!==false})),
    nextStoreId: data.nextStoreId || 5,
    nextItemId: data.nextItemId || 903,
    categories: JSON.parse(JSON.stringify(data.categories || {})),
    inventoryYear: normalizeSyncYear(data.inventoryYear)
  };
}

function mergeEntities(baseList, localList, remoteList) {
  const base = new Map((baseList || []).map(v => [String(v.id), v]));
  const local = new Map((localList || []).map(v => [String(v.id), v]));
  const merged = new Map((remoteList || []).map(v => [String(v.id), v]));

  // 基準から端末側で削除・変更されたものだけをリモート最新版へ反映
  base.forEach((baseValue, id) => {
    if (!local.has(id)) {
      merged.delete(id);
      return;
    }
    const localValue = local.get(id);
    if (JSON.stringify(localValue) !== JSON.stringify(baseValue)) merged.set(id, localValue);
  });

  // 端末側で新しく追加されたものを反映
  local.forEach((localValue, id) => {
    if (!base.has(id)) merged.set(id, localValue);
  });

  return Array.from(merged.values());
}

function mergeCategories(baseCategories, localCategories, remoteCategories) {
  const base = baseCategories || {};
  const local = localCategories || {};
  const merged = JSON.parse(JSON.stringify(remoteCategories || {}));
  const keys = new Set([...Object.keys(base), ...Object.keys(local)]);
  keys.forEach(key => {
    if (!(key in local) && key in base) {
      delete merged[key];
      return;
    }
    if (!(key in base) || JSON.stringify(local[key]) !== JSON.stringify(base[key])) {
      merged[key] = JSON.parse(JSON.stringify(local[key]));
    }
  });
  return merged;
}

function mergeInventoryChanges(baseData, localData, remoteData) {
  const base = syncState(baseData || {});
  const local = syncState(localData || {});
  const remote = syncState(remoteData || {});
  return {
    stores: mergeEntities(base.stores, local.stores, remote.stores),
    allItems: mergeEntities(base.allItems, local.allItems, remote.allItems),
    nextStoreId: Math.max(remote.nextStoreId || 5, local.nextStoreId || 5),
    nextItemId: Math.max(remote.nextItemId || 903, local.nextItemId || 903),
    categories: mergeCategories(base.categories, local.categories, remote.categories),
    inventoryYear: local.inventoryYear !== base.inventoryYear ? local.inventoryYear : remote.inventoryYear
  };
}

function applySyncState(data) {
  window._appStores = data.stores;
  window._appAllItems = data.allItems.map(i => ({...i, active:i.active!==false, image: ''}));
  window._appNextStoreId = data.nextStoreId || 5;
  window._appNextItemId = data.nextItemId || 903;
  window._appStoreCategories = data.categories || {};
  window._appInventoryYear = normalizeSyncYear(data.inventoryYear);
}

function localSavedTime() {
  try {
    const raw = localStorage.getItem('zaikoApp_v1');
    const savedAt = raw ? JSON.parse(raw)?.savedAt : null;
    const time = savedAt ? new Date(savedAt).getTime() : 0;
    return Number.isFinite(time) ? time : 0;
  } catch (_) {
    return 0;
  }
}

async function performFirestoreSave() {
  if (_isSyncing) {
    _saveQueued = true;
    return;
  }
  _isSyncing = true;
  if (typeof window.setSaveStatus === 'function') window.setSaveStatus('saving', 'クラウド保存中');
  try {
    const submitted = syncState({
      stores: window._appStores,
      allItems: window._appAllItems.map(i => ({...i, image: ''})), // 画像は除外
      nextStoreId: window._appNextStoreId,
      nextItemId: window._appNextItemId,
      categories: window._appStoreCategories,
      inventoryYear: window._appInventoryYear
    });
    const comparable = firestoreComparable(submitted);
    if (comparable === _lastSyncData) {
      if (typeof window.setSaveStatus === 'function') window.setSaveStatus('cloud', 'クラウド保存済み');
      return true;
    }

    const ref = doc(db, 'inventory', 'main');
    const merged = await runTransaction(db, async transaction => {
      const snap = await transaction.get(ref);
      const remote = snap.exists() ? snap.data() : {};
      const resolved = mergeInventoryChanges(_lastCloudData, submitted, remote);
      const saved = {...resolved, updatedAt: new Date().toISOString()};
      transaction.set(ref, saved);
      return saved;
    });

    // 保存中に端末側で追加変更があっても、クラウド側の別変更を保持して再統合する
    const latestLocal = syncState({
      stores: window._appStores,
      allItems: window._appAllItems.map(i => ({...i, image: ''})),
      nextStoreId: window._appNextStoreId,
      nextItemId: window._appNextItemId,
      categories: window._appStoreCategories,
      inventoryYear: window._appInventoryYear
    });
    const resolvedLocal = mergeInventoryChanges(submitted, latestLocal, merged);
    _lastCloudData = syncState(merged);
    _lastSyncData = firestoreComparable(merged);
    applySyncState(resolvedLocal);
    if (typeof saveData === 'function') saveData({ skipFirestore: true });
    if (typeof window.setSaveStatus === 'function') window.setSaveStatus('cloud', 'クラウド保存済み');
    console.log('Firestore保存完了');
    return true;
  } catch(e) {
    console.warn('Firestore保存エラー:', e);
    if (typeof window.setSaveStatus === 'function') {
      window.setSaveStatus(navigator.onLine ? 'error' : 'offline', navigator.onLine ? 'クラウド保存失敗' : 'オフライン・端末保存済み');
    }
    // オフライン時もlocalStorageに保存済みなので問題なし
    return false;
  } finally {
    _isSyncing = false;
    if (_saveQueued) {
      _saveQueued = false;
      // 保存中に変更された最新状態を待たずにもう一度保存する
      void performFirestoreSave();
    }
  }
}

// Firestoreにデータを保存（デバウンス付き・3秒待って保存）
window.saveToFirestore = function(options = {}) {
  clearTimeout(_syncTimer);
  if (options.immediate) return performFirestoreSave();
  _syncTimer = setTimeout(performFirestoreSave, 3000); // 連続操作時は最後の1回だけ保存
};

// アプリを閉じる・別画面へ移る直前に待ち時間なしで保存する
window.flushFirestoreSave = function() {
  return window.saveToFirestore({ immediate: true });
};

// Firestoreからデータを取得して適用
window.loadFromFirestore = async function() {
  try {
    const snap = await getDoc(doc(db, 'inventory', 'main'));
    if (!snap.exists()) {
      console.log('Firestoreにデータなし（初回起動）');
      return false;
    }
    const d = snap.data();
    if (!d.stores || !d.allItems) return false;
    _lastCloudData = syncState(d);

    // localStorageのデータと比較して新しい方を使う
    const localRaw = localStorage.getItem('zaikoApp_v1');
    const localData = localRaw ? JSON.parse(localRaw) : null;
    const localTime = localData?.savedAt ? new Date(localData.savedAt) : new Date(0);
    const cloudTime = d.updatedAt ? new Date(d.updatedAt) : new Date(0);

    if (cloudTime > localTime) {
      // クラウドの方が新しい → クラウドを適用
      applySyncState(syncState(d));
      _lastSyncData = firestoreComparable(d);
      if (typeof window.setSaveStatus === 'function') window.setSaveStatus('cloud', 'クラウド同期済み');
      console.log('Firestoreデータを適用（クラウドが新しい）');
      return true;
    } else {
      console.log('localStorageを使用（ローカルが新しい）');
      return false;
    }
  } catch(e) {
    console.warn('Firestore読み込みエラー（オフライン？）:', e);
    return false;
  }
};

// リアルタイム監視（他のユーザーが更新したら自動反映）
window.startFirestoreSync = function() {
  onSnapshot(doc(db, 'inventory', 'main'), (snap) => {
    if (!snap.exists()) return;
    const d = snap.data();
    if (!d.stores || !d.allItems) return;

    // 自分が保存中なら無視（自分の保存による更新通知をスキップ）
    if (_isSyncing) return;

    // 直前に保存・受信したものと同じ通知は再適用しない
    const newDataStr = firestoreComparable(d);
    if (newDataStr === _lastSyncData) {
      _lastCloudData = syncState(d);
      if (typeof window.setSaveStatus === 'function') window.setSaveStatus('cloud', 'クラウド同期済み');
      return;
    }

    // 端末側の保存日時より古いクラウドデータは適用しない
    const cloudTime = d.updatedAt ? new Date(d.updatedAt).getTime() : 0;
    const localTime = localSavedTime();
    if (Number.isFinite(cloudTime) && cloudTime < localTime) {
      console.log('古いFirestoreデータを無視（端末データが新しい）');
      _lastCloudData = syncState(d);
      // 端末側の最新版を待たずにクラウドへ戻す
      void window.saveToFirestore({ immediate: true });
      return;
    }

    // データが実際に変わっているため最新版として適用
    _lastSyncData = newDataStr;
    _lastCloudData = syncState(d);

    // アプリの状態を更新
    applySyncState(syncState(d));
    if (typeof window.setSaveStatus === 'function') window.setSaveStatus('cloud', 'クラウド同期済み');

    // 受信した最新版を端末にも保存する（Firestoreへの再送信はしない）
    if (typeof saveData === 'function') saveData({ skipFirestore: true });

    // UIを再描画
    if (typeof renderTabs === 'function') renderTabs();
    if (typeof render === 'function') render();
    if (typeof showToast === 'function') showToast('🔄 データが更新されました');
    console.log('Firestoreリアルタイム更新');
  });
};

// DOMContentLoaded後に初期化
window.addEventListener('DOMContentLoaded', async () => {
  // Firestoreからデータ取得
  const loaded = await window.loadFromFirestore();
  if (loaded) {
    // クラウドデータをlocalStorageにも同期
    if (typeof saveData === 'function') saveData({ skipFirestore: true });
    if (typeof renderTabs === 'function') renderTabs();
    if (typeof render === 'function') render();
  }
  // リアルタイム監視開始
  window.startFirestoreSync();
});
</script>
<script>
// LINEで共有
function shareToLine(){
  const storeAlias={1:'osu',2:'nagono',3:'teppan',4:'kamakura'}[window._appCurrentStoreId]||'osu';
  const url = 'https://zaiko-app-two.vercel.app/inventory.html?store='+storeAlias;
  // クリップボードにコピー
  navigator.clipboard.writeText(url).then(()=>{
    alert('URLをコピーしました！\nLINEのトーク画面に貼り付けて送ってください。\n\n' + url);
  }).catch(()=>{
    prompt('このURLをコピーしてLINEで送ってください', url);
  });
}

// Apps ScriptはFirestoreの保存データを読み込むため、まずクラウドへ確実に保存する。
// 年1回の確定保存はスプレッドシート側の「Zaikon連携」メニューから実行する。
async function sendToSpreadsheet(){
  const year=typeof requireInventoryYear==='function'?requireInventoryYear():null;
  if(!year) return;
  try{
    const saved=typeof window.flushFirestoreSave==='function'?await window.flushFirestoreSave():false;
    if(saved===false) throw new Error('cloud save failed');
    alert(`${year}年度の最新データを送信用に保存しました。\n\nスプレッドシートを開き、\n「Zaikon連携」→「② 連携シートへ安全同期」\nを押すと取り込めます。`);
  }catch(e){
    alert('送信用データの保存に失敗しました。通信状態を確認して、もう一度お試しください。');
  }
}
</script>

<!-- PWA_INSTALL_KIT_START (ホーム画面追加：SW登録＋インストールボタン＋LINE案内) -->
<div id="pwaBar" style="display:none;position:fixed;left:0;right:0;top:0;z-index:2147483000;background:#111;color:#fff;padding:12px 14px;font-size:14px;line-height:1.7;box-shadow:0 2px 10px rgba(0,0,0,.35);font-family:sans-serif;">
  <div style="font-weight:700;margin-bottom:4px;">📱 ホーム画面に追加する方法</div>
  <div id="pwaBarMsg" style="color:#ffe;"></div>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
    <button id="pwaBarCopy" style="background:#06c755;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;">🔗 URLをコピー</button>
    <button id="pwaBarClose" style="background:#555;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;">閉じる</button>
  </div>
</div>
<button id="pwaInstallBtn" style="display:none;position:fixed;right:14px;bottom:14px;z-index:2147483000;background:#06c755;color:#fff;border:0;border-radius:24px;padding:12px 18px;font-size:15px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.35);font-family:sans-serif;">📲 ホーム画面に追加</button>
<script>
(function(){
  try{
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }
    var ua=navigator.userAgent||'';
    var inLine=/Line\//i.test(ua);
    var isIOS=/iPhone|iPad|iPod/i.test(ua);
    var isMobile=/Android|iPhone|iPad|iPod/i.test(ua);
    var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
    var bar=document.getElementById('pwaBar');
    var msg=document.getElementById('pwaBarMsg');
    var btn=document.getElementById('pwaInstallBtn');
    var deferred=null;
    function stepText(){
      if(inLine) return isIOS? "右下メニュー→「Safariで開く」→ 下の共有ボタン（□に↑）→「ホーム画面に追加」" : "右上の「…」→「Chromeで開く」→ 右上の「⋮」→「ホーム画面に追加」";
      return isIOS? "下の共有ボタン（□に↑）→「ホーム画面に追加」" : "右上の「⋮」→「ホーム画面に追加」／「アプリをインストール」";
    }
    function showBar(){ if(!bar||!msg) return; msg.innerHTML=(inLine?"いまLINEの中で開いています。このままだと追加できません。<br>":"")+stepText(); bar.style.display='block'; }
    window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; if(btn&&!standalone) btn.style.display='block'; });
    window.addEventListener('appinstalled',function(){ if(btn) btn.style.display='none'; if(bar) bar.style.display='none'; });
    if(btn) btn.onclick=async function(){ if(deferred){ deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; btn.style.display='none'; } else { showBar(); } };
    var cbtn=document.getElementById('pwaBarClose'); if(cbtn) cbtn.onclick=function(){ if(bar) bar.style.display='none'; };
    var copyb=document.getElementById('pwaBarCopy'); if(copyb) copyb.onclick=async function(){ var u=location.href.split('#')[0]; try{ await navigator.clipboard.writeText(u); alert("URLをコピーしました。SafariまたはChromeのアドレス欄に貼り付けて開いてください：\n\n"+u); }catch(e){ alert("このURLをSafari/Chromeで開いてください：\n\n"+u); } };
    if(standalone) return;
    if(inLine){ showBar(); }
    else if(isIOS){ showBar(); }
    else if(isMobile && btn){ setTimeout(function(){ if(!standalone && !deferred && btn.style.display==='none'){ btn.style.display='block'; } }, 1500); }
  }catch(e){}
})();
</script>

// ============================================================
// IndexedDB 画像ストレージ
// ============================================================
const IDB_NAME = 'zaikoImages';
const IDB_STORE = 'images';
const IDB_VER = 1;
let _idb = null;

function openIDB(){
  return new Promise((resolve,reject)=>{
    if(_idb){resolve(_idb);return;}
    const req=indexedDB.open(IDB_NAME,IDB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        db.createObjectStore(IDB_STORE,{keyPath:'id'});
      }
    };
    req.onsuccess=e=>{_idb=e.target.result;resolve(_idb);};
    req.onerror=e=>reject(e);
  });
}

async function idbSaveImage(itemId, dataUrl){
  try{
    const db=await openIDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put({id:String(itemId),data:dataUrl});
      tx.oncomplete=()=>resolve(true);
      tx.onerror=e=>{
        console.warn('IDB save error',e);
        // QuotaExceededErrorを検知して分かりやすいメッセージを表示
        const err=e.target?.error;
        if(err?.name==='QuotaExceededError'||err?.name==='NS_ERROR_DOM_QUOTA_REACHED'){
          showToast('❌ 端末の保存容量が不足しています。設定→不要な写真データを削除してください。','#E24B4A');
        } else {
          showToast('❌ 写真の保存に失敗しました（'+( err?.message||'不明なエラー')+'）','#E24B4A');
        }
        reject(e);
      };
    });
  }catch(e){
    console.warn('IDB save error',e);
    showToast('❌ 写真の保存に失敗しました。端末の空き容量を確認してください。','#E24B4A');
    return false;
  }
}

async function idbGetImage(itemId){
  try{
    const db=await openIDB();
    return new Promise((resolve)=>{
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get(String(itemId));
      req.onsuccess=e=>resolve(e.target.result?.data||null);
      req.onerror=()=>resolve(null);
    });
  }catch(e){return null;}
}

async function idbDeleteImage(itemId){
  try{
    const db=await openIDB();
    return new Promise((resolve)=>{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(String(itemId));
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>resolve(false);
    });
  }catch(e){return false;}
}

  try{
    const db=await openIDB();
    return new Promise((resolve)=>{
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).getAllKeys();
      req.onsuccess=e=>resolve(e.target.result||[]);
      req.onerror=()=>resolve([]);
    });
  }catch(e){return [];}
}

function saveData(options={}){
  try{
    // 画像はIndexedDBで管理するのでlocalStorageには保存しない
    const noImg={stores,allItems:allItems.map(i=>({...i,image:''})),nextStoreId,nextItemId,currentStoreId,currentRole,inventoryYear,savedAt:new Date().toISOString()};
    const p=JSON.stringify(noImg);

    // ── 容量チェック（推定サイズが4.5MB超なら警告） ──
    const estimatedKB = Math.round((p.length * 2) / 1024); // UTF-16換算
    if(estimatedKB > 4500){
      console.warn('localStorage容量警告: 推定', estimatedKB, 'KB');
      showToast('⚠️ データが大きくなっています。バックアップを推奨します。','#E24B4A');
    }

    try{
      localStorage.setItem(STORAGE_KEY, p);
    }catch(storageErr){
      // QuotaExceededError を明示的に判定
      if(storageErr.name === 'QuotaExceededError' || storageErr.code === 22){
        console.error('localStorage容量不足', storageErr);
        showToast('❌ 保存容量が不足しています！設定→バックアップからデータを書き出してください。','#E24B4A');
        // バックアップキーだけでも更新を試みる（古いデータを一旦消してから保存）
        try{
          localStorage.removeItem(BACKUP_KEY);
          localStorage.setItem(BACKUP_KEY, p);
        }catch(_){}
        return;
      }
      throw storageErr; // その他のエラーは再スロー
    }

    localStorage.setItem(BACKUP_KEY, p);
    localStorage.setItem(CAT_KEY, JSON.stringify(STORE_CATEGORIES));
    setSaveStatus(navigator.onLine ? 'local' : 'offline', navigator.onLine ? '端末保存済み' : 'オフライン・端末保存済み');

    // Firestoreにも非同期で保存（オフライン時はスキップ）
    if (!options.skipFirestore && typeof window.saveToFirestore === 'function') {
      window.saveToFirestore();
    }
  }catch(e){
    console.warn('保存失敗', e);
    showToast('❌ 保存中にエラーが発生しました（'+e.message+'）','#E24B4A');
  }
}

function loadData(){
  // カテゴリーを読み込む
  try{
    const catRaw=localStorage.getItem(CAT_KEY);
    if(catRaw) STORE_CATEGORIES=JSON.parse(catRaw);
  }catch(e){
    console.warn('カテゴリーデータの読み込みに失敗しました。初期値を使用します。',e);
    STORE_CATEGORIES={};
  }

  let lastError = null;
  for(const key of[STORAGE_KEY,BACKUP_KEY]){
    try{
      const raw=localStorage.getItem(key); if(!raw) continue;
      const d=JSON.parse(raw); if(!d.stores||!d.allItems) continue;

      // allItemsの各アイテムを安全に検証（破損データを弾く）
      if(!Array.isArray(d.stores)||!Array.isArray(d.allItems)){
        console.warn(key+': データ形式が不正です');
        continue;
      }

      stores         = d.stores;
      // id, storeId, qty, price が数値であることを保証
      allItems       = d.allItems.map(item=>({
        ...item,
        id:      Number(item.id)      || 0,
        storeId: Number(item.storeId) || 1,
        qty:     Number(item.qty)     || 0,
        price:   Number(item.price)   || 0,
        done:    !!item.done,
        active:  item.active !== false,
        image:   '', // 画像はIndexedDBから取得するためここでは空
      }));
      nextStoreId    = d.nextStoreId    || 5;
      nextItemId     = d.nextItemId     || NEXT_ITEM_ID;
      currentStoreId = d.currentStoreId || 1;
      inventoryYear  = normalizeInventoryYear(d.inventoryYear);
      // ロールはsessionStorageで管理（localStorage改ざん防止）
      // ページリロード時はsessionStorageから復元、なければeditorに固定
      const sessionRole = sessionStorage.getItem('currentRole');
      currentRole = (sessionRole==='admin'||sessionRole==='editor'||sessionRole==='viewer') ? sessionRole : 'editor';
      if(key!==STORAGE_KEY) saveData();
      return true;
    }catch(e){
      lastError = e;
      console.warn(key+' 読み込みエラー:', e);
      continue;
    }
  }

  // 両方失敗した場合：デフォルトデータを使用するが警告を表示
  if(lastError){
    console.error('全データ読み込み失敗。デフォルトデータを使用します。', lastError);
    // DOMContentLoaded後にトーストを出す（DOM未準備の場合があるため遅延）
    setTimeout(()=>{
      showToast('⚠️ データの読み込みに失敗しました。デフォルト値で起動します。','#E24B4A');
    }, 500);
  }
  return false;
}

// ============================================================
async function hashPw(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function getRolePwHash(){
  const stored=localStorage.getItem(ROLE_PW_KEY);
  if(stored&&stored.length===64) return stored; // すでにハッシュ済み
  // 平文またはデフォルトの場合はハッシュ化して保存
  const pw=stored||DEFAULT_PW;
  const h=await hashPw(pw);
  localStorage.setItem(ROLE_PW_KEY,h);
  return h;
}

const ANNUAL_KEY = 'zaikoApp_annual'; // 年度別棚卸データ

function completeInventory(){
  const year=requireInventoryYear();
  if(!year) return;
  const storeName = stores.find(s=>s.id===currentStoreId)?.name||'';
  const fiscal = `${year}年度`;
  if(!confirm(storeName+'の棚卸を完了してExcelに保存しますか？\n\n年度: '+fiscal)){return;}

  // 1. Excelを自動出力
  if(!doExport(currentStoreId)) return;

  // 2. 年度別データに保存
  try{
    const annual = JSON.parse(localStorage.getItem(ANNUAL_KEY)||'{}');
    if(!annual[fiscal]) annual[fiscal]={};
    annual[fiscal][currentStoreId]={
      storeId: currentStoreId,
      storeName: storeName,
      fiscal: fiscal,
      savedAt: nowStr(),
      items: getStoreItems(currentStoreId).map(i=>({
        id:i.id, name:i.name, cat:i.cat, qty:i.qty, unit:i.unit, price:i.price
      }))
    };
    // 最大10年分保持
    const years = Object.keys(annual).sort();
    if(years.length>10) delete annual[years[0]];
    localStorage.setItem(ANNUAL_KEY, JSON.stringify(annual));
    showToast('✅ '+storeName+'の棚卸を完了しました（'+fiscal+'）');
  }catch(e){
    showToast('⚠️ 年度データの保存に失敗しました','#E24B4A');
  }
}

function exportAnnual(fiscal, storeId){
  const annual = JSON.parse(localStorage.getItem(ANNUAL_KEY)||'{}');
  const storeData = annual[fiscal]?.[storeId];
  if(!storeData){ showToast('データが見つかりません','#E24B4A'); return; }

  const wb = XLSX.utils.book_new();
  const headers=['商品名','カテゴリ','在庫数','単位','仕入単価（円）','在庫金額（円）'];
  const rows = storeData.items.map(i=>[i.name,i.cat,i.qty,i.unit,i.price,Math.round(i.qty*i.price)]);
  rows.push(['合計','','','','',Math.round(storeData.items.reduce((s,i)=>s+i.qty*i.price,0))]);
  const ws = XLSX.utils.aoa_to_sheet([headers,...rows]);
  ws['!cols']=[{wch:20},{wch:14},{wch:10},{wch:8},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws,storeData.storeName.slice(0,28));
  XLSX.writeFile(wb,`棚卸_${fiscal}_${storeData.storeName}.xlsx`);
}

function exportAnnualAll(fiscal){
  const annual = JSON.parse(localStorage.getItem(ANNUAL_KEY)||'{}');
  const yearData = annual[fiscal];
  if(!yearData){ showToast('データが見つかりません','#E24B4A'); return; }

  const wb = XLSX.utils.book_new();
  const headers=['商品名','カテゴリ','在庫数','単位','仕入単価（円）','在庫金額（円）'];

  Object.values(yearData).forEach(s=>{
    const rows = s.items.map(i=>[i.name,i.cat,i.qty,i.unit,i.price,Math.round(i.qty*i.price)]);
    rows.push(['合計','','','','',Math.round(s.items.reduce((sum,i)=>sum+i.qty*i.price,0))]);
    const ws = XLSX.utils.aoa_to_sheet([headers,...rows]);
    ws['!cols']=[{wch:20},{wch:14},{wch:10},{wch:8},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb,ws,s.storeName.slice(0,28));
  });

  // サマリーシート
  const summary=[['店舗名','品目数','在庫総額（円）'],...Object.values(yearData).map(s=>[
    s.storeName, s.items.length, Math.round(s.items.reduce((sum,i)=>sum+i.qty*i.price,0))
  ])];
  const ws2=XLSX.utils.aoa_to_sheet(summary);
  ws2['!cols']=[{wch:16},{wch:10},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws2,'サマリー');
  XLSX.writeFile(wb,`棚卸_${fiscal}_全店舗.xlsx`);
}

function saveInventoryHistory(){
  try{
    const histories = JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
    const snapshot = {
      date: nowStr(),
      dateKey: new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit'}).replace(/\//g,'-'),
      items: allItems.filter(isActiveItem).map(i=>({id:i.id, storeId:i.storeId, name:i.name, cat:i.cat, qty:i.qty, price:i.price, unit:i.unit}))
    };
    // 同じ月のデータは上書き
    const idx = histories.findIndex(h=>h.dateKey===snapshot.dateKey);
    if(idx>=0) histories[idx]=snapshot; else histories.push(snapshot);
    // 最大24ヶ月分保持
    if(histories.length>24) histories.shift();
    localStorage.setItem(HISTORY_KEY, JSON.stringify(histories));
    showToast('✅ 棚卸履歴を保存しました（'+snapshot.dateKey+'）');
  }catch(e){ showToast('❌ 履歴保存に失敗しました','#E24B4A'); }
}

function renderHistoryStore(storeId, btn){
  // タブのアクティブ切替
  if(btn){
    document.querySelectorAll('#modal-content .stab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  }
  const latest = window._histLatest;
  const prev   = window._histPrev;
  const items  = latest.items.filter(i=>i.storeId===storeId);
  if(!items.length){
    document.getElementById('hist-content').innerHTML=`<div style="text-align:center;padding:20px;color:var(--tf)">この店舗のデータがありません</div>`;
    return;
  }

  // 合計金額
  const totalNow  = items.reduce((s,i)=>s+i.qty*i.price, 0);
  const prevItems = prev ? prev.items.filter(i=>i.storeId===storeId) : [];
  const totalPrev = prevItems.reduce((s,i)=>s+i.qty*i.price, 0);
  const totalDiff = totalNow - totalPrev;

  const summaryHtml = prev ? `
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div style="flex:1;background:var(--bg);border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:var(--tm)">前回</div>
        <div style="font-size:14px;font-weight:700">${yen(totalPrev)}</div>
      </div>
      <div style="flex:1;background:var(--bg);border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:var(--tm)">今回</div>
        <div style="font-size:14px;font-weight:700">${yen(totalNow)}</div>
      </div>
      <div style="flex:1;background:${totalDiff>0?'#E8F8F2':totalDiff<0?'#FEE':'var(--bg)'};border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:var(--tm)">増減</div>
        <div style="font-size:14px;font-weight:700;color:${totalDiff>0?'#1D9E75':totalDiff<0?'#E24B4A':'var(--tf)'}">${totalDiff>0?'+':''}${yen(totalDiff)}</div>
      </div>
    </div>` : `
    <div style="background:var(--bg);border-radius:8px;padding:10px;text-align:center;margin-bottom:12px">
      <div style="font-size:12px;color:var(--tm)">今回合計</div>
      <div style="font-size:18px;font-weight:700">${yen(totalNow)}</div>
    </div>`;

  const rows = items.map(i=>{
    const p = prevItems.find(p=>p.id===i.id);
    const diff = p ? i.qty - p.qty : null;
    const diffHtml = diff===null ? '<span class="hist-badge same">初回</span>'
      : diff>0 ? `<span class="hist-badge up">+${fmt(diff)}</span>`
      : diff<0 ? `<span class="hist-badge down">${fmt(diff)}</span>`
      : '<span class="hist-badge same">±0</span>';
    return `<tr>
      <td>${esc(i.name)}</td>
      <td class="r">${fmt(i.qty)} ${esc(i.unit)}</td>
      <td class="r">${diffHtml}</td>
    </tr>`;
  }).join('');

  document.getElementById('hist-content').innerHTML = summaryHtml +
    `<table class="hist-table">
      <thead><tr><th>商品名</th><th class="r">在庫数</th><th class="r">前回比</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ============================================================
// インライン編集
// ============================================================
function inlineUpdate(id,field,val){
  const item=allItems.find(i=>i.id===id); if(!item) return;
  const num=parseFloat(val); if(isNaN(num)||num<0) return;
  const marksComplete=field==='qty';
  if(item[field]===num && !(marksComplete&&!item.done)) return;
  // Undo用に変更前の状態を記録
  _undoStack.push({id,field,prev:item[field],next:num,name:item.name,donePrev:!!item.done});
  if(_undoStack.length>20) _undoStack.shift(); // 最大20件
  updateUndoBtn();
  item[field]=num;
  if(marksComplete) item.done=true;
  item.updatedAt=nowStr(); saveData();
  const el=document.getElementById(`val-${id}`); if(el) el.textContent=yen(item.qty*item.price);
  const elc=document.getElementById(`cval-${id}`); if(elc) elc.textContent=yen(item.qty*item.price);
  updateStats();
  updateAllStoresTotal();
  applyInputCompleteVisual(id);
  // Undoボタンをrender後に再適用（DOMが残っている場合も確実に有効化）
  updateUndoBtn();
}

function applyInputCompleteVisual(id){
  const card=document.querySelector(`.card[data-item-id="${id}"]`);
  if(card) card.classList.add('done-card');
  const row=document.querySelector(`tr[data-item-id="${id}"]`);
  if(row) row.classList.add('done-row');
  document.querySelectorAll(`[data-status-id="${id}"]`).forEach(status=>{
    status.textContent='✅ 入力済み';
    status.style.background='var(--done-bd)';
    status.style.color='var(--gr)';
  });
  document.querySelectorAll(`[data-done-action-id="${id}"]`).forEach(button=>{
    button.textContent=button.closest('tr')?'↩':'↩ 戻す';
    button.style.background='var(--sf)';
    button.style.color='var(--g)';
    button.style.borderColor='var(--g)';
  });
}

function inlineKeydown(e, id, field, el){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  // 全入力欄を取得してカーソル位置を記憶
  const all = Array.from(document.querySelectorAll(`.inline-input[data-field="${field}"]`));
  const idx = all.indexOf(el);
  // 値を保存（再描画なし）
  const item = allItems.find(i=>i.id===id);
  if(item){
    const num = parseFloat(el.value);
    const marksComplete=field==='qty';
    if(!isNaN(num) && num >= 0 && (item[field] !== num || (marksComplete&&!item.done))){
      _undoStack.push({id, field, prev:item[field], next:num, name:item.name, donePrev:!!item.done});
      if(_undoStack.length>20) _undoStack.shift();
      updateUndoBtn();
      item[field] = num;
      if(marksComplete) item.done=true;
      item.updatedAt = nowStr(); saveData();
      const valEl = document.getElementById(`val-${id}`);
      if(valEl) valEl.textContent = yen(item.qty*item.price);
      const cvalEl = document.getElementById(`cval-${id}`);
      if(cvalEl) cvalEl.textContent = yen(item.qty*item.price);
      updateStats(); updateAllStoresTotal();
      // 入力済み行をテーブル末尾（合計行の前）に移動＆薄グレーに
      const tbody = document.getElementById('tbody');
      if(tbody){
        const row = el.closest('tr');
        const totalRow = tbody.querySelector('.total-row');
        if(row && totalRow && row !== totalRow){
          row.classList.add('done-row');
          tbody.insertBefore(row, totalRow);
        }
      }
    }
  }
  // カーソルは同じ位置（idx）をキープ
  const newAll = Array.from(document.querySelectorAll(`.inline-input[data-field="${field}"]`));
  const target = newAll[idx] || newAll[newAll.length - 2]; // 合計行除く最後
  if(target){ target.focus(); target.select(); }
}

function undoLast(){
  if(!_undoStack.length){
    showToast('戻せる操作がありません。','#5B8DEF');
    return;
  }
  const u=_undoStack.pop();
  const item=allItems.find(i=>i.id===u.id); if(!item) return;
  // done・qty・price すべてのフィールドに対応
  if(u.field==='done'){
    // 完了操作を1回で完全に戻す
    item.done=false;
  } else {
    item[u.field]=u.prev;
    if(Object.prototype.hasOwnProperty.call(u,'donePrev')) item.done=u.donePrev;
  }
  // 戻した商品を一番上に表示するため updatedAt を現在時刻に
  item.updatedAt=nowStr();
  saveData();
  updateUndoBtn();
  updateStats();
  updateAllStoresTotal();
  // 戻した商品の店舗に切り替え
  if(currentStoreId!==item.storeId){
    currentStoreId=item.storeId;
    renderTabs();
  }
  // フィルタをリセットして必ず表示されるようにする
  _selectedCat=''; const sel=document.getElementById('search'); if(sel) sel.value=''; const lbl=document.getElementById('cat-filter-label'); if(lbl) lbl.textContent='カテゴリー'; const btn=document.getElementById('cat-filter-btn'); if(btn){btn.style.borderColor='var(--bd)';btn.style.color='var(--tm)';btn.style.background='var(--sf)';}
  const st=document.getElementById('search-text'); if(st) st.value='';
  // トースト文言を操作種別で分ける
  const label = u.field==='done' ? '完了操作' : u.field==='qty' ? '在庫数' : '単価';
  const detail = u.field==='done' ? `完了 → 未完了` : `${u.next} → ${u.prev}`;
  showToast(`↩️ ${u.name}の${label}を戻しました（${detail}）`, '#5B8DEF');
  render();
}

function updateUndoBtn(){
  const btn=document.getElementById('undo-btn');
  if(!btn) return;
  // disabled属性はクリックを完全にブロックするためCSSのみで制御
  btn.removeAttribute('disabled');
  if(_undoStack.length>0){
    const u=_undoStack[_undoStack.length-1];
    btn.title=`${u.name}の${u.field==='qty'?'在庫数':'単価'}: ${u.next}→${u.prev}`;
    btn.style.opacity='1';
    btn.style.pointerEvents='auto';
    btn.style.cursor='pointer';
  } else {
    btn.title='戻る操作がありません';
    btn.style.opacity='0.6';
    btn.style.pointerEvents='auto';
    btn.style.cursor='pointer';
  }
}

        :r.seePrice?`<div class="cf"><div class="cf-label">仕入単価</div><div class="cf-value">${yen(i.price)}</div></div>`:'';
      const valF=r.seePrice?`<div class="cf"><div class="cf-label">在庫金額</div><div style="font-size:12px;font-weight:600;color:var(--g)" id="cval-${i.id}">${yen(i.qty*i.price)}</div></div>`:'';
      const doneBtn=r.canEdit

      return`<div class="card${isDone?' done-card':''}" data-item-id="${i.id}"><div class="card-hdr"><div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">${th}<div style="min-width:0"><div style="font-weight:700;font-size:15px">${esc(i.name)}</div><div style="font-size:12px;color:var(--tm)">${esc(i.cat)}</div></div></div>${badge}</div><div class="card-body">${qtyF}${priceF}${valF}</div><div class="card-ftr"><span class="tlabel">🕐 ${esc(i.updatedAt)}</span>${act}</div></div>`;

function getProductCandidates(){
  const groupIds=masterGroupStoreIds(currentStoreId);
  const currentItems=getStoreItems(currentStoreId,{includeInactive:true});
  const activeNames=new Set(currentItems.filter(isActiveItem).map(i=>normalizeProductName(i.name)));
  const grouped=new Map();
  allItems.filter(i=>groupIds.includes(i.storeId)).forEach(item=>{
    const key=normalizeProductName(item.name);
    if(!key||activeNames.has(key)) return;
    if(!grouped.has(key)) grouped.set(key,{key,name:item.name,sources:[]});
    grouped.get(key).sources.push(item);
  });
  return Array.from(grouped.values()).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
}

function openMasterCandidateModal(){
  const isKamakura=currentStoreId===4;
  const candidates=getProductCandidates();
  window._inventoryCandidates=candidates;
  document.getElementById('modal-content').innerHTML=`
    <h2>${isKamakura?'🍵 鎌倉専用商品候補':'🔗 3店舗共通商品候補'}</h2>
    <div style="font-size:12px;color:var(--tm);line-height:1.7;margin-bottom:12px">
      ${isKamakura?'鎌倉で以前使用した商品を再追加できます。':'大須・那古野・鉄板で登録済みの商品を、この店舗へ追加できます。'}<br>
      在庫数と仕入値は店舗ごとに別々に保存されます。
    </div>
    <input id="candidate-search" type="search" placeholder="商品名で検索" autocomplete="off"
      style="width:100%;height:44px;padding:0 12px;border:1.5px solid var(--g);border-radius:var(--rs);background:var(--bg);color:var(--tx);font-size:15px;outline:none;box-sizing:border-box;margin-bottom:10px">
    <div id="candidate-list" style="display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow-y:auto"></div>
    <div class="fa" style="margin-top:12px"><button class="btn btn-g" onclick="openItemModal()">手入力へ戻る</button></div>`;
  document.getElementById('candidate-search').addEventListener('input',renderMasterCandidateList);
  renderMasterCandidateList();
  openOverlay();
  setTimeout(()=>document.getElementById('candidate-search')?.focus(),80);
}

function renderMasterCandidateList(){
  const list=document.getElementById('candidate-list');
  if(!list) return;
  const q=normalizeProductName(document.getElementById('candidate-search')?.value||'');
  const all=window._inventoryCandidates||[];
  const filtered=(q?all.filter(c=>normalizeProductName(c.name).includes(q)):all).slice(0,150);
  if(!filtered.length){
    list.innerHTML='<div style="text-align:center;padding:24px;color:var(--tf)">追加できる商品候補がありません</div>';
    return;
  }
  window._visibleInventoryCandidates=filtered;
  list.innerHTML=filtered.map((candidate,index)=>{
    const storeNames=[...new Set(candidate.sources.map(i=>stores.find(s=>s.id===i.storeId)?.name||''))].filter(Boolean).join('・');
    const prices=[...new Set(candidate.sources.map(i=>Number(i.price)||0))];
    const priceText=prices.length===1?yen(prices[0]):prices.map(yen).join(' / ');
    const inactiveHere=candidate.sources.some(i=>i.storeId===currentStoreId&&!isActiveItem(i));
    return `<button type="button" class="candidate-row" data-candidate-index="${index}" style="width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--rs);padding:10px 12px;color:var(--tx);cursor:pointer;font-family:inherit">
      <div style="font-size:14px;font-weight:700">${esc(candidate.name)}</div>
      <div style="font-size:11px;color:var(--tm);margin-top:3px">${inactiveHere?'この店舗で再使用':'登録：'+esc(storeNames)} ／ 参考価格：${esc(priceText)}</div>
    </button>`;
  }).join('');
  list.querySelectorAll('.candidate-row').forEach(row=>row.addEventListener('click',()=>useMasterCandidate(Number(row.dataset.candidateIndex))));
}

function useMasterCandidate(index){
  const candidate=window._visibleInventoryCandidates?.[index];
  if(!candidate) return;
  const inactiveItem=candidate.sources.find(i=>i.storeId===currentStoreId&&!isActiveItem(i));
  if(inactiveItem){
    activateCandidateItem(inactiveItem);
    return;
  }
  const priceChoices=[];
  candidate.sources.forEach(source=>{
    if(!priceChoices.some(p=>p.price===source.price&&p.unit===source.unit)) priceChoices.push(source);
  });
  if(priceChoices.length>1){
    window._candidatePriceChoices={candidate,sources:priceChoices};
    document.getElementById('modal-content').innerHTML=`
      <h2>💰 参考価格を選ぶ</h2>
      <div style="font-size:14px;font-weight:700;margin-bottom:4px">${esc(candidate.name)}</div>
      <div style="font-size:12px;color:var(--tm);margin-bottom:12px">追加後も、この店舗専用の価格へ変更できます。</div>
      <div id="candidate-price-list" style="display:flex;flex-direction:column;gap:7px"></div>
      <div class="fa" style="margin-top:12px"><button class="btn btn-g" onclick="openMasterCandidateModal()">戻る</button></div>`;
    const list=document.getElementById('candidate-price-list');
    list.innerHTML=priceChoices.map((source,sourceIndex)=>`<button type="button" class="btn btn-g candidate-price-row" data-source-index="${sourceIndex}" style="width:100%;height:48px;justify-content:space-between"><span>${esc(stores.find(s=>s.id===source.storeId)?.name||'参考')}</span><strong>${yen(Number(source.price)||0)}／${esc(source.unit)}</strong></button>`).join('');
    list.querySelectorAll('.candidate-price-row').forEach(row=>row.addEventListener('click',()=>{
      const source=window._candidatePriceChoices?.sources?.[Number(row.dataset.sourceIndex)];
      if(source) addCandidateFromSource(window._candidatePriceChoices.candidate,source);
    }));
    return;
  }
  addCandidateFromSource(candidate,priceChoices[0]||candidate.sources[0]);
}

function activateCandidateItem(item){
  if(!item) return;
  item.active=true;
  item.qty=0;
  item.done=false;
  if(!(STORE_CATEGORIES[currentStoreId]||[]).includes(item.cat)) item.cat=getCategories()[0]||'その他';
  item.updatedAt=nowStr();
  saveData();
  render();

function handleImg(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    // 画像を強力圧縮（棚卸用途なので小さくても実用的）
    const img=new Image();
    img.onload=()=>{
      // 最大400px・品質40%で約15〜25KBに圧縮（250枚で約5〜6MB）
      const MAX=400;
      let w=img.width, h=img.height;
      if(w>MAX||h>MAX){
        if(w>h){h=Math.round(h*MAX/w);w=MAX;}
        else{w=Math.round(w*MAX/h);h=MAX;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);

      // 段階的圧縮：まず品質40%で試し、20KB超えたらさらに圧縮
      let quality=0.40;
      let dataUrl=canvas.toDataURL('image/jpeg',quality);
      const sizeKB=Math.round((dataUrl.length*3/4)/1024);
      if(sizeKB>20){
        // さらに小さくする
        quality=Math.max(0.20, quality*(20/sizeKB));
        dataUrl=canvas.toDataURL('image/jpeg',quality);
      }

      pendingImage=dataUrl;
      const finalKB=Math.round((dataUrl.length*3/4)/1024);
      console.log('写真圧縮完了:', finalKB+'KB', '('+w+'x'+h+'px, 品質'+Math.round(quality*100)+'%)');

      const prevEl=document.getElementById('img-preview');
      if(prevEl){
        const img2=document.createElement('img');img2.className='img-prev';img2.src=pendingImage;img2.id='img-preview';prevEl.replaceWith(img2);
      }
      const delBtn=document.getElementById('img-del-btn');
      if(delBtn) delBtn.style.display='inline-flex';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function clearImg(){
  pendingImage='';
  const prevEl2=document.getElementById('img-preview');
  if(prevEl2){
    const ph=document.createElement('div');ph.className='img-ph';ph.id='img-preview';ph.onclick=()=>document.getElementById('f-img-file').click();ph.innerHTML='🖼<span style="font-size:10px;margin-top:2px">タップして選択</span>';prevEl2.replaceWith(ph);
  }
  const delBtn2=document.getElementById('img-del-btn');
  if(delBtn2) delBtn2.style.display='none';
}
async function saveItem(cont=false){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('商品名を入力してください');return;}
  const selCat=document.getElementById('f-cat').value;
  const selUnit=document.getElementById('f-unit').value;
  const obj={name,storeId:currentStoreId,cat:selCat,qty:Math.max(0,parseFloat(document.getElementById('f-qty').value)||0),unit:selUnit,price:Math.max(0,parseFloat(document.getElementById('f-price').value)||0),updatedAt:nowStr(),active:true,image:''};
  let savedId;
  if(editingItem){
    Object.assign(editingItem,obj);
    savedId=editingItem.id;
  }else{
    obj.createdAt=nowStr();
    savedId=nextItemId++;
    allItems.push({id:savedId,...obj});
  }
  // 画像をIndexedDBに保存
  if(pendingImage!==null){
    if(pendingImage===''){
      await idbDeleteImage(savedId);
    } else {
      await idbSaveImage(savedId, pendingImage);
    }
  }
  saveData(); render();
  if(cont&&!editingItem){_lastCat=selCat;_lastUnit=selUnit;openItemModal(null,true);}
  else{closeModal();}
}
async function deleteItem(id){
  if(!confirm('この商品を削除しますか？')) return;
  allItems=allItems.filter(i=>i.id!==id);
  await idbDeleteImage(id); // 画像も確実に削除してから保存
  saveData(); render();
}

function toggleDone(id){
  const item=allItems.find(i=>i.id===id); if(!item) return;
  if(!item.done){
    // 同じ商品の直前のqty/price変更をスタックから除去して完了操作1件に集約
    // （在庫入力→完了を1回のUndoで戻せるようにする）
    while(_undoStack.length>0 && _undoStack[_undoStack.length-1].id===id && _undoStack[_undoStack.length-1].field!=='done'){
      _undoStack.pop();
    }
    _undoStack.push({id, field:'done', prev:false, next:true, name:item.name});
    if(_undoStack.length>20) _undoStack.shift();
    updateUndoBtn();
  }
  item.done=!item.done;
  item.updatedAt=nowStr();
  saveData();
  render();
  if(item.done) showToast('✅ 完了しました！一番下に移動します');
}

function addCat(){
  const inp=document.getElementById('new-cat-inp');
  const name=inp.value.trim();
  if(!name) return;
  if(!STORE_CATEGORIES[currentStoreId]) STORE_CATEGORIES[currentStoreId]=[];
  if(STORE_CATEGORIES[currentStoreId].includes(name)){alert('同じ名前のカテゴリーが既にあります');return;}
  STORE_CATEGORIES[currentStoreId].push(name);
  inp.value=''; // 入力欄をクリア
  saveData(); renderCatModal();
  // カテゴリー検索ボタンのモーダルも更新
  const si=getStoreItems(currentStoreId);
  window._catModalCats=[...new Set(si.map(i=>i.cat))].filter(Boolean).sort();
  window._catModalCounts={};
  window._catModalCats.forEach(c=>{window._catModalCounts[c]=si.filter(i=>i.cat===c).length;});
  showToast(`✅ 「${name}」を追加しました`);
  setTimeout(()=>document.getElementById('new-cat-inp')?.focus(),50);
}

function deleteCat(i){
  const cats=STORE_CATEGORIES[currentStoreId];
  const name=cats[i];
  const inUse=allItems.some(it=>it.storeId===currentStoreId&&it.cat===name);
  if(!confirm(`「${name}」を削除しますか？${inUse?'\n\nこのカテゴリーを使用中の商品は最初のカテゴリーに変更されます。':''}`)) return;
  if(inUse){
    const fallback=cats[0]===name?(cats[1]||'その他'):cats[0];
    allItems.forEach(it=>{if(it.storeId===currentStoreId&&it.cat===name)it.cat=fallback;});
  }
  STORE_CATEGORIES[currentStoreId].splice(i,1);
  saveData(); renderCatModal();
  showToast(`🗑 「${name}」を削除しました`);
}

function editCat(i){
  const cats=STORE_CATEGORIES[currentStoreId];
  const oldName=cats[i];
  const newName=prompt(`カテゴリー名を変更してください`,oldName);
  if(!newName||newName===oldName) return;
  if(cats.includes(newName)){alert('同じ名前のカテゴリーが既にあります');return;}
  // 商品のカテゴリーも更新
  allItems.forEach(it=>{if(it.storeId===currentStoreId&&it.cat===oldName)it.cat=newName;});
  STORE_CATEGORIES[currentStoreId][i]=newName;
  saveData(); renderCatModal();
  showToast(`✅ 「${oldName}」→「${newName}」に変更しました`);
}

function doExport(scope){
  const year=requireInventoryYear();
  if(!year) return false;
  if(scope===undefined) scope='all';
  const wb=XLSX.utils.book_new();
  const headers=['商品名','カテゴリ','現在庫','単位','仕入れ単価（円）','在庫金額（円）','状態','登録日時','更新日時'];
  const cols=[{wch:20},{wch:14},{wch:10},{wch:8},{wch:16},{wch:16},{wch:10},{wch:18},{wch:18}];
  const buildRows=sid=>{
    const items=getStoreItems(sid).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
    const rows=items.map(i=>[i.name,i.cat,i.qty,i.unit,i.price,parseFloat((i.qty*i.price).toFixed(2)),i.qty===0?'在庫切れ':'在庫あり',i.createdAt||'',i.updatedAt]);
    rows.push(['合計','','','','',parseFloat(items.reduce((s,i)=>s+i.qty*i.price,0).toFixed(2)),'','','']);
    return rows;
  };
  if(scope==='all'){
    stores.forEach(s=>{const ws=XLSX.utils.aoa_to_sheet([headers,...buildRows(s.id)]);ws['!cols']=cols;XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,28).replace(/[\/*?[\]:]/g,'_'));});
    const ws2=XLSX.utils.aoa_to_sheet([['店舗名','商品数','在庫切れ数','在庫総額（円）'],...stores.map(s=>{const it=getStoreItems(s.id);return[s.name,it.length,it.filter(i=>i.qty===0).length,parseFloat(it.reduce((a,i)=>a+i.qty*i.price,0).toFixed(2))];})]);
    ws2['!cols']=[{wch:16},{wch:10},{wch:12},{wch:16}];XLSX.utils.book_append_sheet(wb,ws2,'サマリー');
  }else{
    const sid=parseInt(scope);
    const s=stores.find(s=>s.id===sid);
    const ws=XLSX.utils.aoa_to_sheet([headers,...buildRows(sid)]);ws['!cols']=cols;
    XLSX.utils.book_append_sheet(wb,ws,s?.name||'在庫');
  }
  XLSX.writeFile(wb,`在庫管理_${year}年度_${getDateStamp()}.xlsx`);closeModal();
  return true;
}

async function cleanupOrphanImages(){

    const validItemIds = new Set(allItems.map(i=>String(i.id)));
    const orphans = allImageIds.filter(id=>!validItemIds.has(String(id)));
    if(orphans.length===0){

    }
    await Promise.all(orphans.map(id=>idbDeleteImage(id)));
    showToast(`✅ ${orphans.length}件の不要画像を削除しました`);
  }catch(e){
    console.warn('cleanupOrphanImages error', e);
    showToast('❌ クリーンアップに失敗しました','#E24B4A');
  }
}

function resetAllQtyToZero(){
  const year=requireInventoryYear();
  if(!year) return;
  const scope=document.getElementById('zero-scope')?.value||'all';
  const targetStores = scope==='all' ? stores.map(s=>s.id) : [parseInt(scope)];
  const targetNames = targetStores.map(id=>stores.find(s=>s.id===id)?.name||'').join('・');
  // 数量0を入力して完了した品目も、次年度に「入力済み」が残らないよう対象に含める。
  const targetItems = allItems.filter(i=>targetStores.includes(i.storeId)&&isActiveItem(i)&&(i.qty!==0||i.done));

  if(targetItems.length===0){
    showToast('リセットする在庫・入力済み状態がありません。','#E24B4A');
    return;
  }

  if(!confirm(`【${targetNames}】の在庫数を全てゼロにします。\n\n対象：${targetItems.length}件\n\n先にExcelファイルで現在の在庫データを保存します。\nよろしいですか？`)) return;

  // ① まず現在データをExcelで保存
  try{
    const wb=XLSX.utils.book_new();
    const headers=['商品名','カテゴリ','現在庫','単位','仕入れ単価（円）','在庫金額（円）','状態','更新日時'];
    const cols=[{wch:22},{wch:14},{wch:10},{wch:8},{wch:16},{wch:16},{wch:10},{wch:18}];
    const now=nowStr();

    if(scope==='all'){
      stores.forEach(s=>{
        const items=getStoreItems(s.id).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
        const rows=items.map(i=>[i.name,i.cat,i.qty,i.unit,i.price,parseFloat((i.qty*i.price).toFixed(2)),i.qty===0?'在庫切れ':'在庫あり',i.updatedAt]);
        rows.push(['合計','','','','',parseFloat(items.reduce((s,i)=>s+i.qty*i.price,0).toFixed(2)),'','']);
        const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);ws['!cols']=cols;
        XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,28).replace(/[\/*?\[\]:]/g,'_'));
      });
      // サマリーシート
      const ws2=XLSX.utils.aoa_to_sheet([
        ['店舗名','商品数','在庫切れ数','在庫総額（円）'],
        ...stores.map(s=>{const it=getStoreItems(s.id);return[s.name,it.length,it.filter(i=>i.qty===0).length,parseFloat(it.reduce((a,i)=>a+i.qty*i.price,0).toFixed(2))];})
      ]);
      ws2['!cols']=[{wch:16},{wch:10},{wch:12},{wch:16}];
      XLSX.utils.book_append_sheet(wb,ws2,'サマリー');
    } else {
      const s=stores.find(s=>s.id===currentStoreId);
      const items=getStoreItems(currentStoreId).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
      const rows=items.map(i=>[i.name,i.cat,i.qty,i.unit,i.price,parseFloat((i.qty*i.price).toFixed(2)),i.qty===0?'在庫切れ':'在庫あり',i.updatedAt]);
      rows.push(['合計','','','','',parseFloat(items.reduce((s,i)=>s+i.qty*i.price,0).toFixed(2)),'','']);
      const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);ws['!cols']=cols;
      XLSX.utils.book_append_sheet(wb,ws,s?.name||'在庫');
    }

    const time=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}).replace(/:/g,'');
    XLSX.writeFile(wb,`在庫ゼロリセット前_${year}年度_${getDateStamp()}_${time}.xlsx`);
  }catch(e){
    alert('Excelの保存に失敗しました：'+e.message+'\n\n在庫ゼロリセットを中止します。');
    return;
  }

  // ② ゼロリセット実行
  const resetNow=nowStr();
  targetItems.forEach(i=>{ i.qty=0; i.done=false; i.updatedAt=resetNow; });
  saveData();
  closeModal();
  render();
  updateStats();
  updateAllStoresTotal();
  showToast(`✅ ${targetItems.length}件の在庫をゼロにしました（Excel保存済み）`,'var(--r)');
}

function getDateStamp(){
  const now = new Date();
  const y = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  return `${y}${mm}${dd}`;
}

function validateBackupData(d){
  if(!d||!Array.isArray(d.stores)||!Array.isArray(d.allItems)||!d.stores.length){
    return '店舗または商品データがありません。';
  }
  const storeIds=new Set();
  for(const store of d.stores){
    const id=Number(store?.id);
    if(!Number.isFinite(id)||id<=0||typeof store?.name!=='string'||!store.name.trim()||storeIds.has(id)){
      return '店舗データの形式が正しくありません。';
    }
    storeIds.add(id);
  }
  const itemIds=new Set();
  for(const item of d.allItems){
    const id=Number(item?.id),storeId=Number(item?.storeId),qty=Number(item?.qty),price=Number(item?.price);
    if(!Number.isFinite(id)||id<=0||itemIds.has(id)||!storeIds.has(storeId)||typeof item?.name!=='string'||!item.name.trim()||!Number.isFinite(qty)||qty<0||!Number.isFinite(price)||price<0){
      return '商品データの形式が正しくありません。';
    }
    itemIds.add(id);
  }
  if(d.inventoryYear!==undefined&&d.inventoryYear!==null&&!normalizeInventoryYear(d.inventoryYear)){
    return '棚卸年度の形式が正しくありません。';
  }
  if(d.categories!==undefined&&(typeof d.categories!=='object'||Array.isArray(d.categories)||d.categories===null)){
    return 'カテゴリーデータの形式が正しくありません。';
  }
  if(d.annualData!==undefined&&(typeof d.annualData!=='object'||Array.isArray(d.annualData)||d.annualData===null)){
    return '年度別データの形式が正しくありません。';
  }
  if(d.historyData!==undefined&&!Array.isArray(d.historyData)){
    return '棚卸履歴の形式が正しくありません。';
  }
  return '';
}
function importBackup(e){
  if(currentRole!=='admin'){
    e.target.value='';
    showToast('管理者だけが復元できます。','#E24B4A');
    return;
  }
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      const validationError=validateBackupData(d);
      if(validationError){
        alert('有効なバックアップファイルではありません。\n'+validationError);return;
      }
      const password=prompt('復元には管理者パスワードが必要です。\nパスワードを入力してください。');
      if(password===null)return;
      if(await hashPw(password)!==await getRolePwHash()){
        alert('管理者パスワードが違います。復元を中止しました。');return;
      }
      if(!confirm(`最終確認\n\nバックアップ（${d.exportedAt||'日時不明'}）を復元します。\n現在の共有データは全端末で上書きされます。\n写真は復元されません。\n\n本当に実行しますか？`))return;

      stores    = d.stores;
      allItems  = d.allItems.map(item=>({...item, image:''})); // 画像はIndexedDB管理のためクリア
      if(d.nextStoreId) nextStoreId=d.nextStoreId;
      inventoryYear=normalizeInventoryYear(d.inventoryYear);
      if(d.categories)  STORE_CATEGORIES=d.categories;
      if(d.annualData) localStorage.setItem(ANNUAL_KEY,JSON.stringify(d.annualData));
      if(d.historyData) localStorage.setItem(HISTORY_KEY,JSON.stringify(d.historyData));

      // nextItemId を全アイテムの最大ID+1 に設定（重複ID防止）
      const maxId = allItems.reduce((m,i)=>Math.max(m, Number(i.id)||0), 0);
      nextItemId = Math.max(d.nextItemId||NEXT_ITEM_ID, maxId+1);

      // 現在の店舗IDが存在するか確認してフォールバック
      const storeExists = stores.find(s=>s.id===currentStoreId);
      if(!storeExists) currentStoreId=stores[0]?.id||1;

      saveData();renderTabs();render();closeModal();
      showToast('✅ 復元が完了しました（写真は復元対象外です）');
    }catch(err){
      console.error('importBackup error', err);
      alert('ファイルの読み込みに失敗しました。JSONが破損している可能性があります。\n'+err.message);
    }
  };
  reader.readAsText(file);
}

    document.getElementById('access-pw-err').textContent='パスワードが違います。';
    document.getElementById('access-pw-inp').value='';
  }
}

// 2. DATA_VERSIONが変わっていたら安全にマイグレーション（ユーザーデータを保持）
const savedDV=localStorage.getItem(DATA_VER_KEY);
if(savedDV!==DATA_VERSION){
  // ユーザーが独自追加した商品（IDがNEXT_ITEM_ID以上）は必ず保持
  const userItems=allItems.filter(i=>i.id>=NEXT_ITEM_ID);
  // デフォルト商品は最新定義でマイグレーション（ユーザーが入力したqty・priceを優先）
  const mergedDefaults=DEFAULT_ITEMS.map(def=>{
    const existing=allItems.find(i=>i.id===def.id);
    if(existing){
      // ユーザー入力値（qty・price）を優先して保持。定義側はname・cat・unitのみ更新
      return {
        ...def,
        qty:      (typeof existing.qty==='number' && !isNaN(existing.qty)) ? existing.qty : def.qty,
        price:    (typeof existing.price==='number' && !isNaN(existing.price)) ? existing.price : def.price,
        updatedAt: existing.updatedAt || def.updatedAt,
        createdAt: existing.createdAt || def.createdAt,
        done:      !!existing.done,
        active:    existing.active !== false,
        image:     '', // 画像はIndexedDB管理
      };
    }
    return {...def, active:true, image:''};
  });
  allItems=[...mergedDefaults, ...userItems];
  localStorage.setItem(DATA_VER_KEY,DATA_VERSION);
  saveData();
}

// 3. 店舗名を常に固定
FIXED_STORES.forEach((name,i)=>{ if(stores[i]) stores[i].name=name; else stores.push({id:nextStoreId++,name}); });

// 4. UI初期化
applyRoleUI();
checkUpdate();
checkJustUpdated();
window.addEventListener('beforeunload',()=>{
  saveData();
  if(typeof window.flushFirestoreSave==='function') void window.flushFirestoreSave();
});
window.addEventListener('pagehide',()=>{
  saveData();
  if(typeof window.flushFirestoreSave==='function') void window.flushFirestoreSave();
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    saveData();
    if(typeof window.flushFirestoreSave==='function') void window.flushFirestoreSave();
  }
});
window.addEventListener('online',()=>{
  setSaveStatus('saving','再接続・クラウド保存中');
  if(typeof window.flushFirestoreSave==='function') void window.flushFirestoreSave();
});
window.addEventListener('offline',()=>setSaveStatus('offline','オフライン・端末保存済み'));
setSaveStatus(navigator.onLine ? 'local' : 'offline', navigator.onLine ? '端末保存済み' : 'オフライン・端末保存済み');
renderTabs();
render();

// 入室パスワード画面（DOM準備完了後に表示）
showEntryPasswordScreen();

// Undoボタンはinline onclickではなくaddEventListenerで登録（インラインスタイル干渉を回避）
document.getElementById('undo-btn').addEventListener('click', function(e){
  e.preventDefault();
  undoLast();
});
</script>
</body>
</html>
